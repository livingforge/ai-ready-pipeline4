[workspace]
members = ["crates/arp4-cli"]
resolver = "2"

[workspace.package]
version = "1.0.0-alpha.1"
edition = "2024"
license = "MIT"
rust-version = "1.98"

# Tests spend most of their time in dependency code (zip, SQLite, JSON Schema).
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
