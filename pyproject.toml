[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-ready-pipeline4"
version = "4.0.0.dev0"
description = "既存資産（Excel・コード）を LLM が整理し、機械が正本として管理する仕様パイプライン"
requires-python = ">=3.11"
license = { text = "MIT" }

# 中核（メタモデル・正本・検証・生成）が使うのは YAML だけである。そこへ PDF の
# 読み手（`pypdfium2` と、焼いたページを PNG にする `Pillow`）を足してある ――
# **PDF は常に読める**と決めたので、入っているかどうかで振る舞いが変わる余地を
# 残さない。追加依存にしていたあいだは「読めた 1 冊」と「読めなかった 1 冊」が
# 環境で入れ替わり、申告・テストの飛ばし・正解の除外を**3 か所で同じ判定**して
# いた ―― 分岐そのものを消すほうが安い。
dependencies = [
    "PyYAML>=6.0",
    "pypdfium2>=4.30",
    "Pillow>=10.0",
    "jsonschema>=4.18",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
# 資料の取り込み（arp4 parse）。**使うときだけ import する。**
#
# Word・PowerPoint・PDF・CSV に追加の依存は要らない ―― OOXML は zip と XML なので
# 標準ライブラリで足り、CSV も同じで、PDF の読み手は本体依存にした。ここに残るのは
# Excel を読む openpyxl だけである。
parse = [
    "openpyxl>=3.1",
]

# シートの画像化（arp4 render）。Windows + Microsoft Excel が前提で、
# 図形・罫線・塗りを見た目どおり撮れるのは Excel 自身だけなので代替は無い
# （PDF へ書き出してから焼く道具は本体依存にある）。
render = [
    "openpyxl>=3.1",
    "pywin32>=306",
]

# 行・図形・数式の書き戻し。Excel本体が参照更新と保存を行う。
writeback = [
    "openpyxl>=3.1",
    "pywin32>=306; sys_platform == 'win32'",
]

# 旧導入コマンド .[parse,check] との互換性を保つ。
# markdown-it-py は文書正本の形式検証にも使うため、本体依存へ移した。
check = []

[project.scripts]
arp4 = "arp4.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arp4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
