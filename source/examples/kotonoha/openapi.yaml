# Kotonoha 社内エンベディング基盤 API
#
# ★★ この資材の仕込み F1 ★★
#
# **API 仕様の正本はこのファイルである。** ところが arp4 の parse が読む
# 拡張子は .xlsx / .xlsm / .py / .md / .txt / .sql / .ddl / .java で、
# .yaml は入っていない。
#
# つまり資料をそのまま機械へ渡すと、**API の正本だけが落ちる**。
# このとき正しい振る舞いは「資料に定義が無い」ではなく
# 「**機械が読めていない**」として申告することである ——
# 前者は「探したが無かった」、後者は「まだ見ていない」で、意味が違う。
#
# 実装側には api/schemas.py と tests/test_api.py があるので、
# 機械が読める形の仕様がまったく無いわけではない。ただし
# **ここにしか書かれていない**ものがある（下の ★ 印）。

openapi: 3.1.0

info:
  title: Kotonoha 社内エンベディング基盤 API
  version: 1.4.2
  description: |
    アダタム工業の社内向けエンベディング・検索基盤。

    各部門（テナント）へ、文書の取り込み・エンベディング生成・検索を提供する。
    **回答生成（LLM の呼び出し）は含まない** —— 各部門が自分で行う。

    機密区分 30（極秘）のデータは外部 API へ送出せず、社内 GPU の
    推論サーバで埋め込む。
  contact:
    name: デジタル基盤本部 AI基盤グループ
    email: ai-platform@adatum.example

servers:
  - url: https://kotonoha.internal.adatum.example
    description: 本番（社内ネットワークからのみ）
  - url: https://kotonoha-stg.internal.adatum.example
    description: 検証

security:
  - apiKey: []

tags:
  - name: embeddings
    description: エンベディング生成
  - name: collections
    description: コレクション（検索の単位）
  - name: documents
    description: 文書の取り込みと削除
  - name: search
    description: 検索
  - name: jobs
    description: ジョブの進捗
  - name: usage
    description: 利用量

paths:
  /healthz:
    get:
      tags: [ops]
      summary: 生きているか
      security: []
      responses:
        "200":
          description: 生きている
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string, example: 1.4.2 }

  /readyz:
    get:
      tags: [ops]
      summary: 受け付けられるか
      description: |
        ★ **依存（pgvector・OpenSearch・Redis）の疎通は見ていない。**
        プロセスが生きていれば ready を返す。既知の穴
        （docs/runbook/oncall.md）。
      security: []
      responses:
        "200":
          description: 受け付けられる

  /v1/embeddings:
    post:
      tags: [embeddings]
      summary: テキストをベクトルにする
      description: |
        取り込みを伴わない素のエンベディング。
        キャッシュに当たった分は課金に数えない（`usage.cached` に出る）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmbedRequest" }
      responses:
        "200":
          description: ベクトル
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbedResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/ProviderError" }

  /v1/collections:
    post:
      tags: [collections]
      summary: コレクションを作る
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCollection" }
      responses:
        "201":
          description: 作成した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [collections]
      summary: コレクションの一覧
      responses:
        "200":
          description: 自分のテナントのぶん
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, enum: [list] }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Collection" }

  /v1/collections/{collection_id}:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
    get:
      tags: [collections]
      summary: コレクションを引く
      responses:
        "200":
          description: 1 件
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/collections/{collection_id}/documents:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
    post:
      tags: [documents]
      summary: 文書を取り込む（非同期）
      description: |
        受付だけ返す。**まだ入っていない。**
        `Location` のジョブを引いて進捗を見ること。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestRequest" }
      responses:
        "202":
          description: 受け付けた
          headers:
            Location:
              description: 進捗を引く先
              schema: { type: string, example: /v1/jobs/9f3a… }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: 再インデックス中で受け付けられない（検索は続けられる）
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/collections/{collection_id}/documents/{document_id}:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
      - name: document_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [documents]
      summary: 文書を削除する
      description: 文書は論理削除、チャンクとベクトルは物理削除。
      responses:
        "204": { description: 消した }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/collections/{collection_id}/search:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
    post:
      tags: [search]
      summary: 検索する
      description: |
        ベクトルと全文（BM25）を RRF で融合し、リランクして返す。
        **月間上限に掛からない。**
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: 検索結果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [jobs]
      summary: ジョブの進捗を引く
      responses:
        "200":
          description: 進捗と失敗の明細
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/usage:
    get:
      tags: [usage]
      summary: 当月の利用量と上限を引く
      description: |
        ★ **金額は返さない。** 締める前の暫定値が独り歩きするため
        （docs/runbook/billing.md）。
      parameters:
        - name: month
          in: query
          schema: { type: string, pattern: "^[0-9]{6}$" }
          description: YYYYMM。省略すると当月
      responses:
        "200":
          description: 利用量
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer kot_…`

        一部の社内クライアントが `X-Api-Key` で投げてくるので受けているが、
        **推奨しない**（移行の途中）。

  parameters:
    CollectionId:
      name: collection_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    EmbedRequest:
      type: object
      required: [input]
      properties:
        input:
          type: array
          minItems: 1
          maxItems: 128
          items: { type: string }
        model:
          type: string
          maxLength: 64
          description: 省略するとテナントの既定
        input_type:
          type: string
          enum: [query, document]
          default: document
          description: |
            **retrieval では必ず指定する。** 検索語と文書で前置きが変わり、
            省くと精度が落ちる。

    EmbedResponse:
      type: object
      properties:
        object: { type: string, enum: [list] }
        model: { type: string }
        data:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              embedding:
                type: array
                items: { type: number, format: float }
              quantized:
                type: boolean
                description: ★ int8 量子化を掛けたか（ADR-003 に記載が無い）
        usage:
          type: object
          properties:
            billed: { type: integer, description: 課金対象の件数 }
            cached: { type: integer, description: キャッシュに当たった件数 }
            elapsed_ms: { type: integer }

    CreateCollection:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9_-]{0,127}$"
        classification:
          type: string
          enum: ["10", "20", "30"]
          description: 継承より**厳しい**区分にしたいときだけ指定する
        model:
          type: string
          maxLength: 64

    Collection:
      type: object
      properties:
        collection_id: { type: string, format: uuid }
        name: { type: string }
        classification: { type: string, enum: ["10", "20", "30"] }
        model: { type: string }
        dimension: { type: integer, example: 1024 }
        chunk_count: { type: integer }
        status:
          type: string
          enum: [A, R, D]
          description: A=有効 R=再構築中（取り込み不可・検索可） D=削除済
        created_at: { type: string, format: date-time }

    Document:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1 }
        external_id: { type: string, maxLength: 256 }
        title: { type: string, maxLength: 512 }
        content_type:
          type: string
          enum:
            - text/plain
            - text/markdown
            - text/html
            - application/pdf
            - text/csv
          default: text/plain
        metadata:
          type: object
          additionalProperties: true
          description: |
            検索の絞り込みに使う。**鍵は基盤側で正規化しない**ので、
            部門の中で揃えること。

    IngestRequest:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/Document" }

    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 2000
          description: 引用符で囲むと完全一致（`"A-2210"`）
        top_k: { type: integer, minimum: 1, maximum: 100, default: 10 }
        filters:
          type: object
          additionalProperties: true
          maxProperties: 16
        rerank:
          type: boolean
          description: |
            省略すると設定に従う。**極秘のコレクションでは掛からない**
            （リランクの提供元が外部 API しかないため）。
        explain:
          type: boolean
          default: false
          description: |
            ★ 点数の内訳を返す。**調査用。** この機能はどの設計文書にも
            書かれておらず、ここと実装（search/explain.py）にしか無い。

    SearchResponse:
      type: object
      properties:
        object: { type: string, enum: [list] }
        data:
          type: array
          items: { $ref: "#/components/schemas/Hit" }
        meta:
          type: object
          properties:
            candidates: { type: integer }
            reranked: { type: boolean }
            sources:
              type: array
              items: { type: string, enum: [vector, keyword] }
            elapsed_ms: { type: integer }

    Hit:
      type: object
      properties:
        chunk_id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        score: { type: number, format: float }
        title: { type: string }
        heading_path:
          type: string
          description: 見出しの階層（`1章 > 1.2 節`）
        seq_no: { type: integer }
        snippet:
          type: string
          description: |
            当たった箇所の切り出し。**強調のタグは付けない**
            （見せ方は利用側が決める）。
        metadata: { type: object, additionalProperties: true }
        explain:
          type: object
          description: ★ `explain: true` のときだけ
          properties:
            score: { type: number }
            k: { type: integer, example: 60 }
            contributions:
              type: object
              additionalProperties: { type: number }
            ranks:
              type: object
              additionalProperties: { type: integer }

    Job:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        status:
          type: string
          enum: [queued, running, succeeded, failed, canceled]
        total: { type: integer }
        done: { type: integer }
        failed: { type: integer }
        chunks: { type: integer, description: 課金対象のチャンク数 }
        cached_chunks: { type: integer, description: キャッシュに当たった数 }
        progress: { type: number, format: float }
        queued_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }

    JobDetail:
      allOf:
        - $ref: "#/components/schemas/Job"
        - type: object
          properties:
            failures:
              type: array
              maxItems: 100
              items:
                type: object
                properties:
                  seq_no: { type: integer }
                  external_id: { type: string, nullable: true }
                  error: { type: string }
            failures_truncated: { type: boolean }

    Usage:
      type: object
      properties:
        tenant_id: { type: string }
        year_month: { type: string, example: "202608" }
        quota:
          type: object
          properties:
            monthly_chunks: { type: integer }
            used: { type: integer }
            remaining: { type: integer }
            ratio: { type: number, format: float }
            warning:
              type: boolean
              description: 8 割を超えると真
        usage:
          type: object
          properties:
            embed_chunks: { type: integer }
            cached_chunks: { type: integer }
            search_calls: { type: integer }
            rerank_calls: { type: integer }
            gpu_seconds:
              type: integer
              description: 社内 GPU の占有秒（極秘テナントのみ）

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: |
                **`code` で分岐すること。** `message` は日本語で
                予告なく変わる。
              enum:
                - invalid_request
                - invalid_input
                - unauthorized
                - not_found
                - already_exists
                - quota_exceeded
                - rate_limited
                - classification_violation
                - provider_error
                - index_busy
                - method_not_allowed
                - internal_error
            message: { type: string }
            detail: { type: object, additionalProperties: true }

  responses:
    BadRequest:
      description: 入力が不正
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: API キーが無い／不正／テナントが停止中
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 機密区分の規則に反する
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 無い（**他テナントのものも 404**）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 同じ名前がある／再インデックス中
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: 秒間または月間の上限を超えた
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ProviderError:
      description: 埋め込みの提供元が失敗した
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
