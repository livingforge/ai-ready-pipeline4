置き場: 受領/受注システム/tests/test_受注サービス.py
なぜ: |
  **テストは 1 本も設計書に出ていなかった。** `.py` は読めていたので骨格は
  取れるのだが、テストファイルも「モジュール」として詳細設計書へ流れるだけで、
  **テスト仕様書は空のまま**だった ―― 実際には 317 件あるのに、
  トレーサビリティは「要件 44 件すべてテスト漏れ」と出す。**事実に反する表**を
  出すほうが、空の表より悪い。

  集める規則は pytest のものをそのまま写す（`test_*.py` / `*_test.py` の中の
  `test` で始まる関数）。**規約であって解釈が要らない** ―― 呼ぶ側が名前で
  決めているものを、こちらだけ疑う理由が無い。

  **fixture と補助関数はテストと混ぜない。** 混ぜると整理層がテストケースを
  数えられず、「何件あるか」が言えなくなる。どの要件を検証しているか（`verifies`）
  を決めるのは整理層の仕事なので、機械はそこまで。
本文: |
  """受注サービスのテスト。"""
  import pytest

  from order.受注サービス import OrderService


  @pytest.fixture
  def service() -> OrderService:
      """テスト対象。"""
      return OrderService()


  def _注文(no: str = "ORD-000001") -> dict:
      """組み立ての補助（テストではない）。"""
      return {"no": no}


  def test_受注番号は採番テーブルから取る(service) -> None:
      """採番の単位は年度。"""
      assert service.register(_注文())


  def test_与信NGは差戻しになる(service) -> None:
      """差戻しは例外ではなく戻り値で返す。"""
      assert not service.register(_注文("ORD-000002"))


  class TestCancel:
      """取消のテスト。"""

      def test_出荷済みは取り消せない(self, service) -> None:
          """出荷済みは AlreadyShipped。"""
          with pytest.raises(Exception):
              service.cancel("ORD-000001", "誤登録")

