置き場: 受領/受注システム/src/order/受注ヘッダ.py
なぜ: |
  **デコレータを 1 つも出していなかった。** `@dataclass` が付いているかどうかは、
  そのクラスが値の入れ物なのか処理を持つ層なのかを分ける ―― 詳細設計書の `tier`
  （Common / Repository / Service / Validator）を決める最大の手がかりである。
  出していなかったあいだ、**57 モジュールの層分けを整理層が全部推測で付けていた。**

  **クラス直下の属性も出していなかった。** `@dataclass` だと分かっても、それが
  **何を持つ入れ物なのか**はどこにも書いていない ―― Java の
  `private String orderNo` にあたるものが Python 側だけ落ちていた形である。
  データ項目を起こす根拠がここにしか無い。

  `@property` は**呼び出しではなく値に見える**メンバかどうかを変えるので、
  同じく落とせない。どちらも AST に書いてあり、当てにいく作業が 1 つも無い。

  種類（クラス / フィールド / メソッド）は**構文木の位置だけ**で決める。
  `@property` を「プロパティ」と呼び替えるのは解釈なので、注釈は注釈のまま出す。
本文: |
  """受注ヘッダの値と、その組み立て。"""
  from dataclasses import dataclass, field


  @dataclass(frozen=True)
  class OrderHeader:
      """受注ヘッダ ―― 値の入れ物であって処理は持たない。"""

      order_no: str
      customer_cd: str
      order_date: str = "2026-04-01"
      lines: list[str] = field(default_factory=list)

      MAX_LINES = 20

      @property
      def line_count(self) -> int:
          """明細数（呼び出しではなく値に見える）。"""
          return len(self.lines)

      @staticmethod
      def parse(text: str) -> "OrderHeader":
          """1 行の文字列から組み立てる。"""
          raise ValueError


  class OrderHeaderValidator(BaseValidator):
      """受注ヘッダの検査 ―― こちらは処理の層である。"""

      def validate(self, header: OrderHeader) -> None:
          raise BusinessException
