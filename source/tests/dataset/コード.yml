# ソースコード ―― **骨格は AST で取る。曖昧でないものに LLM を使わない。**
#
# Excel は「セルの面」を紙の見た目へ寄せ直す必要があるが、コードは構文木に
# 書いてあるものを転記するだけである。ここに集めてあるのは、**転記のつもりで
# 落としていたもの** ―― 書いてある数と違うものを書くと、読み落としと違って
# 申告のしようがない。

置き場: 受領/受注システム/src/order/検索条件.py
なぜ: |
  **キーワード専用引数はまるごと消えていた。** `ast.arguments` は引数を 4 つの
  入れ物に分けて持つ（位置専用・普通・可変長・キーワード専用）のに、`args` しか
  読んでいなかった ―― `*` より後ろの引数が 1 つも出ない。

  読み落としなら申告できるが、これは**書いてある数と違うものを書いている**。
  詳細設計書に `plan_worksheet(worksheet, extent)` と出ていたものの実物は
  `(worksheet, extent=(0, 0), *, boxes=(), max_px=MAX_PX, ...)` で、**その表を
  見て書いた呼び出しは通らない。** 資料が間違っているのではなく、
  **機械が資料を作り替えている**ので、突き合わせようがない。

  既定値も出す ―― 「省略できるか」は呼ぶ側がまず知りたいことで、AST に書いて
  ある（当てにいく必要が 1 つも無い）。
本文: |
  """受注の検索条件。"""


  class SearchCriteria:
      """検索条件 ―― 画面とバッチの両方から呼ばれる。"""

      def build(self, keyword, /, limit: int = 50, *columns: str,
                order: str = "受注日", descending: bool = False,
                **options: object) -> "Query":
          """条件を組み立てる（並び順の既定は受注日の昇順）。"""
          raise ValueError

      @staticmethod
      def parse_period(text: str) -> tuple[str, str]:
          """`2026-04〜2026-09` を開始と終了に割る。"""
          raise ValueError

---

置き場: 受領/受注システム/src/order/受注登録.py
なぜ: |
  **`import` を 1 行も出していなかった。** 呼出関係（`calls`）は整理層が原本を
  読んで手で起こすしかなく、30 本なら通っても **114 本・200 本の規模では
  先に破綻する** ―― そして `import` は構文木からゼロ曖昧に取れる。
  「構文木から取れるものに LLM を使っても精度は上がらず、コストと見落としだけが
  増える」と決めた当のものである（決定 2）。

  **関数の中の取り込みも拾う。** 重い依存を遅らせる書き方（`render` を使うときだけ
  読む）は普通にあり、そこにしか出てこない依存は**設計書からまるごと消える。**

  どれが自分たちのモジュールかは決めない ―― `from . import` の点の数も書いて
  あるとおりに出し、**どこを指すかを解くのは置き場を知っている側の仕事**である。
本文: |
  """受注の登録。"""
  import csv
  from decimal import Decimal
  from . import 採番
  from ..common.log import 監査ログ


  class OrderRegister:
      """受注登録 ―― 与信と在庫引当をまとめて行う。"""

      def register(self, order: "Order") -> str:
          """受注を登録する。"""
          from arp4.order.在庫 import 引当            # 重いので使うときだけ読む

          raise DuplicateOrder

