# **字と桁が仕様である資料** ―― 20 年もの勘定系の 2 冊。
#
# ここまでの検体は「何と書いてあるか」を読めばよかった。勘定系の設計書は
# そうではなく、**どの字で書いてあるか（半角カナ・外字・機種依存文字）**と
# **何桁目から何バイトか**が仕様そのものである ―― 字を整えると仕様が変わり、
# 桁を計算し直すと資料に無い数が出る。
#
# どちらも**正規化してはいけない**側にある。半角カナを全角に寄せるのも、
# 丸数字を `(1)` にするのも、外字を「〓」にするのも、画面に見えているものから
# 遠ざかる ―― しかも**そうと分かる形では壊れない**（読める字が並ぶので、
# 読み手は資料がそう書かれていたと思う）。
#
# 2 冊は同じ案件の上下流である。企業名・製品名・担当者名はすべて架空である。

置き場: 資料/O/振込処理詳細設計書（AP002-JP11）第0.9版.xlsx
なぜ: |
  **20 年直し続けている 1 冊。** ブックのプロパティは 2004 年に Excel 2003 で
  作られたことを示しており、最終更新は 2026 年である ―― 勘定系の設計書は
  作り直されず、同じブックが版を重ねる。

  この 1 冊にしか無いものが 4 つある。

  1. **1 つの表が 2 枚のシートに割れている。** 「処理記述（その1）」「（その2）」は
     紙で 2 枚になるから分けただけで、資料としては 1 つの表である ――
     **2 枚目には見出し行が無く**、No. は 1 枚目の続きから始まる。
     続きだと決めるのは整理層の仕事だが、**1 枚目の最後の「次頁へ続く」と
     2 枚目の見出しの不在**が出ていなければ、整理層にも決めようがない
  2. **条件の階層が、セルの中の改行と行頭記号にしかない。** 1 つのセルに
     「〜の場合」と、その下にぶら下がる区分が 3 つ並ぶ ―― 詰めると条件が
     1 本の長い文になり、どこまでが 1 つの条件か分からなくなる
  3. **繰り返しが「ループ開始」「ループ終了」の行の対で表されている。**
     入れ子は行頭の全角空白でしか表されておらず、どの終了がどの開始に
     対応するかは字下げの深さにしか無い ―― 対応を当てるのは意味の判断だが、
     **字下げを潰すと当てる材料が消える**
  4. **項目名が半角カナで書かれている。** ホストの電文定義をそのまま写した
     ものなので、全角に寄せると**電文の項目名として通らない字**になる
     （画面に見えているのは半角カナのほうである）
パーツ:
  # **作られたのは 2004 年、最後に触られたのは 2026 年。** 20 年ぶん直され
  # 続けたブックであることは、シートのどこにも書かれていない
  docProps/core.xml: |
    <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
    <cp:coreProperties
        xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties"
        xmlns:dc="http://purl.org/dc/elements/1.1/"
        xmlns:dcterms="http://purl.org/dc/terms/"
        xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
      <dc:title>振込処理 詳細設計書</dc:title>
      <dc:creator>ｼｽﾃﾑ ｶﾝﾘ</dc:creator>
      <cp:lastModifiedBy>芳川 徹</cp:lastModifiedBy>
      <dcterms:created xsi:type="dcterms:W3CDTF">2004-11-08T01:22:00Z</dcterms:created>
      <dcterms:modified xsi:type="dcterms:W3CDTF">2026-07-30T05:41:00Z</dcterms:modified>
    </cp:coreProperties>
  docProps/app.xml: |
    <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
    <Properties
        xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"
        xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes">
      <Application>Microsoft Excel</Application>
      <AppVersion>11.0000</AppVersion>
      <Company>株式会社セイワ情報システム</Company>
    </Properties>
シート:
  # ── 1. 処理概要 ────────────────────────────────────────────
  - 名前: 処理概要
    なぜ: |
      **同じものが半角カナと全角で 1 枚に並んでいる。** 項目名（`ｱﾌﾟﾘｹｰｼｮﾝID`）は
      ホストの定義をそのまま写した半角カナで、説明の側は全角の日本語である
      ―― 寄せると片方が資料から消える。

      **半角カナと全角の区別は、正規化すると音も無く消える。** 消えても文字は
      読めるので、読み手は資料がそう書かれていたと思う ―― いちばん気付けない
      壊れ方である（前ゼロを落とすのと同じ側にある）。

      呼出元・呼出先は**画面には見えている**が、ここに書いてある `ｵﾝﾗｲﾝ` が
      区分値なのか説明なのかは資料からは決まらない。
    セル:
      A1: 振込依頼電文受信処理 詳細設計書
    表:
      A3:
        - [ｱﾌﾟﾘｹｰｼｮﾝID, 'AP002-JP11']
        - [処理ID, 'sd-tko-Request']
        - [処理名, 振込依頼電文の受信]
        - [処理区分, 'ｵﾝﾗｲﾝ（ﾘｱﾙﾀｲﾑ）']
        - [呼出元, 'ﾎｽﾄ連携ｻｰﾊﾞ（HST01）']
        - [呼出先, '勘定系ｵﾝﾗｲﾝ（ACC-CORE）']
        - [電文ID, 'TRQ001']
        - [電文長, '512 ﾊﾞｲﾄ（固定長）']
        - [文字ｺｰﾄﾞ, 'ｼﾌﾄJIS（半角ｶﾅを含む）']
        - [連携方式, 'MQ（永続ｷｭｰ）']
        - [多重度, '8 多重']
        - [備考, 平成 16 年度の稼働開始から電文長は変更していない]
    列幅: {A: 18, B: 42}
    印刷:
      ヘッダ左: 'AP002-JP11 振込依頼電文受信'
      ヘッダ右: 第 0.9 版（社外秘）
      フッタ右: "&P / &N"

  # ── 2. 処理記述（その1） ─────────────────────────────────────
  - 名前: 処理記述（その1）
    なぜ: |
      **この様式の主題は「条件」の欄である。** 1 つのセルの中に「〜の場合」と、
      そこにぶら下がる区分が改行で並ぶ ―― 区分の後ろの `(1100_010001)` は
      ホストの項目 ID で、条件の一部である。

      **繰り返しは行の対でしか表されていない。** 「ループ開始」と「ループ終了」の
      間が繰り返しの範囲で、入れ子の深さは行頭の全角空白にしか無い ――
      どの終了がどの開始に対応するかを当てるのは整理層の仕事だが、
      **字下げを潰すと当てる材料そのものが消える**（`詳細設計書.yml` の
      疑似コードと同じ形が、表の中で起きる）。

      処理内容の欄は 1 セルで 200 字を超え、`(1-1)` `(1-2)` の番号と `・` の
      箇条書きと丸数字が同居する ―― どれも**行頭の記号にしか構造が無い**。

      処理ID の列は 1 つの値を 12 行ぶん縦結合してある（画面では全行に掛かって
      見えている）。**最後の行は表の値ではなく「次頁へ続く」という断り書き**で、
      これが 2 枚目の見出しの不在と対になっている。
    セル:
      A1: 振込依頼電文受信（sd-tko-Request）処理記述
    表:
      A3:
        - [処理ID, No., 条件, 処理内容, 備考]
        - ['sd-tko-Request', 10, 電文受信時,
           "(1-1) 受信電文のﾍｯﾀﾞ部を解析する。\n・電文長が 512 ﾊﾞｲﾄでない場合は E9001 を設定して呼出元へ返す。\n・電文IDが TRQ001 でない場合は E9002 を設定して呼出元へ返す。",
           ~]
        - [~, 11,
           "入金、出金、残高照会の場合\n・支払区分(1100_010001)\n・入金区分(1100_020000)\n・残高照会区分(1100_010900)",
           "(1-2) 要求電文の項目を退避領域に転記する。\n・「利用者ﾌｫﾙﾀﾞ」で定義した項目を転記対象とする。\n・項目のｾｯﾄ順は、下記のとおりとする。\n　①口座番号　②取引区分　③金額\n・業務ｴﾗｰの場合は、ｴﾗｰｺｰﾄﾞを設定して呼出元へ返す。",
           別紙 3 参照]
        - [~, 12, ループ開始, 明細の件数ぶん (1-3)〜(1-6) を繰り返す。, 最大 999 件]
        - [~, 13, '　入金ｱﾄﾞﾊﾞｲｽの場合',
           "(1-3) 入金ｱﾄﾞﾊﾞｲｽを編集する。\n・入金ｱﾄﾞﾊﾞｲｽ区分(1121_200000)を参照する。\n・振込人名は半角ｶﾅ 30 桁で切り捨てる（丸めない）。",
           ~]
        - [~, 14, '　　通知先が登録されている場合',
           "(1-4) 通知電文を組み立てて送信ｷｭｰへ積む。\n・通知先が複数ある場合は、登録順に 1 件ずつ積む。",
           ~]
        - [~, 15, '　　　　ループ開始', '　通知先の件数ぶん (1-5) を繰り返す。', 最大 5 件]
        - [~, 16, ~, '(1-5) 通知電文 1 件を送信ｷｭｰへ積む。', ~]
        - [~, 17, '　　　　ループ終了', ~, ~]
        - [~, 18, '　　通知先が登録されていない場合',
           "(1-6) 通知は行わない。\n・「通知先未登録」をｼｽﾃﾑﾛｸﾞへ出力する（業務ｴﾗｰとはしない）。",
           ~]
        - [~, 19, ループ終了, ~, ~]
        - [~, ~, ~, 次頁へ続く, ~]
    列幅: {A: 17, B: 6, C: 34, D: 56, E: 14}
    行高: {4: 75, 5: 110, 7: 65, 8: 45, 12: 45}
    # 条件と処理内容は**実物では必ず折り返してある**（折り返しを立てないと、
    # 高さだけがある 1 行のセルに見える）。上詰めにするのも同じ理由で、
    # 既定の下詰めのままだと No. が次の行の内容の隣に並んで見える
    折り返し: [A4:E14]
    結合:
      # 処理ID（幅 1 の縦結合）―― 全行へ展開する。**「次頁へ続く」の行
      # （14 行目）は結合の外にある**（表の値ではなく断り書きである）
      - A4:A13
    印刷:
      ヘッダ左: 'AP002-JP11 振込依頼電文受信'
      ヘッダ右: 第 0.9 版（社外秘）
      フッタ右: "&P / &N"
      見出し行: '3:3'
      見出し列: 'A:B'

  # ── 3. 処理記述（その2） ─────────────────────────────────────
  - 名前: 処理記述（その2）
    なぜ: |
      **見出し行が無い表。** 紙で 2 枚目になっただけなので、書いた人は
      見出しを繰り返していない ―― 1 行目からいきなり `20` の行が始まる。

      表の 1 行目を見出しとして読むと、**`20` が列の名前になる**。かといって
      「これは前のシートの続きだ」と決めるのは意味の判断で、機械の仕事では
      ない ―― 出せるのは「1 行目からデータが始まっている」という事実と、
      **シート名の「その2」**だけである。

      印刷の設定にも同じことが書いてある。1 枚目は見出し行を `3:3` と指定して
      いるのに、こちらは**指定が無い** ―― 繰り返す見出しがそもそも無いことを、
      作成者が申告している。
    表:
      A1:
        - ['sd-tko-Request', 20, 送信完了時,
           "(2-1) 送信ｷｭｰへの積み込み結果を確認する。\n・積み込みに失敗した明細は、再送ﾃｰﾌﾞﾙへ退避する。",
           ~]
        - [~, 21, '　再送ﾃｰﾌﾞﾙに退避した場合',
           "(2-2) 再送は 3 分間隔で最大 3 回とする。\n・3 回とも失敗した場合は運用監視へ通報する。",
           E2001]
        - [~, 22, 排他ｴﾗｰの場合,
           "(2-3) 同一口座の同時更新は E9001 とし、呼出元へ返す。\n・ﾘﾄﾗｲはしない（呼出元の再送に任せる）。",
           E9001]
        - [~, 23, 正常終了時, '(2-4) 応答電文に 0000 を設定して呼出元へ返す。', ~]
    列幅: {A: 17, B: 6, C: 34, D: 56, E: 14}
    行高: {1: 60, 2: 60, 3: 60}
    折り返し: [A1:E4]
    結合:
      - A1:A4
    印刷:
      ヘッダ左: 'AP002-JP11 振込依頼電文受信'
      ヘッダ右: 第 0.9 版（社外秘）
      フッタ右: "&P / &N"

  # ── 4. 電文レイアウト ──────────────────────────────────────
  - 名前: 電文レイアウト
    なぜ: |
      **桁が仕様である表。** 開始位置と長さで電文の 512 ﾊﾞｲﾄを割り付けて
      おり、`X(30)` `S9(9)V99 COMP-3` は COBOL の PICTURE 句そのものである
      ―― 型でも桁数でもなく、**その文字列が仕様**である。

      **開始位置が 1 桁ずれている行がある。** カナ氏名の開始位置は前の項目の
      終わりから続いていない（`0018` と書いてあるが `0019` のはず）――
      実物の電文定義でいちばんよくある事故で、**機械は直してはいけない**。
      直すと、資料の側の矛盾が資料から消える（次のラウンドで誰も拾えない）。

      **前ゼロの開始位置は数ではない。** `0001` を数として読むと `1` になり、
      桁を揃えて書いてある意味が消える ―― `表.yml` のコード値と同じ側にある。

      **FILLER は名前ではなく「使わない場所」である。** 予備の 450 ﾊﾞｲﾄを
      落とすと電文長が合わなくなるが、項目として数えると仕様が 1 つ増える
      ―― どちらにするかは整理層が決める（機械はそのまま出す）。
    表:
      A1:
        - [振込依頼電文（TRQ001）レイアウト, ~, ~, ~, ~, ~, ~, 全長 512 ﾊﾞｲﾄ]
        - [No, 項目名, 英字名, 開始位置, 長さ, 属性, 編集, 備考]
        - [1, 'ﾃﾞﾝﾌﾞﾝ ｼｭﾍﾞﾂ', 'MSG-TYPE', '0001', 4, 'X(4)', ~, 固定値 TRQ1]
        - [2, 'ｷﾞﾝｺｳ ｺｰﾄﾞ', 'BANK-CD', '0005', 4, '9(4)', ~, 前ゼロ埋め]
        - [3, 'ｼﾃﾝ ｺｰﾄﾞ', 'BRANCH-CD', '0009', 3, '9(3)', ~, 前ゼロ埋め]
        - [4, 'ｺｳｻﾞ ﾊﾞﾝｺﾞｳ', 'ACCT-NO', '0012', 7, '9(7)', ~, ~]
        - [5, 'ｶﾅ ｼﾒｲ', 'NAME-KANA', '0018', 30, 'X(30)', ~, 半角ｶﾅのみ。全角は不可]
        - [6, 'ｷﾝｶﾞｸ', 'AMOUNT', '0049', 6, 'S9(9)V99 COMP-3', '\\\,\\9', 内部 10 進（符号付き）]
        - [7, 'ﾄﾘﾋｷ ﾋﾂﾞｹ', 'TRAN-DATE', '0055', 8, '9(8)', '9999/99/99', 'YYYYMMDD']
        - [8, 'FILLER', ~, '0063', 450, 'X(450)', ~, 予備]
        - [~, 合計, ~, ~, 512, ~, ~, ~]
    列幅:
      {A: 5, B: 20, C: 16, D: 10, E: 7, F: 20, G: 14, H: 26}
    書式:
      # **開始位置は文字である。** 数として読むと前ゼロが落ちる
      D3:D10: '@'
    結合:
      - A1:G1
    印刷:
      ヘッダ左: 'AP002-JP11 振込依頼電文受信'
      ヘッダ右: 第 0.9 版（社外秘）
      フッタ右: "&P / &N"
      見出し行: '2:2'
    コメント:
      D7: {記入者: 芳川, 本文: 開始位置が 1 桁ずれている（0019 が正しい）。電文自体は 0019 から作られているので、直すのは本書のほう。2026-07-30 確認}

