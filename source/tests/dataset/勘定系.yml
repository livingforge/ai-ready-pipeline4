置き場: 資料/O/振込通知書帳票設計書（RPT-014）.xlsx
なぜ: |
  **字そのものが仕様である 1 冊。** 帳票設計書は「何桁目に何を印字するか」と
  「どの字で出すか」しか書いていない ―― 編集形式（COBOL の PICTURE 句）と、
  外字・機種依存文字がその中身である。

  **通貨記号の欄はバックスラッシュで書かれている。** 日本語 Windows の等幅
  書体は `0x5C` を円記号の字形で描くので、**画面には `￥￥￥,￥￥9` と
  見えているのに、値はバックスラッシュ 5 つ**である ―― 実物の COBOL の
  PICTURE 句はこう書かれている。Markdown の逃がし文字でもあるので、
  そのまま出すと器の構造を壊しうる（`異常.yml` の `画面項目仕様書` と同じ形の
  穴だが、こちらは**逃がすと画面と食い違う**側である）。

  **外字と異体字は「機械が読めていない」の側ではない。** どれも値としては
  読めており、画面にも出ている ―― 出ないのは**その字を持たない環境で開いた
  ときだけ**である。だから申告するものではなく、そのまま出すもの
  である（寄せると別人の氏名になる ―― `髙` と `高` は銀行では別の口座名義人
  である）。
シート:
  # ── 1. 印字項目 ────────────────────────────────────────────
  - 名前: 印字項目
    なぜ: |
      **編集形式の欄が、値としても記法としても際どい。**

      * `\\\,\\9` ―― バックスラッシュ 5 つ。画面には `￥￥￥,￥￥9` と
        出ている（日本語 Windows の書体がそう描く）
      * `▲9,999` ―― 負数を `▲` で出す。会計の帳票では `-` を使わない
      * `*,***,**9` ―― 小切手用のアスタリスク詰め。Markdown の強調と同じ字
      * `9999/99/99` ―― 日付のマスク。日付そのものではない

      **印字例の側には機種依存文字が並ぶ。** `㈱` `№` `℡` `㎡` `Ⅲ` `①` は
      どれも 1 文字で、分解すると桁数が合わなくなる ―― 帳票は桁で組むので、
      `㈱` を `(株)` に開くと**印字位置が 2 桁ずれる**。

      **和暦の元年は `1年` と出ている。** 書式が `ggge` なので画面には
      `令和1年5月1日` と出ており、`令和元年5月1日` とは書かれていない ――
      値は同じ日である（`設計書.yml` と同じで、直さない側）。
    表:
      A1:
        - [振込通知書（RPT-014）印字項目, ~, ~, ~, ~, ~, 用紙 A4 縦 / 66 行 × 136 桁]
        - [印字No, 項目名, 行, 桁, 編集形式, 印字例, 備考]
        - [1, 帳票名, 2, 51, 'X(20)', 振込通知書, 中央寄せ]
        - [2, 発行日, 3, 100, 'ggge"年"m"月"d"日"', ~, 元号は自動。元年も 1年と出る]
        - [3, 得意先名, 6, 5, 'X(40)', '㈱東和ロジテック　御中', '㈱ は 1 文字（開くと 2 桁ずれる）']
