  # ── 2. 氏名の字 ────────────────────────────────────────────
  - 名前: 氏名の字
    なぜ: |
      **外字は銀行の口座名義でいまも生きている。** 4 通りを 1 枚に並べてある
      ―― どれも画面には出ているが、機械から見た事情がそれぞれ違う。

      | 字 | 事情 |
      | --- | --- |
      | `髙` | JIS 第 2 水準。ｼﾌﾄJIS にもある（そのまま出せる） |
      | `﨑` | NEC 選定 IBM 拡張。ｼﾌﾄJIS にはあるが Unicode との対応が 2 通りある |
      | `𠮷` | 面 2 の漢字（U+20BB7）。**ｼﾌﾄJIS に無い**ので、cp932 で出力すると落ちる |
      | 私用領域 | ホストの外字。**字形はホストにしかない**ので、開いた環境では豆腐か空白に見える |

      **寄せてはいけない。** `髙` を `高` に、`𠮷` を `吉` にすると**別人の
      口座名義**になる ―― 銀行の帳票ではこれが事故になる。読める字に寄せる
      変換は、読めない字を落とすより気付けない（読み手は資料がそう書かれて
      いたと思う）。

      **私用領域の 1 件だけは「読めなかったもの」に近い。** 字形が資料の側に
      無いので、開いた人にも何の字か分からない ―― ただし**値としては読めて
      いる**（区点番号が備考にある）ので、機械が申告するものではなく、
      整理層がホストの外字表と突き合わせるものである。

      読みの列は**半角カナ**である（`振込処理詳細設計書` の電文と揃えてある）。
    表:
      A1:
        - [外字No, 氏名, 読み, 区点, 事情]
        - [1, 髙橋 一郎, 'ﾀｶﾊｼ ｲﾁﾛｳ', ~, はしごだか。JIS 第 2 水準]
        - [2, 﨑田 花子, 'ｻｷﾀﾞ ﾊﾅｺ', ~, たつさき。NEC 選定 IBM 拡張]
        - [3, "\U00020BB7川 三郎", 'ﾖｼｶﾜ ｻﾌﾞﾛｳ', ~, つちよし（U+20BB7）。ｼﾌﾄJIS に無い]
        # 私用領域（U+E000）は**字を書いても検体が読めない**（画面では豆腐に
        # なる）ので、YAML の逃がし形で置く ―― 実物のセルには 1 文字の外字が入っている
        - [4, "田 四郎", 'ﾀﾅｶ ｼﾛｳ', 'F040', ホストの外字。字形は帳票ｻｰﾊﾞにしかない]
        - [5, 渡辺 五郎, 'ﾜﾀﾅﾍﾞ ｺﾞﾛｳ', ~, 異体字ではないが、届出は「渡邊」である]
    セル:
      A8: '※　氏名は口座名義のとおりに印字する。字を寄せた場合は別名義となるため、'
      A9: '　　寄せずに印字できないときは印字せず、事務センターへ回付する。'
