置き場: 資料/N/かな索引.csv
なぜ: |
  **例外の出ない失敗がある。こちらのほうが質が悪い。**

  EUC-JP のかな（`う` = 0xA4 0xA6）は、**すべて cp932 の半角カタカナの範囲**
  （0xA1〜0xDF）に収まる ―― つまり `UnicodeDecodeError` が出ない。`_csv_text` は
  「cp932 で読めました」と言い、`うけつけ` が `､ｦ､ｱ､ﾄ､ｱ` として表に入り、
  **整理層はそれを資料の字として読む。** 上の `旧コード表.csv` は `�` が出るぶん
  まだ気づけるが、こちらは 1 つも出ない。次のラウンドではこれが正本の値になる。

  だから読めた中身のほうを見る。**数えているのは字種の割合だけ**である
  （本文の 3 割以上が半角カタカナ）ので、「これは EUC-JP だ」とは言わない ――
  言うのは数えた事実と、それが起きる典型的な理由だけである。決めるのは人である。

  半角カタカナが混ざる資料自体は実在する（旧システムの項目名）が、**本文の 3 割を
  超えることは無い** ―― 超えるのは読み違えたときだけである。
文字コード: euc_jp
本文: |
  CODE,KANA
  01,うけつけ
  02,よしんちゅう
  03,かくてい
  04,しゅっかしじ
