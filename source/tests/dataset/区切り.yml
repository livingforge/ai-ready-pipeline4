置き場: 資料/N/バッチ実行結果.csv
なぜ: |
  **区切りは「いちばん多く出てくる文字」では決まらない。**

  この 1 本は帳票ツールが欧州ロケールで吐いたもので、区切りは `;` である。
  ところが**本文にはカンマのほうが多く入っている**（メッセージの中の
  `3,200 件` `01:00, 02:00`）―― 出現数で決めると `,` を選び、列数がばらばらの
  表が「読めた」顔で出てくる。

  決め手は**行ごとの列数が揃うか**である。`;` で割ると 4 行とも 4 列になり、
  `,` で割ると 4 列・6 列・5 列とばらける。揃い方で決めるなら、これは転記に
  近いところに留まる（当てにいっているのは事実だが、当たったかどうかを
  資料自身が答えている）。
本文: |
  ジョブID;実行日時;結果;メッセージ
  JOB001;2026-08-02 01:00;OK;受注データを 3,200 件 取り込みました
  JOB002;2026-08-02 02:00;NG;マスタ未登録の得意先が 12 件, 処理を中断しました
  JOB003;2026-08-02 03:00;OK;01:00, 02:00 の結果を集計しました

