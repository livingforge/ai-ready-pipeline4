置き場: 資料/N/項目対応表.csv
なぜ: |
  **注記の行が 1 本混ざった CSV。** 現行と新の項目対応表を Excel で作って
  CSV に落とすと、末尾に「※ 桁あふれは切り捨て」の 1 行が 1 列だけで残る
  ―― 実物ではごく普通に起きる。

  表として出すこと自体は正しい（4 行のうち 4 行が 4 列で揃っている）が、
  `mdio` の表は**幅を揃えて出す**ので、1 列しかない注記の行は残り 3 列が
  空欄になる。**黙ると「資料が空欄」に見える** ―― そこは資料が空欄なのでは
  なく、そもそも列が無い行である。揃っていなかったことを必ず言う。
本文: |
  現行項目,新項目,型,備考
  TOKUI_CD,得意先コード,CHAR(5),
  TOKUI_NM,得意先名,VARCHAR(60),桁を 40 から 60 へ拡張
  ZIP,郵便番号,CHAR(8),ハイフンあり
  ※ 桁あふれは切り捨て

