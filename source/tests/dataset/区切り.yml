置き場: 資料/N/得意先マスタ移行.csv
なぜ: |
  **移行データの一覧は CSV で配られる。** 抽出したツールがそのまま吐くので、
  1 案件で数百本になることが珍しくない ―― 1 本ずつ Excel で開いて `.xlsx` に
  し直す作業を引き受ける人はいないので、「Excel で開き直してください」と言って
  いたあいだ、**その数百本は 1 件も仕様にならなかった。**

  読むと決めた以上、危ないのは 2 つである ―― **区切りと文字コード**。どちらも
  資料ごとに違い、当てにいけば値が変わる。だから当てた結果をパース結果の頭に
  書く（`文字コードは cp932、区切りは カンマ として読みました`）。整理層は
  それを見て、値を信じるか原本を開くかを決められる。

  この 1 本は**引用符が効いているか**を突く。住所の `東京都千代田区1-2-3, 丸の内ビル`
  にはカンマが入っており、素朴に `,` で割ると 1 列ずれる ―― 備考の値には改行も
  入っている（`csv` 標準ライブラリはどちらも守る）。既存資産の日本語は cp932 で
  あることがいちばん多い。

  引用符の中の引用符（`""`）も入れてある ―― 屋号に `"` が入る得意先は実在し、
  抽出ツールは二重にして逃がす。ここを素朴に外すと**値が途中で切れる。**

  **前ゼロの残った数値**（`00120`）と**半角カタカナ**（旧システムから来た
  カナ名）も入れてある。どちらも「値を作り変えない」の対象で、数として
  読み直せば前ゼロが消え、正規化すれば全角に化ける ―― どちらも移行データの
  照合を静かに壊す。

  **引用符・改行・カンマが 1 つの升に同時に入る行**も入れてある（`C0006` の
  備考）。どれか 1 つずつなら素朴な実装でも通ることがあるが、3 つ揃うと
  **行の切れ目そのものを見失う** ―― 抽出ツールの吐いた備考欄は実際にこうなる。

  **末尾の升が丸ごと落ちた行**（`C0007`）も入れてある。Excel から書き出すと
  最終列が空の行は区切りごと省かれることがあり、**列数が 1 つ足りない行**に
  なる ―― 揃っていないことを言わずに表にすると、担当と備考が 1 つずれる。

  **同じ得意先コードが 2 度出てくる**（`C0003`）のも実物どおりである。名寄せ
  前の抽出はこうなり、**どちらが正かは資料が答えていない** ―― 機械が片方を
  落とすと、落としたほうが正だったときに誰も気づけない。
文字コード: cp932
本文: |
  得意先コード,得意先名,カナ名,住所,与信限度額,取引開始日,担当,備考
  C0001,株式会社あかつき商事,ｱｶﾂｷｼｮｳｼﾞ,"東京都千代田区1-2-3, 丸の内ビル",00120000,2011-04-01,営業1課,
