置き場: 資料/N/夜間停止手順.csv
なぜ: |
  **1 列の CSV は、どの区切りでも「揃って」見える。**

  運用手順を Excel の 1 列に書いて CSV で書き出したものがこの形になる ――
  `,` で割っても `;` で割っても タブ で割っても、全行 1 列で完璧に揃う。
  そこで先頭の候補（`,`）を選ぶのは、揃ったから選んだのではなく**偶然に
  賭けている**だけである。

  だから決めない。**表にせず原文のまま出す**（`P018`）―― 値は 1 つも落ちて
  いないので、整理層は読めるし、必要なら写しを直接編集できる。**割れていない
  という事実のほうが、割れた顔の表より役に立つ。**
本文: |
  1. 業務アプリのサービスを停止する
  2. バッチスケジューラを停止する
  3. DB のオンラインバックアップを取得する
  4. 停止確認を運用担当へ連絡する

