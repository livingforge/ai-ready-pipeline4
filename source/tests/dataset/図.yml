置き場: 資料/G/体制と役割.xlsx
なぜ: |
  **SmartArt が 1 枚に 2 つ載っている。** 体制図と業務の流れを並べて描くのは
  ごく普通で、そのとき描画パートは 1 本のまま `diagramData` への関係が 2 本に
  なる ―― 1 本しか辿っていなければ、**後から足したほうの図が丸ごと消える。**

  補佐（`asst`）は箱であって見た目用の複製ではない ―― 型で切り分ける側の
  検体である（`pres` と `parTrans` / `sibTrans` は数えない）。

  **箱と一緒に並ぶ 3 種類を数えない**ところまでが検体である ―― 繋ぎの点
  （`parTrans` / `sibTrans`）と見た目用の複製（`pres`）は同じ一覧に入っており、
  拾うと同じ語が 2 回出て箱の数が合わなくなる。補佐（`asst`）はそれらと違って
  **箱である**。
シート:
  - 名前: 体制
    セル:
      A1: プロジェクト体制と受注の流れ（下図）
    描画:
      - 図表:
          種類: SmartArt
          箱:
            - [PM]
            - {文字: [品質保証], 種別: asst}
            - [[基盤チーム, （インフラ・共通）], 受注・請求]
        id: 2
        名前: Diagram 1
        位置: B3:H14
      - 図表:
          種類: SmartArt
          箱: [[受付], [与信], [出荷]]
        id: 3
        名前: Diagram 2
        位置: J3:P14
