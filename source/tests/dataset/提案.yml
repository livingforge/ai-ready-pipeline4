      月初の 3 日間は日次が遅れると締めも遅れていた）。
  # **目標値の表。** 「現行実測」には空欄がある ―― 測っていない行で、
  # 0 ではない。埋めにいく実装は資料が言っていないことを言い出す
  - 表題: 非機能要件の目標値
    表:
      - - [区分, 項目, 現行実測, 目標値, 測定条件, 未達時の扱い]
