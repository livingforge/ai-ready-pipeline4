        - [~, 日次バッチの処理時間, 6 時間, 4 時間以内, 受注 5,000 件／日, 同上]
        - [~, 月次バッチの処理時間, '', 8 時間以内, 受注 150,000 件／月, 同上]
        - [可用性, 稼働率, 99.1%, 99.5% 以上, 計画停止を除く, 是正計画を提出]
        - [~, 目標復旧時間, '', 4 時間, DR サイトへの切替を含む, 同上]
    コメント:
      - 誰: 高橋（インフラ）
