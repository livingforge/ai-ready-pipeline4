  # ── 4. 機能一覧表 ──────────────────────────────────────────
  - 名前: 機能一覧表
    なぜ: |
      **項番が日付になっている。** 「1-1」を Excel に打ち込むと日付として
      読まれ、画面には `1月1日` と出る ―― 実物の機能一覧表でいちばんよく
      見る事故で、**資料の側がそうなっている**以上、機械は `1月1日` と出す
      しかない（`1-1` に戻すのは資料に無い値を書くことである）。

      **直し漏れがまだらに残っている**のがこの検体の中身である。2 系列は
      文字列で入れ直してあり、3 系列はまた日付のままである ―― 同じ列に
      日付と文字列が混ざり、**画面では `1月1日` と `2-1` が縦に並ぶ**。
      1 つの列を 1 つの型と決めてかかると、どちらかが消える。

      **○の付いていない欄が、対象外なのか未記入なのかは資料から決まらない。**
      空欄をどちらかに寄せるのは意味の判断で、機械の仕事ではない（`概要説明`
      の ※１ がそう断っている）。

      **記述要領のテキストボックスが、セルの値の上に重なっている。**
      画面にはボックスしか見えていないが、下の注記は消えていない ――
      「画面に見えているものへ寄せる」を突き詰めると値を落とすことになるが、
      落としたほうが資料から消える（覆いを判断するのも機械の仕事ではない）。

      見出しは**横結合と縦結合が同じ 2 行の中で同時に起きる**形である
      ―― 上段の「種別」は 5 列に広げてはいけない側、左の 4 列は下へ広げる側で、
      `表.yml` の 2 種類が 1 つの見出しに同居している。
    セル:
      A1: 機能一覧表
      A2: システム名
      A3: 販売管理システム
      E20: '※　○の付いていない欄は、対象外か未記入かのどちらかである。'
      E22: '※　項番は「1-1」の形式で採番する。'
    表:
      A5:
