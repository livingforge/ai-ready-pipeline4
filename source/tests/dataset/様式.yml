# 紙の様式そのものが仕様を持っている資料 ―― **値ではなく、紙の上のどこに
# 置いてあるかで意味が決まる**形を集めてある。
#
# ここまでの検体は「セルに何と書いてあるか」がずれる形（結合・書式・数式）と、
# 「図形に何と書いてあるか」がずれる形（段落・接続・矢羽根）だった。上流の
# 業務要件定義書はそのどちらでもない ―― **誰がやる作業かはレーン（列の位置）に
# しか無く、何の書類かは図形の形にしか無く、読み方は凡例のシートに図形だけで
# 描いてある。**
#
# **どれも「意味の判断」の側にある** ―― 座標からレーンを当てるのも、菱形を
# 「分岐」と読むのも、機械がやってはいけない。だからここで見るのは
# **整理層がそれを判断できるだけのものが出ているか**である。図形の番地が
# 出ていればレーンの見出しと突き合わせられるし、形の名前が出ていれば凡例と
# 突き合わせられる ―― 出ていなければ、その仕様は資料にあるのに誰にも読めない。
#
# 企業名・製品名・担当者名はすべて架空である。

置き場: 資料/N/受注業務フロー（第1.1版）.xlsx
なぜ: |
  **業務フローと機能一覧表を綴じた上流の 1 冊。** 基本設計書（`設計書.yml`）の
  さらに上にあたり、客先の業務そのものを写した冊子である ―― システムの話は
  機能一覧表の 1 枚にしか出てこない。

  この 1 冊にしか無いものが 4 つある。どれも**紙の様式が持っている仕様**で、
  セルの値をいくら丁寧に読んでも出てこない。

  1. **担当部署はレーン（列の位置）にしか書かれていない。** 箱の中には
     「見積入力」としか書いておらず、それが営業の作業であることは
     **3 行目のレーン見出しの下に置いてある**ことでしか表されていない。
     機械が図形の番地を出していれば整理層が突き合わせられるが、番地が
     落ちるとその仕様は資料にあるのに誰にも読めない（→ 決定：セル番地を
     必ず併記する）
  2. **何の書類かは図形の形にしか無い。** 帳票は波形の下端（`flowChartDocument`）、
     判断は菱形、ファイルは円筒で描き分ける ―― 文字は同じ「見積書」でも、
     箱なら画面、波形なら紙である。形を意味に翻訳するのは整理層の仕事だが、
     **形が消えると翻訳する材料そのものが無くなる**
  3. **同じ文字の箱が 1 枚に 2 つある。** 承認は営業企画で 2 回起き、見積書も
     正と控で 2 枚出る ―― 文字で同定できないので、**どの承認かは番地でしか
     言えない**
  4. **レーンの区切り線が、業務の流れと同じ「線」として並ぶ。** 縦の破線は
     部署の境目であって書類の受け渡しではないが、機械から見れば
     「どこにも繋がっていない線」である ―― 本数を数えると流れが 3 本多く見える

  **箱の載っている列は既定幅のままにしてある。** 実物のこの様式は 1 列を
  2 文字幅にした方眼だが、図形の端はセルの格子から決まるので、箱のある列を
  広げると線が箱の辺からずれる ―― 方眼を写せないことより、図が資料に
  見えなくなるほうが悪い。狭めてあるのは**箱の外**（レーンの区切りと説明欄）
  だけで、そこは幅を変えても端が動かない。
シート:
  # ── 1. 記述様式（凡例） ────────────────────────────────────
  - 名前: 記述様式
    なぜ: |
      **この冊子の読み方が、セルに 1 文字も無い。** 凡例を図形だけで作るのは
      この様式ではごく普通で、図形の形と、その右のテキストボックスの説明が
      対になっている ―― 表の格子で読もうとすると、このシートは
      「表題しか無い白紙」に見える。

      **形の対応表がここにしか無い**ので、業務フローの菱形が何であるかは
      このシートを読まないと決まらない。7 種類を並べてあるのは、
      **形が違うだけで文字がまったく同じ**（どれも文字を持たない）ものを、
      機械が何で見分けるかを 1 枚で突くためである。

      説明の側は**左寄せのテキストボックス**で、行頭の全角空白で字下げして
      ある ―― 中央寄せで書くと字下げは画面のどこにも出ない。
    セル:
      A1: 本書の記述様式
    列幅: {A: 3, B: 6, C: 6, D: 6, E: 3}
    描画:
      # **囲み枠は先に宣言する。** 図形は宣言した順に重なるので、後ろに置くと
      # 白い塗りが凡例を丸ごと覆う ―― 関係は正しいのでパースは通り、
      # **実物の Excel で開いた人にだけ白紙に見える**（いちばん気付けない）。
      #
      # **代替テキストにしか無い断り書き**でもある。凡例そのものが第 1.0 版の
      # ままであることは、箱の文字にも表にも書かれていない
      - 箱: []
        id: 24
        名前: 凡例枠
        形: rect
        代替: 記述様式は第 1.0 版から変更していない。1.1 版で増えた図形（ファイル）はこの枠の外にある。
        位置: A2:N30
      # **左が形、右が説明。** 形の側は文字を持たない（実物もそう描く）
      - 箱: []
        id: 10
        名前: 端子
        形: flowChartTerminator
        位置: B3:D5
      - 箱: ['端子', '　業務の開始と終了を表す。']
        id: 11
        形: rect
        寄せ: 左
        位置: F3:M5
      - 箱: []
        id: 12
        名前: 処理
        形: flowChartProcess
        位置: B7:D9
      - 箱: ['処理', '　システムで行う処理を表す。機能一覧表の項番と対応する。']
        id: 13
        形: rect
        寄せ: 左
        位置: F7:M9
      - 箱: []
        id: 14
        名前: 手作業
        形: flowChartManualOperation
        位置: B11:D13
      - 箱: ['手作業', '　人手で行う作業を表す。システム化の対象外である。']
        id: 15
        形: rect
        寄せ: 左
        位置: F11:M13
      - 箱: []
        id: 16
        名前: 判断
        形: flowChartDecision
        位置: B15:D17
      - 箱: ['判断', '　条件によって流れが分かれることを表す。', '　分岐の条件は線の脇に書く。']
        id: 17
        形: rect
        寄せ: 左
        位置: F15:M17
      - 箱: []
        id: 18
        名前: 帳票
        形: flowChartDocument
        位置: B19:D21
      - 箱: ['帳票', '　紙に出力する書類を表す。控えは別の図形で描く。']
        id: 19
        形: rect
        寄せ: 左
        位置: F19:M21
      - 箱: []
        id: 20
        名前: ファイル
        形: flowChartMagneticDisk
        位置: B23:D25
      - 箱: ['ファイル', '　保存されるデータを表す。']
        id: 21
        形: rect
        寄せ: 左
        位置: F23:M25
      - 箱: []
        id: 22
        名前: 定義済み処理
        形: flowChartPredefinedProcess
        位置: B27:D29
      - 箱: ['定義済み処理', '　別紙に記述する処理を表す。別紙の番号を中に書く。']
        id: 23
        形: rect
        寄せ: 左
        位置: F27:M29

  # ── 2. 概要説明 ────────────────────────────────────────────
  - 名前: 概要説明
    なぜ: |
      **1 つのセルに 8 行の本文が入っている。** しかも途中に空行がある ――
      折り返しではなく、書いた人が段落として割った空行である。詰めて 1 行に
      すると段落が消え、行だけを並べると空行がどこにあったか消える。

      表の側は**言葉で書いた「同上」**である。縦結合（`表.yml`）と画面上は
      同じに見えるが、こちらはセルに文字として入っている ―― 展開すると
      資料に無い値を書くことになるので、**そのまま出すのが正しい**（同じ
      「上と同じ」でも、結合と文字で機械のやることが正反対になる）。

      **「以下余白」は表の終わりを人に伝えるための語である。** 実物の設計書は
      枠の余りをこう埋める ―― 値でも見出しでもないものが表の下に 1 行だけ
      残る形は、この様式でしか出ない。

      **※印の注記は本文から離れた行に置かれている。** 本文（A3）が参照して
      いる ※１ ※２ は 20 行下にあり、塊を切ると対応が切れる ―― 番地さえ
      付いていれば読み直せる、というのがこの区切りの前提である。
    セル:
      A1: 概要説明
      A3: "本書は、東和ロジテック株式会社の販売管理システム再構築に係る業務要件を、\n業務の流れ（業務フロー）と機能の一覧（機能一覧表）の二つの様式で記述したものである。\n\n業務フローは、部署ごとの縦のレーンに作業を並べ、書類の受け渡しを線で結んで表す。\n作業がどの部署のものかは、レーンの位置でのみ表す（作業の欄には部署名を書かない）。\n\n機能一覧表は、業務フローに現れた作業のうち、システムで実現するものだけを抜き出し、\n新規／入力／照会／帳票／バッチの別を○で表す。○の付かない欄については※１を参照。"
      A19: 以下余白
      A21: '※１　○の付いていない欄は、対象外か未記入かのどちらかである。本書では区別していない。'
      A22: '※２　「同上」「〃」は直上の行と同じ内容であることを表す。「―」と「Ｎ／Ａ」と空欄も区別していない。'
      A24: 本書に記載のない事項は、受注管理システム基本設計書（第 3.2 版）による。
    表:
      A13:
        - [No, 対象業務, 現行, 新システム, 備考]
        - [1, 見積, あり, 対象, ~]
        - [2, 受注, あり, 同上, ~]
        - [3, 出荷, なし, 〃, 新規に構築する]
        - [4, 請求, あり, 対象外, 'Ｎ／Ａ']
        - [5, 入金, あり, 対象外, '―']
    列幅: {A: 12, B: 14, C: 10, D: 14, E: 22}
    # **本文は 5 列 × 9 行を結合した枠に入っている**（実物もそう書く）。
    # 折り返しを立てないと、8 行の本文が画面で 1 行に見える
    結合:
      - A3:E11
    折り返し: [A3]
    印刷:
      ヘッダ左: 受注業務フロー
      ヘッダ右: 第 1.1 版
      フッタ中: "&P / &N"

  # ── 3. 見積・受注（スイムレーンの業務フロー） ──────────────
  - 名前: 見積・受注
    なぜ: |
      **この 1 枚がこの冊子の主題である。** 部署ごとの縦のレーンに作業を並べ、
      書類の受け渡しを線で結ぶ ―― 日本の業務フローはほぼこの様式で書かれる。

      **担当部署は 4 行目の見出しにしかない。** 箱の文字は「見積入力」だけで、
      それが営業の作業であることは、箱が H〜L 列（営業のレーン）に置いてある
      ことでしか表されていない。**座標からレーンを当てるのは意味の判断**なので
      機械はやらないが、**図形の番地が出ていれば整理層が突き合わせられる**
      ―― 番地が落ちると、この冊子でいちばん大事な仕様が誰にも読めなくなる。

      **形にしか無いものがもう 1 つある。** 見積書・注文書・受注伝票は波形の
      下端（帳票）で、与信判定は菱形（判断）、受注ファイルは円筒（ファイル）
      である ―― 記述様式のシートを見ないと読めないが、**形が消えるとそもそも
      引くものが無くなる**。

      **「承認」が 2 つある。** 営業企画の承認は見積のときと受注のときで 2 回
      起き、箱の文字はどちらも「承認」である ―― 文字で同定できないので、
      どちらの承認かは番地でしか言えない。

      **縦の破線 3 本はレーンの区切りであって、書類の受け渡しではない。**
      機械から見ると「どこにも繋がっていない線」で、流れの線と同じ一覧に
      並ぶ ―― 数えると流れが 3 本多く見える。

      右の説明欄は**セルの側にある本文**で、図とは別に読める ―― 全角の数字と
      全角空白で階層を作っており、※印は本文の中にある（`概要説明` の注記とは
      置き方が違う）。
    セル:
      A4: 得意先
      H4: 営業
      N4: 営業企画
      T4: システム
      Z4: 説明
      Z9: "１．見積依頼の受付\n　　電話やＦＡＸ、メールなどにより見積依頼を受ける。\n　　その内容をもとに、見積入力を行う。"
      Z14: "２．見積書の提出\n　　見積入力により、見積書（正／控）、採算計算書を出力する。\n　　見積書（正／控）と採算計算書は、営業企画に提出して承認をもらう。"
      Z19: "３．注文書の受領\n　　見積書と注文書をユーザーに提出する。\n　　客先より注文書（客先様式または当社提出）を受領する。"
      Z29: "４．受注入力\n　　注文書の内容をもとにして受注入力\n　　※１　見積済の場合は、見積データをコピーして受注入力画面に転記（データ引用）\n　　※２　見積済でない場合は、受注入力画面を新規に開く"
      Z34: "５．受注伝票の出力\n　　受注入力後、受注伝票を出力し、営業企画の承認を受けて受注ファイルへ登録する。"
    表:
      A1:
        - [業務フロー, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~]
        - [システム名, ~, 番号, 業務範囲, ~, 業務内容, ~, ~, ~, ~, 作成会社, 担当者]
        - [販売管理システム, ~, '1.1', 見積・受注, ~, 見積依頼を受け、見積書提出、そして、その見積に対する注文受付までの流れ, ~, ~, ~, ~, セイワ情報システム, 浅野]
    結合:
      - A1:L1       # 表題（横結合）―― 広げない
      - A2:B2       # 二段見出しの上段
      - A3:B3
      - D2:E2
      - D3:E3
      - F2:J2
      - F3:J3
      - A4:F4       # レーンの見出し（横結合）
      - H4:L4
      - N4:R4
      - T4:X4
    # **狭いのはレーンの区切りの 3 列だけである。** 箱の辺は列の境目にあるので
    # 端はずれないが、区切りの縦線は 1 列ぶん傾く ―― そこを詰めると立つ
    列幅: {G: 1, M: 1, S: 1, Z: 54}
    # 説明欄は**箱の無い行**に置いてある（箱のある行を高くすると、線の付く
    # 位置が箱の中心からずれる）
    行高: {9: 70, 14: 70, 19: 70, 29: 90, 34: 55}
    折り返し: [Z9, Z14, Z19, Z29, Z34]
    印刷:
      ヘッダ左: 受注業務フロー
      ヘッダ右: 第 1.1 版
      フッタ中: "&P / &N"
      見出し行: '1:4'
    描画:
      # ── 得意先のレーン（A〜F 列） ──
      - 箱: [[見積依頼, （電話・メール）]]
        id: 10
        名前: 見積依頼
        形: flowChartDocument
        位置: B6:F8
      - 箱: [社内承認]
