        - [~, ~, '2-2', 受注入力, ~, ○, ~, ~, ~, 受注の作成・修正・削除]
        - [~, ~, '2-3', 受注請書／受注請書（控）, ~, ~, ~, ○, ~, ~]
        - [~, ~, '2-4', 受注伝票, ~, ~, ~, ○, ~, ~]
        - [~, ~, '2-5', 受注チェックリスト, ~, ~, ~, ○, ~, ~]
