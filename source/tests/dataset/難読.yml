      - [滞留債権, たいりゅうさいけん, 支払期日を過ぎても入金の無い請求のこと]
      - [赤伝, あかでん, 取消・返品を表す伝票。金額は負で計上する]
      - [取引先, とりひきさき, 請求の相手方。本書では法人・個人事業主の別を問わない]

