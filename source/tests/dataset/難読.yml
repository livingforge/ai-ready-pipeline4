置き場: 資料/R/請求・入金機能仕様書（第2.3版）.docx
なぜ: |
  **`仕様書.yml` の 1 冊を「節に割れるか」から「1 冊で下流の全工程を賄えるか」へ
  上げたもの。**

  あちらは 10 節で、立つ種別は画面・データ項目・メッセージ・バッチ・用語・課題・
  決定事項である。ここは 15 節あり、**基本設計と詳細設計の語彙をひととおり
  持っている** ―― 索引（`index`）・帳票（`report`）・外部インターフェース・
  コマンド・モジュール・メソッド・処理ステップ・バッチステップは、資料の側に
  その表が無ければ立てようがない。実案件の機能仕様書には全部あるのに、
  **検体の側にその表が 1 枚も無かった。**

  形のほうも上げてある。

  **1. 見出し 2 が 4 つ並ぶ節がある。** 画面の節は入力項目・表示項目・ボタン・
  遷移で 4 枚の表を持つ ―― 表の形（5 列）まで似ているので、見出しを渡さない
  実装では**どの表が何かを整理層が言えない。**

  **2. 変更履歴が 3 か所に入っている。** しかも**そのうち 1 つは表の中**である。
  `w:delText` を段落からしか拾わない実装は、表の中の削除を黙って落とす ――
  落とせば「もう消した」に見え、残せば「まだ生きている」に見える。

  **3. 脚注に例外条件しか書いていない箇所が 4 つある。** 「ただし〜の場合は」は
  本文に書かず脚注へ落とすのが日本の設計書の癖で、**例外がそこにしか無い。**

  **4. 箇条書きが 3 段で、3 段目が「例外の例外」である。** 深さを 1 段しか
  写さない実装は、2 段目と 3 段目を同じ深さにする ―― 親子が字下げにしか
  現れない資料では、それは意味の取り違えになる。

  **5. 表記が節をまたいで揺れている。** 1 節は「取引先」、7 節は「得意先」、
  12 節は「顧客」である ―― 同じマスタを指しているが、字は 3 通りある。
  **どれも資料の字なので、機械はまとめない。**

  **6. 方式設計と数字が食い違う。** 応答時間は方式設計が 2 秒、ここが 3 秒。
  保持期間は方式設計が 7 年、ここの脚注が 5 年である ―― **どちらの冊でも
  矛盾していない**ので、1 冊ずつ読んでいるあいだは見つからない。
