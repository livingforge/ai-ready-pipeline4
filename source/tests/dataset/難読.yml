      - ['3', 請求書の発行と送付, 経理部, 締め後 2 営業日以内, 一部自動]
      - ['4', 入金明細の取込, 経理部, 毎日 01:00 と 13:00, 自動]
      - ['5', 入金消込, 経理部, 取込の正常終了後, 一部自動]
