        - [~, 入金消込を手作業で行っており月末に 3 名を専任で充てている, 月次決算が 9 営業日まで延びている]
        - [システム, 3 つの部門システムに同じ取引先が別コードで登録されている, 与信残高と滞留債権を全社で合算できない]
