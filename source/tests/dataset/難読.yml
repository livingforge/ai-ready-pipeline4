置き場: 資料/R/請求・入金管理システム総合試験報告書（第1.1版）.pdf
なぜ: |
  **`検収.yml` の 1 冊を「しおりで割れるか」から「試験の段が丸ごと立つか」へ
  上げたもの。**

  あちらは確認項目と実施記録を持つが、しおりは 2 階層で、スキャンは巻末の
  1 枚だけである。ここは 3 階層あり、**スキャンが本文の途中に 2 枚挟まる** ――
  押印した判定書を章と章のあいだへ綴じ込むのは実物の報告書の定型で、
  **前後の章は読めているのにその 2 ページだけが読めない**という形になる。

  この 1 冊が突くのは 4 つ。

  **1. しおりが 3 階層ある。** `2` の下に `2.1`、その下に `2.1.1` がある ――
  `_toc` が割り先にするのは第 1 階層だけなので、節は 6 本しか出ない。
  **落とさないが割らない**という規律は、2 階層では「たまたま通っている」
  のと区別が付かない。

  **2. しおりの無い章が前と後ろの両方にある。** 前は表紙と改訂履歴（`（前書き）`
  になる）、後ろは巻末の「残課題」である ―― 後ろは直前の章に吸い込まれる。

  **3. スキャンが本文の途中にある。** 巻末の 1 枚なら「章が終わった」と
  読まれるだけだが、途中の 2 枚は**章の真ん中に穴が開く。**黙って空のページを
  出すと、整理層は前後の記述が繋がっていると読む。

  **4. 表が 4 枚あり、どれも空白で桁を揃えている。** PDF に列の切れ目は無いので
  組み直さないが、**紙の右から出ないこと**は検体の側の責任である（`/W` が
  無いと ASCII が全角送りになり、日付と件数の並んだ行が倍に伸びる）。
