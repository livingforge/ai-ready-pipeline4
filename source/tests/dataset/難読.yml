# 難度を上げた文書一式 ―― **1 案件ぶんの資料が、Excel 抜きで揃っている**形。
#
# `提案.yml` / `仕様書.yml` / `検収.yml` / `区切り.yml` は**形式ごとに 1 冊**、
# 「その形式で何が読めるか」を突く検体である。ここはそれとは軸が違う ――
# **6 冊で 1 つのシステムを言い切っている束**で、突くのはパースではなく
# **束としての通し**（凍結 → 正本 → 採番 → 検証 → 設計書）のほうである。
#
# 1 冊ずつの検体では現れないものが 3 つある。
#
# **1. 語彙が 5 種別で閉じない。** 資料が 1 冊なら、そこに書いてあるのは
# たいてい 1 つの工程のことである。実案件の束は企画から管理までを跨ぐので、
# 34 種別のほとんどが同時に立つ ―― `build` も `publish` も、そこを通った
# ことが無い。
#
# **2. 同じことが 3 冊に書いてある。** しかも**字が違う**（取引先／得意先／
# 顧客）。1 冊ずつ読んでいるあいだは、どれも正しい写しである。
#
# **3. 食い違いは冊をまたいで初めて見える。** 方式設計の「2 秒以内」と機能
# 仕様書の「3 秒以内」は、どちらの冊でも矛盾していない。

置き場: 資料/R/請求・入金管理システム方式設計（第4.2版）.pptx
なぜ: |
  **`提案.yml` の 1 冊を「読めるか」から「束の起点になれるか」へ上げたもの。**

  あちらが突くのは形（群・表 2 枚・貼り付け画像・行の短い表）で、ここは形を
  引き継いだうえで**中身の層を増やしている** ―― 事業目標・現状課題・リスク・
  マイルストーン・費用は、方式設計の 1 冊にしか書かれていない。企画の段
  （`business-goal` / `current-issue` / `risk` / `milestone` / `cost-item`）は
  **資料の側に無ければ立てようがない**ので、そこを持つ検体が 1 冊も無い
  あいだ、V 字のいちばん上は通しで 1 度も通っていなかった。

  形のほうも 1 段深くしてある。

  **1. 群が 3 階層ある。** ゾーン（バッチ系）→ サブゾーン（日次）→ その中の
  さらに区切り、という描き方は大規模案件の構成図に実在する。`提案.yml` は
  2 階層までで、**3 階層目を降りない実装はそこで初めて箱を落とす。**

  **2. 自分自身へ戻る線がある。** 再送・リトライは構成図でも自己ループで
  描かれる（`詳細設計書.yml` が Excel で突いているのと同じ形が、PowerPoint に
  もある）。

  **3. コメントが本文と食い違っている。** しかも**数字で**である ―― 移行方式の
  停止時間は表が 36 時間、コメントが実測 51 時間と言う。どちらも資料の字で、
  機械はどちらとも決めない。

  **4. 表記が冊の中で揺れている。** 同じスライドの中に「取引先」と「得意先」が
  両方出てくる（権限のスライドは業務部門の言葉、移行のスライドは現行システムの
  項目名）。**1 冊の中で揺れているので、冊をまたいだ突き合わせでは見つからない。**
