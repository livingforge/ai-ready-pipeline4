# jp-sier-std の準拠ルール（L2）。
#
# メタモデル（構造）では表せない**工程の約束**をここに置く。
# 「構造としては省略できるが、この工程を抜けるには埋まっていなければならない」
# という条件つきの規律は required では書けないため。

# この様式標準を継承したら必ず生成できるべき文書。
require_documents:
  - requirement-spec
  - basic-design
  - detail-design
  - traceability-matrix

# 文書の形そのものへの規律。**割った数が中身の数の半分を超えたら**
# （＝ 1 節あたり 2 件未満）、それは分類ではなく見出しの水増しである。
# 中身が少ないうちは割れて当たり前なので、6 件を超えてから見る。
document_rules:
  - { level: warn, min_rows_per_section: 2, when_rows_at_least: 6 }

# status に応じて属性を必須化する。
attribute_rules:
  # **測れない目標は、達成したかを誰も判定できない。** ただし承認時のみ・warn
  # 止まりにする ―― 現場の計画書には数値の無い目的（「顧客満足の向上」）が
  # 普通に載っており、error にすると整理層が推測で数字を書くことになる。
  - { type: business-goal, attribute: metric, level: warn, when_status: [approved] }
  # 対応策の無いリスクは、承認の時点では「気を付ける」としか言っていない。
  - { type: risk, attribute: mitigation, level: warn, when_status: [approved] }
  # 基本設計をレビューに出す時点で、処理単位の概要が無いのは差し戻しになる。
  - { type: screen, attribute: description, level: error, when_status: [review, approved] }
  - { type: report, attribute: description, level: error, when_status: [review, approved] }
  - { type: batch,  attribute: description, level: error, when_status: [review, approved] }
  # バッチは異常時の再実行方針が無いと運用に引き継げない。
  - { type: batch,  attribute: recovery,  level: error, when_status: [review, approved] }
  # 外部 IF は方式と形式が決まっていなければ相手と握れない。
  - { type: external-interface, attribute: protocol, level: error, when_status: [review, approved] }
  - { type: external-interface, attribute: format,   level: error, when_status: [review, approved] }
  # 非機能要件は測定条件が無ければ検収できない（IPA 非機能要求グレードのメトリクス）。
  - { type: requirement, attribute: metric, level: error,
      when_status: [approved], where: { kind: 非機能 } }
  - { type: requirement, attribute: nf_category, level: warn,
      when_status: [review, approved], where: { kind: 非機能 } }
  # 容量設計・保持期間はテーブル承認時に決まっていること。
  - { type: entity, attribute: volume,    level: warn, when_status: [approved] }
  - { type: entity, attribute: retention, level: warn, when_status: [approved] }
  # 不合格のテスト結果に不具合 ID が無いと、追跡が切れる。
  - { type: test-run, attribute: defect, level: error,
      when_status: [review, approved], where: { result: 不合格 } }
  # メッセージは「利用者が次に何をすればよいか」まで書く。
  - { type: message, attribute: action, level: warn, when_status: [approved] }

  # ── プログラム設計 ────────────────────────────────────────────
  # **揺れを止める強制は、`required` ではなくここで掛ける。** メタモデルで
  # 必須にすると整理層が推測で埋めるのは 3.2.0 / 3.4.0 / 3.5.0 / 3.8.0 で 4 度
  # 確かめてある ―― 「資料が言っているところまで」書いた draft は通し、
  # **実装に渡す（approved）ときだけ**欠けを error にする。
  #
  # **既存の案件には 1 件も鳴らない。** 新しい 4 種別はレコードが 0 件なら
  # ルールも当たらず、`module` の 1 本は「実装言語を宣言したモジュール」に
  # だけ掛かる（`{not: [~]}` は「値が入っていること」）。設計書だけを作る
  # 案件は、この段の語彙に 1 行も書かないという形で降りられる。
  - { type: implementation-standard, attribute: rule, level: error,
      when_status: [approved], where: { standard_kind: { not: [型写像] } } }
  # **型写像は散文ではなく欄で書く。** 散文だと `arp4 emit` が読めず、案件が
  # 決めた綴りが生成に効かない ―― 承認された写像が空欄なのは、決めていないのと
  # 同じである。
  - { type: implementation-standard, attribute: logical_type, level: error,
      when_status: [approved], where: { standard_kind: 型写像 } }
  - { type: implementation-standard, attribute: physical_type, level: error,
      when_status: [approved], where: { standard_kind: 型写像 } }
  # 引数名が無ければ、生成のたびに違う名前が付く ―― 呼ぶ側と噛み合わない。
  - { type: parameter, attribute: param_name, level: error,
      when_status: [approved] }
  - { type: query, attribute: operation, level: error, when_status: [approved] }
  # 口は「メソッド + 経路」で決まる。片方が空なら、どこにも生えない。
  - { type: endpoint, attribute: path,        level: error, when_status: [approved] }
  - { type: endpoint, attribute: http_method, level: error, when_status: [approved] }
  # **実装言語を宣言したなら、出す先も決まっていること。** 決まっていないと、
  # 同じ正本から出したコードが毎回違う場所に落ちる。
  - { type: module, attribute: source_path, level: error, when_status: [approved],
      where: { language: { not: [~] } } }

# トレースの欠落を、様式標準の判断で warn から error に上げる。
# メタモデルの warn_if_no_upstream は warn 固定であり、
# 「承認までに必ず埋める」かどうかは様式の判断だから。
trace_rules:
  - { type: screen, relation: realizes, level: error, when_status: [approved] }
  - { type: report, relation: realizes, level: error, when_status: [approved] }
  - { type: batch,  relation: realizes, level: error, when_status: [approved] }
  - { type: external-interface, relation: realizes, level: error, when_status: [approved] }
  # 承認済みなのに実現する設計要素が無い要件＝設計漏れ。
  - { type: requirement, relation: realizes, direction: to, level: error,
      when_status: [approved], where: { kind: [機能, 非機能] } }
  # 承認済みなのにテストが無い要件＝検証漏れ。
  - { type: requirement, relation: verifies, direction: to, level: warn,
      when_status: [approved], where: { kind: [機能, 非機能] } }
  # 承認済みの課題に決定が無い＝未決着のまま締めようとしている。
  # 型の指し先が無い引数は `impl_type` を書いているはずだが、**そちらは
  # 言語ごとに揺れる** ―― 正本の語彙で指せるものは指しておく。warn なのは
  # `Path` / `list[str]` のように相手が正本に無い型が普通にあるためである。
  - { type: parameter, relation: typed-as, level: warn, when_status: [approved] }
  - { type: open-issue, relation: resolves, direction: to, level: warn,
      when_status: [approved] }

# ベースライン（版として締める）前提。arp3 conform --baseline のときだけ回る。
status_rules:
  baseline_requires: approved
