name: test-result
title: テスト結果報告書
output: テスト結果報告書
phase: テスト          # out/ のフォルダはこれで決まる
sections:
  # テスト設計（test-case）と実行結果（test-run）を分けているので、
  # 回帰は同じケースに実施記録を積み増せる。
  #
  # **分類は `to`（テストケース）側から出す。** 3.15.0 は実施の側にも
  # `category` を宣言して `from.category` を列に置いていた（「片方だけに列を
  # 置くと実施結果の側の分類が束のどこにも出ない」）が、**通し実行を回すと
  # 整理層は分類を `to` 側にしか書かない** ―― 点検表の 1 行が「点検項目 1 件」
  # ＋「実施結果 1 件」の 2 レコードになる形で、分類は行の左端に 1 つあるだけ
  # だからである（同じ値を両方へ写すのは二重登録になる）。実測（r001）で
  # `from.category` は全行空になり、`check` が `W043`（同じ名前の別の欄に値が
  # ある）で鳴った。見出しの既定は 大分類 なので資料の語（分類）に直す。
  #
  # **列を差し替えるだけでは終わらない ―― 宣言のほうを落とした**（3.16.0）。
  # 出す先の無い属性は `P111`（正本に値があるのにどの設計書にも出ない）に落ち、
  # `test_E_標準パックの様式は宣言済みの属性を出す` が全属性を見張っている ――
  # **様式と語彙は対で直す**（`test-run.category` を落とした理由は
  # `metamodel.yml` の `test-run` に書いてある）。空の列を残して `W043` を
  # 鳴らし続ける道もあったが、得られるのは「分類は点検項目の側にある」という、
  # そこに書いてある事実だけである。
  #
  # **`from.subsystem` は足さない。** 足すと この表とテスト仕様書「テストケース」が
  # テストID・サブシステム・仕様 の 3 列を共有し、`P106`（同じアイテム 10 件が
  # 両方の設計書に全文で出ている）が鳴った ―― この章は**実施の記録**であって
  # テストケースの再掲ではないので、ケース側の属性はここに積まない
  # （`to` を指すだけにして相手の仕様文を写さない、というテスト仕様書
  # 「検証対象の対応」の規律と同じ）。`test-run.subsystem` に入っている 10 件が
  # 分類の入れ違いであることは、テスト仕様書側の注記に書いてある。
  - heading: 実施結果
    kind: relation
    relation: executes
    labels: { "to.name": テストケース, "from.name": 実施の名称,
              "to.category": 分類,
              "from.description": 実施記録の補足, description: この行の補足 }
    # **実施の出典を出す**（3.16.1）。テスト結果は関係の表にしか出てこない種別
    # なので、ここに出典列が無いあいだ**どの試験報告の何ページの記録なのかが
    # 生成物から辿れなかった** ―― 出すのは `from.source`（実施記録の出典）で、
    # ケース側の出典はテスト仕様書「テストケース」が既に出している。
    columns: ["to.test_id", "to.level", "to.name", "from.run_id",
              "from.name", "to.category", "from.result",
              "from.executed_on", "from.tester",
              "from.defect", "from.statement", "from.description", description,
              "from.source"]

  # **結果と指摘は対で 1 つの点検である**（3.16.0）。点検表は結果 10 件それぞれに
  # 「指摘 N を参照」と書き、指摘 6 件は別シートにある ―― 受け皿が無いあいだ、
  # `from.defect` の `指摘1` という**資料の中でしか通じない文字列**が上の表に
  # 出るだけで、報告書を読んだ人は指摘の中身に辿り着けなかった（→ `metamodel.yml`
  # の `finds`）。`defect` の列は残す ―― 外部の不具合管理の番号を写す欄で、
  # 正本の課題を指す関係とは別のものである。
  #
  # **相手（課題）の仕様文は写さない。** 指摘の本文・回答・確認は課題管理表が
  # 持っており、両方に全文を置くと `P106` が鳴る ―― ここに出すのは
  # 「どの結果がどの指摘を出したか」と、**その指摘がいま閉じているか**である。
  #
  # **gap の章（指摘の無い結果）は作らない。** 適合の結果に指摘が無いのは
  # 正常で、実測 10 件のうち 4 件がそれに当たる ―― 漏れの一覧のつもりで並べると、
  # **合格していることが「指摘漏れ」として毎回並ぶ**（トレーサビリティ・
  # マトリクスに「コード定義 → テストケース」を足さなかったのと同じ理由）。
  - heading: 結果が出した指摘
    kind: relation
    relation: finds
    labels: { from: 実施結果, "to.name": 指摘, description: 補足 }
    columns: [from, "from.result", "to.issue_id", "to.name", "to.state",
              "to.assignee", "to.due", description]

  - heading: 未実施のテストケース
    kind: trace
    type: test-case
    relation: executes
    gap: true
    columns: [test_id, level, name, expected]
