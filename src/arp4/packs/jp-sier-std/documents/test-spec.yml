name: test-spec
title: テスト仕様書
output: テスト仕様書
phase: テスト          # out/ のフォルダはこれで決まる
sections:
  # **`category`（分類）を出す。** 点検表の分類（情報区分 / ログ / 分離 / 認証 /
  # 監査 / 暗号化 / 通信 / 委託 / 廃棄）は点検の観点で、他の冊子が左端に置く
  # サブシステムとは軸が違う ―― 受け皿が `subsystem` しか無かったので 10 件が
  # そこへ入り、他冊子の主軸と同じ列に混ざった。
  #
  # **節は `level` のまま。** 3 つの軸（段階・観点・サブシステム）のうち節に
  # 使えるのは 1 つで、V 字のどの段かがテスト仕様書の一級の割り方である
  # ―― 同じ「認証」の項目が単体にも受入にも立つ（基本設計書「業務ルール」と
  # 同じ規律：節に使えない軸は列で出す）。
  #
  # **`subsystem` の列は足さない。** 決定 75（割らない種別でも主軸は列に出す）に
  # 反するように見えるが、いまここに入っている 10 件は主軸ではなく**点検の分類が
  # 誤って入ったもの**である ―― 列を足すと 10 件は印字されて正しく見え、値が
  # 間違った欄にあることを示す `P111`（正本にあるのにどの設計書にも出ない）が
  # 黙る。**受け皿ができた以上、鳴り続けるほうが手がかりとして正しい。**
  # 次のラウンドで分類が `category` へ移り、本当のサブシステムが入ったときに
  # 足す（そのときは `P111` が新しい 10 件で鳴る）。
  #
  # 見出しは資料の列名に合わせて 分類 にする（`category` の既定は 大分類）。
  - heading: テストケース
    type: test-case
    group_by: level               # 単体 / 結合 / 総合 / 受入
    labels: { category: 分類 }
    columns: [test_id, category, name, precondition, steps,
              expected, statement, description, source]

  # `verifies` の相手は要件・業務ルール・制約と種別がまちまちだが、**どれも
  # `名称` を持つ**ので 1 表に畳むと見出しがぶつかる。`labels` で名指しする。
  #
  # **相手は指すだけにする（`to`）。相手の仕様文を写さない。** `verifies` は
  # N 対 1 なので、写すと 1 つの仕様文が辺の数だけ複製される ―― 実測で
  # `arp4.paths` の 1 文が 392 行、`arp4.parse` が 311 行に並び、テスト仕様書
  # 657KB のうち 525KB（8 割）がこの章だった。この章の値は**対応そのもの**で
  # あって相手の仕様ではなく、相手の仕様は相手の設計書で読む。
  - heading: 検証対象の対応
    kind: relation
    relation: verifies
    labels: { "from.name": テストケース, "to": 検証対象 }
    columns: ["from.test_id", "from.name", "to", description]
