# JavaScript ―― **型を書く場所が無い言語**である。
#
# 対応表を空にするのではなく `typed: false` と宣言する ―― 空にすると、生成の側は
# 「型が決まっていない」と「そもそも書けない」を区別できず、**決まっている型まで
# 「決まっていません」の印が付く。**（`parse` が「読めなかった」と「資料に無い」を
# 分けているのと同じ形である。）
#
# 型そのものは doc コメントへ出る（`statement` と疑似コードと同じところ）。
language: JavaScript
extension: .js
comment: "//"
typed: false
types: {}
