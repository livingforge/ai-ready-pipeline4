# Python の型の対応（骨格生成の既定）。
#
# **ここは「機械の表」である**（→ sql.yml の頭のコメント）。選んだのは arp4 な
# ので、生成物の頭に「どの表を使ったか」を必ず書く。案件で変えたいときは
# 消費側のパックで同名のファイルを置き直す。
#
# **持つのは型の対応と綴りだけ**である ―― どこに何を並べるか（クラスの形・
# メソッドの並べ方）は emit.py が持つ。
language: Python
extension: .py
comment: "#"
types:
  文字列:      { form: "str" }
  数値:       { form: "Decimal" }
  整数:       { form: "int" }
  日付:       { form: "date" }
  日時:       { form: "datetime" }
  真偽:       { form: "bool" }
  バイナリ:     { form: "bytes" }
  操作:       { form: "None" }
