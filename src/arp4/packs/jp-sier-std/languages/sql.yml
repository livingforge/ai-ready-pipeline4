# SQL の型の対応（DDL 生成の既定）。
#
# **ここは「機械の表」である** ―― `parse._MEMBER` と同じ位置づけで、意味の判断
# ではなく綴りの対応にすぎない。ただし**選んだのは arp4 である**（`数値` を
# `NUMERIC` にするか `DECIMAL` にするかは方言の話）ので、生成物の頭に
# 「どの表を使ったか」を必ず書く ―― 黙って選ぶと、読み手には資料にそう
# 書いてあったのか arp4 が決めたのかが見分けられない。
#
# 案件で変えたいときは、**消費側のパックでこのファイルを同名で置き直す**
# （`documents` と同じ「同名は派生側が勝つ」）。
language: SQL
extension: .sql
comment: "--"

# `{length}` / `{decimals}` は data-item の欄で置き換える。欄が空のときは
# `default` の形を使う ―― **桁の無い `VARCHAR` を勝手に決めない**。
types:
  文字列:   { form: "VARCHAR({length})", default: "VARCHAR" }
  数値:     { form: "NUMERIC({length},{decimals})", default: "NUMERIC" }
  # `decimals` が 0 か空のときの形。小数の無い数を `NUMERIC(n,0)` と書くと、
  # 現場の DDL（`INTEGER` / `BIGINT`）と綴りが揃わない。
  整数:     { form: "NUMERIC({length})", default: "INTEGER" }
  日付:     { form: "DATE" }
  日時:     { form: "TIMESTAMP" }
  真偽:     { form: "BOOLEAN" }
  バイナリ: { form: "BLOB" }
  # 値を持たない画面部品（ボタン・ラベル）。**列にはならない** ―― 出したら
  # 資料に無い列を作ることになるので、DDL では落として本数を申告する。
  操作:     { form: "" }
