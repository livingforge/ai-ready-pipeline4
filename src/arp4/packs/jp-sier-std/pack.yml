# jp-sier-std — 日本の受託システム開発（V 字）向け標準メタモデル。
#
# 消費側プロジェクトは `<spec>/metamodel.yml` に `extends: jp-sier-std` と書いて継承し、
# **追加と厳格化だけ**ができる（緩和は M1xx が拒否する）。
pack: jp-sier-std
# 3.1.0 — business-rule / constraint に採番を足し、calls / transitions を加え、
#         nf_category を extensible にした（設計書の ID 列に内部 ID が出ていた）。
# 3.2.0 — operates.permission の required を外した。現場の権限マトリクスは
#         ○ / × / △ しか書いておらず、必須にすると整理層が推測で埋めることになる。
# 3.3.0 — flow-step / has-flow-step / leads-to を足した。図形の接続が決定論で
#         取れるようになり（parse の s4-c1）、業務フローの順序と分岐を文章では
#         なく関係として持てるようになったため。business-flow.steps は残す
#         （線が繋がっていない資料では文章しか書けない）。
# 3.3.1 — 両端が同じ種別の関係を畳んだ 3 つの表（詳細設計書の呼出関係・メソッドが
#         出すメッセージ、テスト仕様書の検証対象の対応）へ `labels` を当てた。
#         規律は 3.1.0 で決めていたが当て忘れていて、`名称` が 2 列並んだまま
#         出ていた（実測：呼出関係 77 行）。**語彙は変えていない。**
# 3.4.0 — accesses.crud の required を外した。3.2.0 で operates.permission に
#         当てたのと同じ理由で、資料が「触る」ことしか言っていないとき（コードの
#         import）に整理層が**関係そのものを捨てていた**。
# 3.5.0 — method.signature の unique を外した。3.2.0 / 3.4.0 と同じで、制約が
#         整理層に**資料の値の書き換え**を強いていた（`scan(directory: Path)` が
#         2 モジュールで衝突し、`yamlio.scan(...)` と修飾して回避していた）。
#         シグネチャはモジュールの中でしか一意でない ―― 実測で 77 メソッド中
#         13 件が衝突する。同一性は method_id が持つ。
# 3.6.0 — constraint に warn_if_unreferenced を足した。requirement / business-flow /
#         flow-step には付いていたのに制約だけ**付け忘れていた** ―― 実測で、
#         arp4 自身を通した 1 ラウンドの制約 32 件が**全件 constrains 0 本**のまま
#         error 0 / warn 0 で通っていた。要件定義書には行として出るので、
#         繋がっていないことが読み手からは見えない。
# 3.7.0 — method の signature / returns / raises に `column` を足した。パース結果の
#         どの欄から来た値かを宣言すると、凍結ゲートが「**出典の欄は埋まっている
#         のに属性が空**」を照合できる（`G018`）。宣言できるのは見出しを arp4 自身
#         が書いている表だけである ―― Excel の見出しは現場の文字列で揺れる。
# 3.8.0 — テストの語彙を、資料がコードである現実に合わせた（62 ファイル通しの実測）。
#         (1) verifies の to に module を足した ―― 一番細かい method しか無く、
#         テストケース 527 件中 517 件が関係 0 本のまま通り、トレーサビリティ・
#         マトリクスが全章「（該当なし）」で出た。(2) test-case の level / steps の
#         required を外した（3.2.0 / 3.4.0 と同じ判断 ―― コードは段階も手順書きも
#         言わず、空欄にした正しい作業が E010 を 1054 件出して publish に拒まれて
#         いた）。(3) test-case に warn_if_no_upstream: verifies を足した
#         （3.6.0 の constraint と同じ付け忘れ ―― 関係 0 本の全損に警告が 1 件も
#         出ていなかった）。トレーサビリティ・マトリクスにモジュール →
#         テストケースの 2 章を足した。
# 3.9.0 — 見出しに出る enum に value_labels を足した（business-rule.rule_kind /
#         module.tier）。**値は訳さない** ―― 訳すと整理結果に書いた値と正本の値が
#         ずれ、E011 が自分の出力を弾く。実測で基本設計書の業務ルールが
#         「7.1 business」…「7.7 未分類」と英語と日本語の混在で出荷された
#         （publish.md の「列見出しは日本語」は**列しか見ていなかった** ――
#         group_by が作る節の見出しは素通りしていた → P003）。
#         あわせて data_type の required はそのままに、**欠落を known_gaps で
#         宣言できる**ようにした（→ 決定 66）。3.2.0 / 3.4.0 / 3.5.0 / 3.8.0 は
#         いずれも required を外して解決したが、型は本来必須であり、緩めると
#         「型を書き忘れた」と「資料に型が無い」が混ざる。実測で E010 14 件
#         （帳票の出力項目シートに型の欄が無い）が --force を招き、同時に鳴って
#         いた W030 32 件・W031 27 件・W044 6 件をまとめて無音にしていた。
# 3.10.0 — 出典どうしの食い違いを黙って片方勝ちにしないための 3 つ（→ 決定 70-72）。
#          (1) 属性に merge: append を宣言できるようにし、description をこれにした。
#          実測で B022 が 6 件出ていて、6 件とも description・6 件とも相補だった
#          ―― 5.権限マトリクスの「与信保留の解除は △（部長職のみ可）」が
#          4.セキュリティ方式の「営業部 120 名。…」に上書きされ、△ は正本からも
#          生成物からも消えていた（勝者はソースの読み順で決まる）。
#          (2) operates.permission に 不可 / 条件付き と condition を足し、属性に
#          negative を宣言できるようにした。× を「関係を張らない」で写すと升の
#          空欄が「不可」と「記載が無い」の 2 つを同じ見た目にする ―― parse が
#          最も強く守っている規律を、正本の設計レベルで破っていた。
#          (3) 詳細設計書の呼出関係に「呼び出す目的」列を足した（refs の note）。
#          モジュール一覧のクラス構成は呼出 11 本すべてに目的を書いているのに、
#          書く場所が無くて 11 本とも落ちていた ―― うち 1 本は課題 ISS-016
#          （消費税の計算単位）の証拠そのものである。
# 3.11.0 — 工程レイヤ `企画` と 5 種別（プロジェクト概要・事業目標・現状課題・
#          リスク・マイルストーン）、関係 3 本（contributes-to / addresses /
#          threatens）、文書「プロジェクト計画書」を足した。**「なぜこの
#          システムを作るのか」に受け皿が 1 つも無かった** ―― 実測（r001 の
#          レビュー）で「受注受付の手入力の対象を 6 割減らす」が正本にも
#          生成物にも残らず、制約 102 件のうち 6 組が「要件定義書とプロジェクト
#          計画書の両方に書かれ、concept 名が別々に付いた」二重登録になって
#          いた（受け皿の無い情報は、消えるか、近い種別へ滲み出して重複に
#          なるかのどちらかである）。あわせて 2 つ ―― `references`
#          （entity → entity。**ER 図が 1 本も描けなかった** ―― 張れる関係が
#          refines（同一種別の階層化）しか無く、多重度も外部キーも持てない）と、
#          `refines` の両端への `actor` / `business-goal` の追加（ロール階層と
#          目標の階層が description の散文に落ちていた）。
#          **`out/<番号>_<工程>/` の番号は 1 つ繰り下がる**（`1_要件定義` →
#          `2_要件定義`）―― レイヤを先頭に足したため。
# 3.12.0 — `decision` / `test-run` に写像（fact_types）を足し、`establishes`
#          （決定 → 要件・業務ルール・制約・事業目標）を加えた。**この 2 種別だけ
#          整理結果から書けず、議事録とテスト結果報告書に入口が無かった** ――
#          属性は `decided_by`（会議体）・`tester`・`executed_on` と資料を写す欄
#          しか無く、課題管理表の「決定事項」節は `source` 列まで持っているのに
#          写像だけが無い。同じ議事録から起こす `open-issue` は写像を持っており、
#          **線引きに理由が 1 行も書かれていなかった。** 回避策（「中身は業務
#          ルールへ寄せ、決定そのものは正本で人が起こす」）は実測で失敗している
#          ―― sales-corpus 30 冊で議事録の決定事項が**正本に 1 件も入らなかった**。
#          テスト側は供給経路の無い自己申告になっていた（「必要な語彙: test-run」
#          と出るが、資料を渡しても整理層が書けない）。
# 3.13.0 — `process-step` と関係 2 本（`has-process-step` / `proceeds-to`）、
#          詳細設計書に「処理フロー」「処理フローの分岐」の 2 節を足した。
#          **オンライン処理の処理フローに受け皿が 1 つも無かった** ―― `has-step`
#          は batch → batch-step、`has-flow-step` は business-flow → flow-step に
#          縛られており、処理仕様書の「3.処理フロー」（図形 13 個・接続 13 本が
#          パース結果に取れている）を構造として置く場所が無い。実測
#          （sales-corpus r001・処理仕様書 4 冊）で 4 ロットが独立に散文へ逃がし、
#          詳細設計書のステップ表はバッチ 6 件だけで出た ―― 3.11.0 の企画レイヤと
#          同じ「受け皿の無い情報は、消えるか近い種別へ滲み出すかのどちらか」である。
#          **既存の 2 種別を流用しなかった理由**は 2 つ。(1) `batch-step` の語彙
#          （Chunk / Tasklet・コミット間隔・多重度）は再実行の単位を決めるためのもので
#          オンラインには当たる欄が無く、逆に矢印を張る関係が無いので**判定の枝が
#          消える**。(2) `flow-step` に相乗りすると、要件定義書の「業務フローの手順」
#          「業務フローの流れ」が種別で絞らずに全件を出す（関係の章は `where` を
#          適用しない）ため、**詳細設計のステップが要件定義書へ漏れる。**
# 3.14.0 — 資料の**主軸の列**に受け皿が無く、`description` の散文か `note` へ
#          畳まれていた 4 か所を属性にした。どれも「無いと生成できない表がある」
#          もので、3.11.0 / 3.13.0 と同じ「受け皿の無い情報は、消えるか近い種別へ
#          滲み出すかのどちらか」である。
#          (1) `open-issue` に state / category / raised_on / raised_phase。
#          日本の課題管理表は No / 起票日 / 工程 / 区分 / … / 状態 の形で、
#          **左の 3 列と右端が丸ごと無かった。** 回避策（「整理層が description の
#          散文へ写す」―― issue-register にそう書いてあった）は、同じブックの
#          「集計」シート（状態を数えただけの表）に当たるものを作れない。実測
#          （sales-corpus r001）では整理層が素直に `attrs.category` へ入れ、
#          `G016` 7 件（＝課題の全件）が鳴って `build` が `B021` で捨てていた
#          ―― **捨てるところまで通る。** `current-issue` は `category` を持って
#          いたので、名前も並びも近い 2 種別で片方だけが持っている状態でもあった。
#          あわせて organize.md の `notes` の書き方の例が**この穴そのもの**で、
#          毎ラウンド同じ 3 件が起票されていた。
#          **`status` とは別物**である（あれは査読状態。issue-register は前から
#          出さないと決めていた ―― 資料が「完了」と言う課題が「レビュー中」と出る）。
#          (2) `displays` に physical_name / default_value。`has-column` は
#          両方を宣言しているのに画面・帳票側は 1 つも持たず、実測で `note` が
#          「物理名 shipDate ／ 初期値 翌営業日 ／ 営業日であること」と 3 列を
#          1 つの散文へ畳んでいた ―― **備考は、行き先の無い列の捨て場になる。**
#          (3) `batch` に start_time。バッチ一覧は 起動契機 / 起動時刻 / 先行ジョブ
#          の 3 列で、受け皿は `trigger` 1 つだった（実測で
#          `時刻起動 07:30/10:30/…` と 2 列が 1 文字列に畳まれ、起動時刻での
#          並べ替えもジョブネットとの突合もできなかった。8 件中 7 件が値を持つ）。
#          (4) `interfaces` に physical_name / position / length / not_null / note。
#          「桁割りは順序が仕様である」と長く書いてありながら**桁そのものを書く欄が
#          無く**、実測で関係 20 本の属性が 0 件だった。同じデータ項目が IF ごとに
#          違う名前・違う桁で載るので、`to.length` では電文を組めない。
#          **どれも required にしない**（3.2.0 / 3.4.0 / 3.8.0 と同じ判断 ――
#          必須にすると整理層が推測で埋める）。
# 3.15.0 — **企画・管理・監査の側の受け皿を足した。** 標準パックは設計工程
#          （画面・帳票・テーブル・モジュール）に厚く、企画・管理・監査に薄い
#          ―― 稟議書・PoC 評価報告書・情報セキュリティ点検表・利用申請台帳・
#          体制と要員計画・運用引継ぎ資料・キャパシティ試算・テナント別コスト実績の
#          8 冊を通した実測（kotonoha r001）で、**資料に列があるのに正本に受け皿が
#          無い**ものが 14 件出た。3.11.0 / 3.13.0 / 3.14.0 と同じ「受け皿の無い
#          情報は、消えるか、近い種別へ滲み出すかのどちらか」である。
#          (1) 属性 10 個。`business-goal.target`（資料は 測り方 / 現状 / 目標 の
#          3 列で、**到達値だけが statement の文中に埋まっていた** ―― 一覧には
#          現状値しか出ない）。`requirement.measurement` / `frequency`（SLO 5 件
#          すべてが持つ 2 列。`metric` は目標値の側で使うので相乗りさせると
#          3.14.0 の `batch.trigger` と同じ「2 列を 1 文字列」になる）。
#          `constraint.rationale` / `business-rule.rationale`（根拠列。キャパシティ
#          試算・PoC 評価・単価表がすべて持ち、**単価の妥当性を示す唯一の記述**
#          だった。`decision.rationale` と同じ名前に寄せた）。`open-issue.answer` /
#          `confirmed_on`（点検表の「指摘 / 回答 / 確認 / 状態」の 4 行組。回答と
#          確認を `positions`（両論）へ入れて凌いだ結果、**食い違いでないもの
#          2 件が「決着していない矛盾」の表に出た**）。`test-case.category` /
#          `test-run.category`（点検の観点。受け皿が `subsystem` しか無く、
#          他冊子の主軸と同じ列に混ざった）。`actor.physical_name`（テナント識別子
#          `cs-support`。`name` の括弧書きへ逃げ、他資料の綴りと機械では
#          突き合わなかった）。
#          (2) `verifies` の to に `code-master` / `entity` / `constraint`。点検表
#          2.点検項目 の 10 行はコード定義・テーブル・制約を点検しているのに
#          相手が無く、**張れたのは 2 行だけ**で残る 8 行はトレーサビリティに
#          1 行も出なかった（3.8.0 で `module` を足したときと同じ形 ―― あのときは
#          粒度、今回は種別が足りなかった）。
#          (3) `reports-to` / `outsources-to`（actor → actor）。体制図の凡例が
#          線種で指揮命令と委託を描き分けているのに `actor` どうしを結べるのは
#          `refines`（階層化）しか無く、7 本のうち 5 本を代用、上下関係でない
#          2 本は**張られずに落ちた。** `same_type_only` は付けない（両端が
#          `actor` だけなので何も縛らない）。**向きは機械が直せない** ――
#          両端が同じ種別だと `orient` はどちらの向きでも成立と答える。
#          (4) 種別 `cost-item`（費用項目。layer 企画）。稟議書 3.投資内訳 の
#          6 行はすべて金額の列を持つのに受け皿がどの種別にも無く、**6 件すべてが
#          金額を statement の文中に埋めた** ―― 投資額が列として引けない。
#          `amount` は **int にしない**（単位が表の外にあり、最後の行が率で
#          書かれる）。接頭辞は `cit`（`cst` は `constraint`）。
#          様式は対で直した ―― プロジェクト計画書に「費用」章と `target` 列、
#          要件定義書に 測り方 / 確認頻度・識別子・「指揮命令」「委託」の 2 章・
#          根拠、課題管理表に 回答 / 確認日、テスト仕様書とテスト結果報告書に
#          分類、基本設計書・詳細設計書に 根拠。**属性を足しただけでは列は出ない。**
# 3.16.0 — **今度は「種別は足りているが、繋ぐ先が無い」形の穴だった。** 3.15.0 で
#          企画・管理・監査の種別と属性を足したあと、同じ 8 冊（kotonoha r001）を
#          もう 1 周した実測で残ったのは**関係の穴**に寄っていた ―― 受け皿の
#          あるところへ写せるようになった結果、写した先どうしが繋がらない。
#          (1) `constrains` の to に `project-overview` / `cost-item`。稟議書
#          2.スコープ の 9 行を `project-overview`（適用範囲 / 適用範囲外）へ
#          写すと、投資額の総額（`constraint`）からその範囲を縛れない ――
#          実測で `c-cst-初年度の投資額` が `constrains` 0 本のまま `G020` に
#          なった。**総額はスコープを縛るために書かれている**のに、正本では
#          ただの数字として並ぶ。
#          (2) `disputes` / `establishes` の to に `actor` / `project-overview` /
#          `cost-item`（**2 本まとめて**。`test_決定は何を定めたかを指せる` が
#          同じ集合であることを見張っている ―― `cost-item` を作ったときの
#          コメントに「実例が出てから 2 本まとめて足す」と書いてあった）。
#          `actor` は体制図の争点である ―― 凡例は「実線 = 指揮命令 / 破線 =
#          委託」の 2 分類だが、実線 7 本のうち 点検依頼・提供・月次締め の
#          3 本はどちらでもなく（相手はいずれも本部の外の部署）、整理層は
#          摘出したのに**争点が組織どうしの線なので張れず**、課題管理表に
#          出せなかった。`project-overview` は「PoC でデモした回答文の生成は
#          スコープに含めない」と決めた `決定事項` の定めた先で、無いあいだ
#          決定が関係 0 本で宙に浮いていた。
#          (3) 関係 `finds`（テスト結果 → 課題）。点検表は結果 10 件それぞれに
#          「指摘 N を参照」と書き、指摘 6 件は別シートにある ―― `test-run.defect`
#          に `指摘1` という**資料の中でしか通じない文字列**を置くしかなく、
#          設計書では文字列の突き合わせでしか繋がらなかった。`defect` は残す
#          （外部の不具合管理の番号を写す欄で、`conformance` の「不合格なのに
#          defect が空」を error にする規律がそこに乗っている）。
#          (4) 関係 `affects`（現状課題 → 利用者・ロール）。稟議書 2.背景 は
#          5 行すべてが「影響を受けている部門」列を持ち、受け皿が無いので
#          5 件とも部門名が `current-issue.impact`（影響の**内容**の欄）へ
#          入っていた。あわせて `risk.impact`（enum 大 / 中 / 小）を計画書の
#          節側で 影響度 と名指しした ―― 属性名は分けない（`current-issue` と
#          `risk` は名前も並びも近く、片方だけ違う名前にしたのが 3.14.0 の穴）。
#          (5) 属性 3 つ。`open-issue.verification`（確認の中身。3.15.0 は
#          `confirmed_on` までしか足しておらず、`実機で弾かれることを確認した`
#          が 5 件とも `description` へ流れて `G030` が鳴っていた ―― 日付だけの
#          列は「誰かが何かを確かめた」以上のことを言わない）。
#          `code-value.retention`（機密区分表の保持期間。`entity.retention` と
#          同じ名前・同じ見出し）。`constraint.quantity`（「月間上限 500,000
#          チャンク」のように**1 レコード = 1 数値**で書かれた規模の想定。
#          `cost-item.amount` はあるのに制約には無く、同じ台帳の中で「見積の
#          金額は列、規模の数値は文」という非対称が出ていた。`int` にしない
#          理由・単位や時点の列を足さない理由・**数表は受けない**ことを
#          メタモデル側に書いた）。
#          **足さなかったもの 2 つと、その理由をメタモデルに残した。**
#          `code-value` の「外部への送出可否」は業務ルールのまま ―― 1 周目は
#          業務ルールへ、2 周目は `statement` へ入れており、**担当ごとに割り方が
#          変わる**という申告そのものが穴だった。線引きを 1 度だけ決めた
#          （**期間・量は仕様＝属性、可否・要否は規則＝業務ルール**。`retention`
#          は `entity` が同じ名前で持っているので属性側に落ちる）―― 次に来る
#          「マスキング要否」「監査ログ要否」はこの線でむこう側に落ちる。
#          `constraint` の運用作業の区分（監視 / 障害 / 定常 / 変更）は属性も値も
#          足さない ―― `category` は `extensible: true` なので整理層はそのまま
#          書けた（実測で潰れたのは、宣言された 6 値を**閉じた集合**と読んだため
#          で、受け皿の穴ではない）。軸としても、費用の区分（設備 / 人件 / 予備）
#          のように**同じ列に並ぶこと自体が誤り**ではなく、運用の下位区分として
#          同じ列に並んで読める ―― 属性にすると、1 冊 11 行のために全案件の
#          制約一覧へ空列が 1 本増え、同じ表を節と列で 2 度割ることになる。
#          **3.15.0 で足した `test-run.category` は落とした。** 足した理由は
#          「点検表は点検項目と実施結果が同じ分類で並ぶので、片方だけに受け皿を
#          置くと実施結果の側が `subsystem` へ逃げる」だったが、通し実行では
#          **整理層は分類を `test-case`（点検項目）側にしか書かない** ―― 点検表の
#          1 行が 2 レコードになる形で、分類は行の左端に 1 つあるだけである
#          （同じ値を両方へ写すのは二重登録）。実測で `from.category` の列が
#          全行空になり `W043` が鳴り、列を `to.category` へ差し替えると今度は
#          出す先の無い属性として `P111` に落ちた（`test_E_標準パックの様式は
#          宣言済みの属性を出す`）。**様式と語彙は対で直す** ―― 逃げ場の問題は
#          `test-case.category` が閉じており、実施結果の行はテスト結果報告書で
#          `to.category` を出しているので分類つきで読める。ケース抜きで分類ごとに
#          集計する結果表が来たら、消費側のメタモデルで足す。
#          様式は対で直した ―― 計画書に「影響を受ける部門」章と 影響度、
#          要件定義書と基本設計書に 数量、基本設計書のコード定義に 保持期間、
#          課題管理表に 確認内容 と「指摘の出どころ」章、テスト結果報告書に
#          「結果が出した指摘」章。**関係や属性を足しただけでは列も章も出ない。**
version: "3.16.0"
description: 日本の受託システム開発向け標準メタモデル（要件定義〜基本設計〜詳細設計〜テスト）

metamodel: metamodel.yml
documents: documents
conformance: conformance/rules.yml

# 予約名前空間 — 消費側プロジェクトは再宣言できない。
reserved_namespaces:
  std: 標準共通
