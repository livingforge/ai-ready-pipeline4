# ここを直せば両プラットフォームに反映される。
name: arp4-repair
description: arp4 のパース結果（parsed/ の Markdown）を直す ―― 機械が切った塊が資料では 1 つの表だったときに、原本と突き合わせて統合する。まず arp4 suspect で疑いを機械に出させ、そのうえで直す。「1 つの表が複数の表に分かれている」「ページごとに切れた表を統合したい」「左右に切れた表がある」「方眼紙の設計書が列 1 本ずつに砕けている」「パース結果を直したい・手を入れたい」「arp4 suspect が S001 / S002 / S003 を出した」で使う。整理結果（organized/）を書くのは arp4 スキルの担当で、こちらでは扱わない。凍結済みのラウンドでは使わない。
