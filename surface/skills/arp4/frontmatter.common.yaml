# ここを直せば両プラットフォームに反映される。
name: arp4
description: 既存資産（Excel・Word・PowerPoint・PDF・CSV の設計書とソースコード）を起点に、仕様をリレーショナルな正本データへ変換するパイプライン。機械が資料をパース結果（編集可・git 管理の Markdown）にし、エージェントがそれを読んで整理結果（型付きレコード）を書き、機械が凍結・検証してから正本（items / relations）を組み立て、設計書を生成する。意味の判断は整理層だけが行い、パースと構築は照合・採番・整合性しかやらない。「Excel の設計書を取り込んで」「Word・PowerPoint・PDF の資料を取り込んで」「既存資産から仕様を起こして」「仕様をデータとして管理して」「テーブル定義書・詳細設計書を生成して」「トレーサビリティを取って」で使う。
