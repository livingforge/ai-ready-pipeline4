  - 段落: 本書は受注登録機能（SCR001）の機能仕様を定める。適用は 2026-04 以降とする。

  - 見出し: 1 機能概要
  - 段落: 受注登録は、営業担当が得意先からの注文を受けて受注ヘッダと受注明細を登録する機能である。
  - 段落: 与信の枠内であれば即時に確定し、枠を超える場合は承認待ちとする。
    脚注: ただし 2026-04 以降、既存得意先の 100 万円未満は与信照会そのものを省略する。
  - 箇条書き: 入力チェックは画面で行う
    深さ: 0
  - 箇条書き: 桁あふれは登録時にも再確認する
    深さ: 1

  - 見出し: 2 画面項目
  - 見出し2: 2.1 入力項目
  - 表:
      - [区分, 項目名, 型, 必須, 備考]
      # `~` は縦結合の続き（画面では上の「ヘッダ」が 2 行に掛かって見えている）
      - [ヘッダ, 得意先コード, CHAR(5), 必須, 入力後に得意先名を自動表示]
      - [~, 得意先名, VARCHAR(60), '', 表示のみ]
      - [明細, 商品コード, CHAR(8), 必須, '']
      - [~, 数量, NUMBER(7), 必須, 1 以上]
  - 図形: "受注登録画面\n（現行のイメージ）"
  # **貼り付けたハードコピー。** 実物の機能仕様書には必ず 1 枚あり、
  # 表に無い項目（ボタンの並び・エラーメッセージ）がそこにしか無い ――
  # 機械には網点の乗った絵で、1 文字も取れない
  - 画像:
      絵柄: 画面
      名前: 現行画面のハードコピー
      代替: 現行の受注登録画面（2019 年版）。ボタンの配置は変更しない
  - 見出し2: 2.2 表示項目
  - 表:
      - [区分, 項目名, 型, 桁, 表示条件]
      - [ヘッダ, 得意先名, VARCHAR, '60', 得意先コード入力後に自動表示]
