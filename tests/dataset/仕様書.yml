置き場: 資料/P/受注管理システム操作手順（暫定）.docx
なぜ: |
  **見出しスタイルを 1 つも使っていない Word。** 現場の手順書・議事録・メモは
  字を大きくして太字にしただけで「見出し」を表すことが多く、そこには機械が
  読める構造が 1 つも無い。

  **割れないことを失敗にしない。** 見出しが無いなら 1 本のまま出すのが正しく、
  そのとき「割る構造が資料に無かった」という事実がそのまま形に出る ――
  無理に段落数や字数で割ると、**資料に無い切れ目**を機械が作ることになる
  （それは意味の判断そのものである）。

  ヘッダもフッタもコメントも無い、いちばん素朴な 1 冊である。
文書:
  - 段落: 受注管理システム 操作手順（暫定）
  - 段落: 1. 業務アプリにログインする
  - 段落: 2. メニューから「受注登録」を選ぶ
  - 段落: 3. 得意先コードを入力し、Enter を押す
