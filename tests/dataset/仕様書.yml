# Word で配られる資料 ―― 機能仕様書・運用手順書・議事録・検収仕様書。
#
# ここに書くのは**見出しと段落と表と指摘だけ**で、Word の作法（スタイル定義・
# コメントと脚注のパート・ヘッダとフッタの関係）は `document.py` が埋める。

置き場: 資料/P/受注登録機能仕様書（第1.2版）.docx
なぜ: |
  **Word は 1 冊が 1 本の流れである。** Excel のシート、PowerPoint のスライドに
  当たる「資料の側が決めた 1 枚」を持っていないので、そのまま出すと 200 ページの
  設計書が 1 本の md になる ―― 出典として指せる先が「その 1 本」しか無くなり、
  整理層はどの節の話かを言えず、`未読取` を宣言する先も 1 つしか持てない。

  だから**資料自身が持っている構造**（見出し 1）で割る。この 1 冊が突くのは 5 つ。

  **1. 見出しはスタイル id では当たらない。** 日本語版の Word は組み込みスタイルに
  `a3` のような id を自動生成し、`w:name` のほうに**英語の綴り**（`heading 1`）を
  書く ―― 画面に「見出し 1」と出るのは表示名で、XML には入っていない。id だけを
  見る実装はこの検体で 1 つも当たらず、**1 冊が丸ごと 1 本のまま出る。**

  **2. 変更履歴が確定していない資料が普通に回ってくる。** レビュー中の版が
  そのまま棚卸しに来るからで、そこには**まだ決まっていない仕様**が決まった仕様と
  同じ見た目で入っている。`w:delText` を黙って残せば「まだ生きている」に見え、
  黙って落とせば「もう消した」に見える ―― どちらも資料はまだ決めていない。
  本文は反映後の姿にし、消された文字は `d1` に出して機械は判断しない。

  **3. 文書番号・版・機密区分はフッタにしか無い。** 本文だけを読むと**その 1 冊が
  何の文書か**が落ちる。ただし Word のヘッダ・フッタは**文書全体に掛かる**ので、
  節ごとに写すと同じ 3 行が節の数だけ並ぶ ―― Excel の印刷設定（シートごとに
  掛かる）とは掛かり方が違うので、別の 1 本にまとめて出す。

  **4. コメントと脚注は本文の流れに出てこない。** 前者はレビュー指摘の置き場で
  本文より新しいことがあり、後者は但し書き（`ただし 2026-04 以降は…`）の置き場で、
  **例外条件がそこにしか無い**ことがある。

  **5. 縦結合は Excel とまったく同じ形で起きる。** `w:vMerge` の続きのセルは空で
  保存されるので、分類列の 2 行目以降だけが空欄になる ―― 画面では全行に掛かって
  見えているものである。
