文書:
  # **見出しの前の本文。** 改訂日・適用範囲はここに書かれる ―― 捨てると
  # アンカーが 0 個の節ができ、`freeze` の未整理一覧に上がらないまま消える
  - 段落: 本書は受注登録機能（SCR001）の機能仕様を定める。適用は 2026-04 以降とする。

  - 見出し: 1 機能概要
  - 段落: 受注登録は、営業担当が得意先からの注文を受けて受注ヘッダと受注明細を登録する機能である。
  - 段落: 与信の枠内であれば即時に確定し、枠を超える場合は承認待ちとする。
    脚注: ただし 2026-04 以降、既存得意先の 100 万円未満は与信照会そのものを省略する。
  - 箇条書き: 入力チェックは画面で行う
    深さ: 0
  - 箇条書き: 桁あふれは登録時にも再確認する
    深さ: 1

  - 見出し: 2 画面項目
  - 見出し2: 2.1 入力項目
  - 表:
      - [区分, 項目名, 型, 必須, 備考]
      # `~` は縦結合の続き（画面では上の「ヘッダ」が 2 行に掛かって見えている）
      - [ヘッダ, 得意先コード, CHAR(5), 必須, 入力後に得意先名を自動表示]
      - [~, 得意先名, VARCHAR(60), '', 表示のみ]
      - [明細, 商品コード, CHAR(8), 必須, '']
      - [~, 数量, NUMBER(7), 必須, 1 以上]
  - 図形: "受注登録画面\n（現行のイメージ）"

  - 見出し: 3 業務ルール
  - 段落: 与信枠を超える受注は、営業部長の承認を得るまで出荷指示を行わない。
    コメント:
      誰: 鈴木（PMO）
      いつ: '2026-07-30T10:00:00Z'
      本文: 2026-07 の運用変更で、承認者は営業部長から与信管理課長に変わりました。本文が古いです
  # **未確定の変更履歴。** 消された文言と挿入が同じ段落に入っている
  - 段落: 承認は受注登録画面から申請する。
    削除: 承認期限は 5 営業日以内とする。
    挿入: 承認期限は 3 営業日以内とする。
  - 段落: 詳細な承認フローは別紙を参照のこと。
    リンク: https://example.invalid/承認フロー.xlsx
