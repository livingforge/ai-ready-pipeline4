      - [明細, 商品名, VARCHAR, '80', 商品コード入力後に自動表示]
      - [~, 金額, NUMBER, '12', 数量入力後に自動計算]

  - 見出し: 3 業務ルール
  - 段落: 与信枠を超える受注は、営業部長の承認を得るまで出荷指示を行わない。
    コメント:
      誰: 鈴木（PMO）
      いつ: '2026-07-30T10:00:00Z'
