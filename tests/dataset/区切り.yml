置き場: 資料/N/得意先マスタ移行.csv
なぜ: |
  **移行データの一覧は CSV で配られる。** 抽出したツールがそのまま吐くので、
  1 案件で数百本になることが珍しくない ―― 1 本ずつ Excel で開いて `.xlsx` に
  し直す作業を引き受ける人はいないので、「Excel で開き直してください」と言って
  いたあいだ、**その数百本は 1 件も仕様にならなかった。**

  読むと決めた以上、危ないのは 2 つである ―― **区切りと文字コード**。どちらも
  資料ごとに違い、当てにいけば値が変わる。だから当てた結果をパース結果の頭に
  書く（`文字コードは cp932、区切りは カンマ として読みました`）。整理層は
  それを見て、値を信じるか原本を開くかを決められる。

  この 1 本は**引用符が効いているか**を突く。住所の `東京都千代田区1-2-3, 丸の内ビル`
  にはカンマが入っており、素朴に `,` で割ると 1 列ずれる ―― 備考の値には改行も
  入っている（`csv` 標準ライブラリはどちらも守る）。既存資産の日本語は cp932 で
  あることがいちばん多い。
文字コード: cp932
本文: |
  得意先コード,得意先名,住所,備考
  C0001,株式会社あかつき商事,"東京都千代田区1-2-3, 丸の内ビル",
  C0002,ｻﾝﾗｲｽﾞ物流,大阪府大阪市北区4-5,"2026-03 で取引停止
  与信枠は 0 に更新済み"
  C0003,みどり工業,愛知県名古屋市中村区6-7,

