置き場: 資料/N/区分値一覧.tsv
なぜ: |
  **`.tsv` は拡張子が区切りを名乗っている。** ここで当てにいくのは、資料が
  言っていることを機械が疑うのと同じで、疑う理由が 1 つも無い ―― しかも
  この 1 本は**値のほうにカンマが入っている**ので、当てにいくと `,` を選んで
  列が増える（区分値の説明文にカンマが入るのは普通のことである）。

  コード値の一覧はこの形で配られることが多い。区分値は正本の `enum` の元に
  なるので、**1 文字ずれると仕様が変わる。**
本文: |
  区分コード	区分名	説明
  01	受付	受注を受け付けた状態。まだ与信も、在庫引当も行っていない
  02	与信中	与信照会を投げた状態。結果待ち
  03	確定	与信 OK、在庫引当済み。ここから先は取消に承認が要る

