# PowerPoint で配られる資料 ―― 方式提案・移行方針・体制・フェーズ計画。
#
# ここに書くのは**箱と線と表と文字だけ**で、スライドの寸法・テーマ・マスター・
# レイアウト・EMU の座標は `deck.py` が埋める（`図.yml` と同じ約束）。埋めないと
# **arp4 は zip の関係だけを辿るのでパースは通り、PowerPoint で開いたときにだけ
# 「修復が必要」と言われる** ―― そのとき人は何が描いてあるはずだったかを
# 確かめられない。

置き場: 資料/O/新販売管理システム方式提案（第2.1版）.pptx
なぜ: |
  **`.pptx` は「2 側（docextract）にあります」と言われて終わっていた。**
  言い分は「実測（Excel 30 冊）では議事録も処理詳細も Excel の表だった」だが、
  **その 30 冊に PowerPoint が入っていなかっただけ**である ―― 方式提案・移行方針・
  体制と役割分担・フェーズ計画は PowerPoint で配られるのが普通で、そこに書いて
  あるのは他のどの資料にも無い決定（採用する方式・やらないこと・いつ何をするか）
  である。回した先（2 側）は文書の側なので、そこへ回しても誰も読まない。

  この 1 冊が突くのは 5 つ。

  **1. 図形と接続は Excel とまったく同じ道で取れる。** `p:sp` / `p:cxnSp` は
  `xdr:sp` / `xdr:cxnSp` と外側の名前空間しか違わない ―― 箱の中の文字も、
  接続の端点（`a:stCxn`）も、矢羽根も、線種も同じものである。だから
  `_shapes` を 2 本書かない（書けば片方だけ直した状態が必ず生まれる）。

  **2. 表は `a:tbl` に入っている。** PowerPoint の一覧はすべてこの形で、
  「埋め込みオブジェクト」として数えて中身を捨てると**スライドの表が 1 枚も
  仕様にならない**。縦結合（`vMerge`）は Excel と同じく下へ広げる ――
  分類列の「同上」を回復するのは忠実性の話であって、判断ではない。

  **3. 発表者ノートにしか無い決定がある。** スライドの箱は結論だけを載せる
  書き方をするので、**なぜそう決めたかがノートにしか書かれていない**ことが
  実際にある。ここでは「B 案を採らなかった理由」がそれで、スライドの上には
  1 文字も出ていない。`n1` を別のアンカーにしてあるのは、客先に見せた結論と
  書いた人の手控えを同じ出典にしないためである。

  **4. コメントはレビュー指摘の置き場である。** Excel のセルのコメントと同じで、
  **本文より新しいことがある** ―― ここでは体制のスライドに「常駐は 2 名に
  減った」が付いていて、箱のほうは 3 名のままである。

  **5. レイアウトとマスターの文字は取らない。** 取ると全スライドに同じ文字が
  並んで資料が増えたように見えるが、**文書番号・版・機密区分がそこにしか
  書かれていないことがある** ―― 取らないことは必ず言う。
プロパティ:
  作成者: 販売管理システム更改PT
  最終更新者: 佐藤（アーキテクト）
スライド:
  - 表題: 全体構成（A 案）
    図形:
      # **行区切りを持つ箱。** 実物の構成図は箱の中で改行する
      - 名前: 受注入力
        文字: "オーダー入力\n（Web／代行）"
        代替: 現用／待機の 2 系統。DR は別紙 5
      - 名前: 与信判定
        文字: 与信の枠内？
      - 名前: 在庫引当
        文字: 在庫引当
      - 名前: 出荷指示
        文字: 出荷指示
    接続:
      - {元: 受注入力, 先: 与信判定, 名前: 同期, 線種: 実線}
      # **線種で意味を描き分ける。** 凡例は「実線＝同期 / 破線＝夜間バッチ」
      - {元: 与信判定, 先: 在庫引当, 名前: 夜間バッチ, 線種: 破線}
      - {元: 在庫引当, 先: 出荷指示, 名前: 同期, 線種: 実線}
      # **どこにも繋がっていない線**（目分量で置いた線）。両端の id が無いので
      # どこからどこへの線かは決まらない ―― 本数だけ申告する
      - {元: 存在しない箱, 先: 出荷指示, 名前: 補足の矢印}
    ノート: |
      A 案にしたのは B 社の保守期限が 2027-03 で切れるためで、
      性能や機能で選んだわけではない。

      B 案（現行の延命）は 2028-03 まで持つが、その時点で
      同じ検討をもう一度やることになるので採らなかった。
  - 表題: 移行対象と件数
    表:
      - - [区分, 表名, 論理名, 件数]
        - [受注, T_ORDER, 受注ヘッダ, '120000']
        # **縦結合の続き**（`なし` と書く）。画面では上の「受注」が
        # 2 行に掛かって見えている
        - [~, T_ORDER_D, 受注明細, '480000']
        - [マスタ, M_CUSTOMER, 得意先, '3200']
  - 表題: 体制と役割分担
    図形:
      - 名前: 発注者
        文字: 発注者（情報システム部）
      - 名前: 元請
        文字: "元請\n常駐 3 名"
      - 名前: 協力会社
        文字: 協力会社（帳票）
    接続:
      - {元: 発注者, 先: 元請, 名前: 委託, 線種: 実線}
      - {元: 元請, 先: 協力会社, 名前: 再委託, 線種: 破線}
    コメント:
      - 誰: 鈴木（PMO）
        いつ: '2026-07-30T10:00:00Z'
        本文: 常駐は 2 名に減りました（2026-07 の体制変更）。図は 3 名のままです
  # **非表示のスライド。** 旧版を隠して配るのは実案件でごく普通で、
  # Excel の非表示シートとまったく同じ事情である ―― 読まないが、言う
  - 表題: 全体構成（B 案・旧版）
    非表示: true
    図形:
      - {名前: 現行維持, 文字: 現行を延命}
  # **白紙のスライド。** 章の切れ目に置く 1 枚で、資料ではない ――
  # 出すと「作業用の白紙がぜんぶパース結果になる」（Excel と同じ規律）
  - 表題: ''
