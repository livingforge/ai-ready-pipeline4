置き場: 資料/Q/受注管理システム受入確認書（押印済）.pdf
なぜ: |
  **紙をスキャンしただけの PDF。** 押印の要る書類（受入確認書・検収書）は
  必ずこの形で回ってくる ―― 機械にとっては 1 枚の絵で、テキスト層が 1 文字も
  無い。

  **「テキスト層が無い」は「字が無い」ではない。** 黙って空のページを出すと、
  整理層は「資料に何も書いていない」と読む ―― それは「資料に無い」と「機械が
  読めていない」の取り違えそのもので、arp4 がいちばん避けたい壊れ方である。

  だから絵にして `images/` へ出し（`i1`）、中の字は Windows OCR が読む（`o1`）。
  貼り付け画像とまったく同じ扱いで、**機械の読みは資料の字と混ぜない。**
ページ:
  - 行:
      - 受入確認書
      - 本書は表紙であり、次ページ以降がスキャンされたものである。
  - スキャン: true
  - スキャン: true
