      - '重大度 A の No.12 については、全項目の再検収を 2028-05-17 に実施した。'
  # **押印して綴じ込んだページ。** ここだけテキスト層が無い ―― 前の章までは
  # 読めているので、黙って空のページを出すと「章が終わった」と読まれる
  - スキャン: true
  # **しおりの無い章。** 巻末の課題一覧は目次に載っていないことがある ――
  # 落とさないが、割らない（直前の章に入る）
  - 行:
      - 7 未解決の課題
      - '課題 ID  内容                        期限        起票者'
      - 'ISS001   営業事務に与信照会を見せるか      2028-05-31  情報システム部'
      - 'ISS003   月次バッチの現行実測が無い       2028-05-20  元請'
      - 上記は検収の合否には影響しないが、稼働判定会議までに決着させる。

