# PDF で配られる資料 ―― 検収仕様書・議事録・他社製品の仕様書・官公庁の様式。
#
# ここに書くのは**ページごとの行としおりだけ**で、PDF の作法（オブジェクト・
# 相互参照表・フォント辞書・アウトライン）は `paper.py` が埋める。

置き場: 資料/Q/受注管理システム検収仕様書（第1.0版）.pdf
なぜ: |
  **PDF は「もらったまま読むしかない資料」の代表である。** 検収仕様書・議事録・
  他社製品の仕様書は PDF でしか配られないことが普通で、原本の Excel や Word は
  こちらに来ない ―― 「2 側（docextract）にあります」と言っていたあいだ、
  その 1 冊は誰にも読まれずに終わっていた。

  この 1 冊が突くのは 3 つ。

  **1. しおりは資料が持っている構造である。** 章ごとに割れば出典が章を指せる
  ―― 1 冊 1 本のまま出すと、200 ページの検収仕様書が 1 つのアンカーになり、
  整理層はどの章の話かを言えない。**深い階層では割らない**（章より細かく割ると
  1 本が数段落になり、資料の姿が見えなくなる）。

  **2. 最初のしおりより前のページを捨てない。** 表紙・改訂履歴はそこにあり、
  捨てるとアンカーの無いページができる ―― Markdown の「（前書き）」と同じ理屈。

  **3. 表は組み直さない。** このページの「確認項目」は、原本では罫線の引かれた
  表である。PDF が持っているのは**位置を持った文字だけ**で、「ここからここまでが
  1 列」はどこにも書かれていない ―― 文字の隙間から当てにいくと、閾値の外れた
  ところで**列がずれた表が「読めた」顔で出る**（CSV の区切りを機械に当てさせないと
  決めたのと同じ理由）。行のまま出し、組み直していないことを言う。

  **4. しおりは 2 階層ある。** `2.1` `2.2` `2.3` `5.1` を第 2 階層に持っており、
  節は 6 本しか出ない ―― `_toc` が第 1 階層だけを割り先にするからである。
  平らなしおりしか書けなかったあいだ、**この規律は 1 度も試されていなかった。**
  割らないだけで落としはしないので、本文はどれかの章に必ず入る。

  **5. 欧文の送り幅を書く。** `/W` が無いと ASCII が全角送りになり、空白で桁を
  揃えた行（この「確認項目」がそうである）が倍に伸びて**紙の右から出る。**
  パースは位置を持った文字を取るだけなので通り、**開いた人にだけ列が消えて
  見える** ―― 実測で「判定」列が `MediaBox` の外に落ちていた。

  **6. 押印したページが綴じ込まれている。** 検収仕様書の巻末には、印刷して
  押した実施記録がそのまま差し込まれる ―― **1 冊の中でテキスト層のある章と
  無い章が混ざる。**スキャンだけの 1 冊（受入確認書）とは事情が違い、ここは
  **前の章までは読めているのに、この 1 枚だけが読めない**という形になる。
  黙って空のページを出すと、整理層は「章が終わった」と読む。

  **7. しおりの無い章が後ろにもある。** 巻末の「未解決の課題」は目次に
  載っていないことがあり、直前の章に吸い込まれる ―― 落とさないが、割らない。
ページ:
  # 表紙と改訂履歴 ―― しおりより前にある（捨てるとアンカー 0 のページになる）
  - 行:
      - 受注管理システム 検収仕様書
      - 第 1.0 版　2026-07-15
      - 株式会社あかつき商事　情報システム部
  - 行:
      - 改訂履歴
      - 第 0.9 版　2026-06-30　初版（レビュー用）
      - 第 1.0 版　2026-07-15　与信の確認項目を追加
  - しおり: 1 適用範囲
    行:
      - 1 適用範囲
      - 本書は受注登録機能（SCR001）および与信照会機能（SCR002）を対象とする。
      - バッチ処理は本書の対象外とし、別途「バッチ検収仕様書」による。
  - しおり: 2 確認項目
    行:
      # **原本では罫線の引かれた表**である。PDF には列の切れ目が無い
      - 2 確認項目
      - 'No   確認内容                          期待結果          判定'
      - '1    得意先コードに 5 桁を入力          得意先名が表示される   ―'
      - '2    与信枠を超える金額を入力          承認待ちとなる      ―'
      - '3    数量に 0 を入力                  エラーとなる       ―'
  # **子しおり。** 実物の検収仕様書は章の下に節のしおりを持っている ――
  # ここを割り先にすると 1 本が数段落になり、出典が細かすぎて資料の姿が
  # 見えなくなる（`pdf.py` の `_toc` は第 1 階層だけを割り先にする）。
  # 割らないだけで落としはしないので、**本文はどの章かに必ず入る。**
  - しおり: 2.1 画面の確認
    深さ: 1
    行:
      - '2.1 画面の確認'
      - '4    必須項目を空欄で登録            エラーとなる       ―'
      - '5    得意先コードに 6 桁を入力        入力できない       ―'
      - '6    数量に全角文字を入力            エラーとなる       ―'
      - '7    金額が自動計算される            数量 × 単価が表示される  ―'
  - しおり: 2.2 帳票の確認
    深さ: 1
    行:
      - '2.2 帳票の確認'
      - '8    受注請書が 2 部出力される        営業所プリンタに 2 部  ―'
      - '9    受注一覧表の合計が一致する       明細の合計と一致する   ―'
      - '10   与信超過一覧に該当が出る        超過分のみ出力される   ―'
  - しおり: 2.3 外部接続の確認
    深さ: 1
    行:
      - '2.3 外部接続の確認'
      - '11   EDI から受注を受信する          受注が登録される    ―'
      - '12   物流センターへ送信する          CSV が送信される    ―'
      - '13   会計連携ファイルを出力する       仕訳が出力される    ―'
  - しおり: 3 検収の合否
    行:
      - 3 検収の合否
      - 確認項目のすべてが期待結果と一致した場合に合格とする。
      - 不一致が 1 件でもある場合は、是正のうえ再検収とする。
  - しおり: 4 検収の体制と期間
    行:
      - 4 検収の体制と期間
      - 検収は情報システム部 3 名および業務部門 2 名で実施する。
      - 期間は 2028-05-01 から 2028-05-31 までの 1 か月とする。
      - 期間内に完了しない場合は、両者協議のうえ延長する。
  - しおり: 5 是正と再検収
    深さ: 0
    行:
      - 5 是正と再検収
      - 不一致は重大度を A（業務が回らない）、B（回避策あり）、C（軽微）に分ける。
      - A は是正後に全項目を再検収し、B・C は当該項目のみ再検収する。
  - しおり: 5.1 重大度の判定
    深さ: 1
    行:
      - '5.1 重大度の判定'
      - 重大度は受注管理システム更改 PT が判定し、判定結果は議事録に残す。
  # **試験実施記録。** 原本では罫線の表で、判定列に OK / NG が入っている
  - しおり: 6 試験実施記録
    深さ: 0
    行:
      - 6 試験実施記録
      - '実施日      実施者        対象      件数   合格   不合格'
      - '2028-05-08  情報システム部  画面      7      6      1'
      - '2028-05-09  業務部門      帳票      3      3      0'
      - '2028-05-10  情報システム部  外部接続   3      2      1'
  - しおり: 6.1 不合格の記録
    深さ: 1
    行:
      - '6.1 不合格の記録'
      - 'No   不合格の内容              重大度  是正の期限'
      - '7    金額の自動計算が四捨五入になっている  B      2028-05-15'
      - '12   物流センターへの CSV が文字化けする   A      2028-05-13'
  - しおり: 6.2 再検収の記録
    深さ: 1
    行:
      - '6.2 再検収の記録'
