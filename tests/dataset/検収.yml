置き場: 資料/Q/受注管理システム移行判定会議_議事録.pdf
なぜ: |
  **しおりの無い PDF。** 会議の議事録・メモを印刷したものにアウトラインは無く、
  それが普通である ―― **割れないことを失敗にしない。** 1 冊を 1 本のまま出し、
  「割る構造が資料に無かった」という事実をそのまま形に出す。

  段落数やページ数で割ると、**資料に無い切れ目**を機械が作ることになる
  （Word で見出しが 1 つも無いときと同じ判断である）。
ページ:
