# 読めなかったものの申告 ―― 空欄に見えるものが「資料に無い」のか「機械が
# 読めていない」のかで、次のラウンドで拾い直すかどうかが正反対になる。
#
# ここの検体は**申告が要る側**だけを集めてある。取らないと決めたもの
# （入力規則・条件付き書式）は申告もしないので、ここには置かない。

置き場: 資料/H/移行対象一覧.xlsx
なぜ: |
  **エラー値は表の上では値のように見える。** `#REF!` `#DIV/0!` は画面にも
  そう出ているので表からは落とせないが、その欄の仕様は資料から読み取れて
  いない ―― 開き直しても直らない側（数式の未計算とは正反対）である。

  種類を 7 通り並べてあるのは、**次にやることが種類で変わらない**ことを
  申告に書ききるためである。数を 21 個にしてあるのは、番地の一覧が上限
  （20 個）で切れたときに**切ったと言う**かを見るためで、黙って切ると
  「読めなかったのはこの 20 個だけ」と読める。
シート:
  - 名前: 突合結果
    表:
      A1:
        - [No, 対象, 件数, 差分, 備考]
        - [1, 顧客マスタ, 12000, '#REF!', 参照先のシートが消えている]
        - [2, 受注履歴, '#N/A', '#REF!', 引き当てが見つからない]
        - [3, 単価表, '#DIV/0!', '#REF!', 分母が 0]
        - [4, 在庫, '#VALUE!', '#REF!', 型が合っていない]
        - [5, 出荷, '#NAME?', '#REF!', 関数名が古い]
        - [6, 請求, '#NUM!', '#REF!', 計算できない数]
        - [7, 入金, '#NULL!', '#REF!', 範囲の指定が壊れている]
        - [8, 返品, 30, '#REF!', ~]
        - [9, 値引, 12, '#REF!', ~]
        - [10, 与信, 8, '#REF!', ~]
        - [11, 締め, 4, '#REF!', ~]
        - [12, 値札, 2, '#REF!', ~]
        - [13, 棚卸, 6, '#REF!', ~]
        - [14, 仕入, 9, '#REF!', ~]
        - [15, 支払, 3, '#REF!', ~]

  - 名前: 隠した旧版
    状態: veryHidden
    表:
      A1: [[No, 課題], [1, 旧レイアウトの調査]]

  - 名前: 作業用
    状態: hidden
    セル:
      A1: 件数の下書き

---

置き場: 資料/H/画面仕様書.xlsx
なぜ: |
  **申告が 7 本並ぶシート。** 実物の画面仕様書は 1 枚に全部入っている ――
  表があり、図形で画面イメージが描かれ、レビュー指摘がコメントで付き、
  関連資料へのリンクが張られ、やめた項目に取り消し線が引かれ、集計欄の
  数式は計算されておらず、旧仕様の行が隠してある。

  1 つずつなら通っていた申告が、**重なったときに順番と番号が崩れないか**を
  見る検体である（アンカーが 1 つでもぶつかると、整理結果の出典が黙って
  別の塊を指す）。
シート:
  - 名前: 受注入力
    表:
      B2:
        - [項目ID, 項目名, 必須, 桁, 初期値, 備考]
        - [SCR001-01, 受注番号, ×, 10, ~, 採番後に表示]
        - [SCR001-02, 得意先, ○, 8, ~, 名称は自動表示]
        - [SCR001-03, 受注日, ○, ~, 当日, ~]
        - [SCR001-04, 希望納期, ×, ~, ~, 廃止（受注日から自動計算へ）]
        - [SCR001-05, 明細行数, ×, 3, ~, '=COUNTA(B3:B7)']
        - [SCR001-06, 合計金額, ×, 11, ~, '=SUM(D3:D7)']
        - [SCR001-07, 与信残高, ×, 11, ~, '#REF!']
    セル:
      B11: 旧仕様（2025 年度版）
      B12: 明細は 10 行まで
    非表示行: [11, 12]
    取り消し線: [B6:G6]
    太字: [C4]              # **強調は値を偽らない** ―― 取り消し線とは扱いが違う
    コメント:
      C6: {記入者: 設計者, 本文: 希望納期は受注日から自動計算へ変更（2026-07 決定）}
      G9: {記入者: レビュア, 本文: 与信残高の参照先が消えている。要確認}
    リンク:
      B2: {先: '../外部/画面標準.xlsx', 位置: '入力欄!A1'}
      G3: {先: 'https://example.invalid/採番ルール'}
    描画:
      - 箱: [[登録ボタン, （F9）]]
        id: 2
        名前: 注記
        位置: I3:K5
      - 画像: {代替: 受注入力画面のイメージ（2026-07 撮影）}
        id: 3
        名前: Picture 1
        位置: I7:P20

---

置き場: 資料/H/バッチ仕様書.xlsx
なぜ: |
  **計算結果の保存されていない数式が 25 個ある。** ツールが書き出したブック・
  LibreOffice 保存・手動計算のまま保存したブックはこうなり、**合計欄・率の列
  がまるごと空**になる ―― 整理層はそれを「資料に記載なし」と読む。

  番地の一覧は 20 個で切るので、25 個ある側で**切ったと言う**かを見る。
シート:
  - 名前: 処理時間
    表:
      A1:
        - [処理, 件数, 想定時間, 実測]
        - [受注取込, 12000, '=B2*0.01', '=C2*1.2']
        - [与信判定, 12000, '=B3*0.02', '=C3*1.2']
        - [在庫引当, 12000, '=B4*0.03', '=C4*1.2']
        - [出荷指示, 8000, '=B5*0.01', '=C5*1.2']
        - [請求作成, 8000, '=B6*0.05', '=C6*1.2']
        - [入金消込, 6000, '=B7*0.04', '=C7*1.2']
        - [締め処理, 1, '=B8*100', '=C8*1.2']
        - [日次集計, 1, '=B9*60', '=C9*1.2']
        - [週次集計, 1, '=B10*180', '=C10*1.2']
        - [月次集計, 1, '=B11*600', '=C11*1.2']
        - [合計, '=SUM(B2:B12)', '=SUM(C2:C12)', '=SUM(D2:D12)']

  - 名前: 派生値のみ
    なぜ: |
      **非空セルが 0 になるシート。** 黙って落とすと、シートが存在したこと
      すら整理層に伝わらない（`未読取` を宣言する先も無い）。
    セル:
      A1: '=処理時間!B13'
      A2: '=処理時間!C13'

---

置き場: 資料/I/議事録.xlsx
なぜ: |
  **スレッドは親子が 1 段とは限らない。** Excel の画面では返信が縦に並ぶ
  だけだが、パートの中では `parentId` の連なりで持っている ―― 親だけを
  起点に 1 段しか辿っていなかったぶん、**返信への返信が静かに消えていた**。

  もっと静かに消えるのが**親を失った返信**である（親のコメントだけ削除
  された資料・抜粋して配られた資料でこうなる）。起点が無いので 1 件も
  出ず、そのセルにコメントが付いていたことすら伝わらない。
シート:
  - 名前: 指摘
    表:
      A2:
        - [No, 対象, 項目, 状態]
        - [1, 受注テーブル, 受注番号, 確認中]
        - [2, 受注テーブル, 受注金額, 確定]
        - [3, 受注明細, 数量, ~]
        - [4, 顧客マスタ, 与信枠, 確認中]
パーツ:
  xl/threadedComments/threadedComment1.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <ThreadedComments
        xmlns="http://schemas.microsoft.com/office/spreadsheetml/2018/threadedcomments">
      <threadedComment ref="C3" dT="2026-07-01T10:12:00.00" personId="{P1}" id="{T1}">
        <text>採番は 2026 年度から 10 桁へ</text>
      </threadedComment>
      <threadedComment ref="C3" dT="2026-07-02T09:03:00.00" personId="{P2}" id="{T2}"
                       parentId="{T1}">
        <text>移行対象の洗い出しは 8/20 まで</text>
      </threadedComment>
      <threadedComment ref="C3" dT="2026-07-03T13:20:00.00" personId="{P1}" id="{T3}"
                       parentId="{T2}">
        <text>洗い出しの結果は別紙 3 のとおり</text>
      </threadedComment>
      <threadedComment ref="C3" dT="2026-07-04T08:00:00.00" personId="{P2}" id="{T4}">
        <text>桁を変えると外部 IF も直る必要がある</text>
      </threadedComment>
      <threadedComment ref="C4" dT="2026-06-20T14:40:00.00" personId="{P2}" id="{T5}"
                       done="1">
        <text>桁あふれの検討結果は別紙 1 のとおり</text>
      </threadedComment>
      <threadedComment ref="C6" personId="{P3}" id="{T7}" parentId="{T6}">
        <text>親を消された返信（起点のコメントがパートに無い）</text>
      </threadedComment>
    </ThreadedComments>
  xl/persons/person1.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <personList
        xmlns="http://schemas.microsoft.com/office/spreadsheetml/2018/threadedcomments">
      <person displayName="設計者" id="{P1}" userId="sekkei" providerId="AD"/>
      <person displayName="レビュア" id="{P2}" userId="review" providerId="AD"/>
    </personList>
関係:
  xl/worksheets/_rels/sheet1.xml.rels:
    - [rIdTc1, threadedComment, ../threadedComments/threadedComment1.xml]
  xl/_rels/workbook.xml.rels:
    - [rIdPerson1, person, persons/person1.xml]
