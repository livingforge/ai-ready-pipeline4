置き場: 受領/受注システム/src/order/受注サービス.py
なぜ: |
  **既存資産の日本語は cp932 である。** 棚卸しの対象になるのは 10 年ものの
  コードで、UTF-8 で書かれているほうが珍しい ―― そして `# -*- coding: -*-`
  は付いていないことが多い（当時の現場では既定がそれだった）。

  UTF-8 で決め打って読んでいたぶん、**コメントに日本語が 1 文字あるだけで
  そのファイルは骨格ごと落ちていた**（`P010`）。クラスもメソッドも取れない。
  シグネチャは ASCII なので、**読めていれば出せたもの**である。
文字コード: cp932
本文: |
  """受注の登録・取消。"""


  class OrderService:
      """受注サービス ―― 受注番号の採番はここでしかやらない。"""

      def register(self, order: "Order") -> str:
          """受注を登録する（与信 NG は差戻し）。"""
          raise DuplicateOrder

      def cancel(self, no: str, reason: str) -> None:
          """出荷済みは取り消せない。"""
          raise AlreadyShipped

