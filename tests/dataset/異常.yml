置き場: 資料/M/移行データ仕様書.xlsx
なぜ: |
  **壊れているのがシート 1 枚でも、1 冊まるごと落ちていた。** 部分復旧したブック・
  帳票ツールが途中で書き出しをやめたブックがこの形になり、`load_workbook` は
  1 枚の XML で例外を投げる ―― **残り 3 枚は読めるのに `P010` で 1 冊が消える。**
  「1 冊が壊れていて 29 冊が落ちる」を避けているのと同じことが、**ブックの中では
  守られていなかった。**

  救出モード（`read_only`）は 1 枚ずつ遅延で読むので、壊れた 1 枚だけが落ちる。
  代償は結合・行列の寸法・コメント・リンク・印刷設定が取れないことで、**とくに
  縦結合が展開されない** ―― 区分の列が 2 行目以降だけ空欄になり、画面では全行に
  掛かって見えているものが「区分の無い行」に見える。**黙れるものではない**ので、
  ブック単位（`P012`）とシートごと（パース結果の先頭）の両方で言う。
シート:
  - 名前: 移行対象
    表:
      A1:
        - [区分, 表名, 論理名, 件数]
        - [受注, T_ORDER, 受注ヘッダ, '120000']
        - [~, T_ORDER_D, 受注明細, '480000']
        - [マスタ, M_CUSTOMER, 得意先, '3200']
    結合: [A2:A3]
    コメント:
      D2: 件数は 2026-07 末の実績

  - 名前: 変換規則
    壊す: true
    表:
      A1:
        - [項目, 変換, 備考]
        - [受注区分, 1→通常 / 2→返品, ~]

  - 名前: 移行スケジュール
    セル:
      A1: 移行スケジュール
      A3: 第 1 回
      B3: 2026-09-05

