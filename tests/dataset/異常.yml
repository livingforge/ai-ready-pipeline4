置き場: 受領/受注システム
なぜ: |
  **客先からもらったフォルダを、そのまま `sources/` に置いた 1 式。**
  既存資産の棚卸しでは資料とソースが同じ木に入って届くので、これが普通の
  渡され方である ―― そして `.git` だけで数万ファイルある。

  1 つずつ「読めない形式です」（`P001`）と言うと、**本当に読めなかった 1 冊が
  その山に埋もれる**。申告が読み飛ばされるのは、申告しないのと同じである。
  機械が置いたものは名前で切ってよい（隠しフォルダを資料として置く書き方は
  無い）―― `~$` を資料として数えないのと同じ理屈である。

  **切るのは資料でないものだけで、読めないものを黙るのではない。** 同じ木に
  入ってくる `.csv`（移行データの一覧・コード値の一覧）と `.zip`（展開し忘れた
  受け渡し）は資料そのものである ―― どちらも「いまは .xlsx だけ。Word・PDF は
  2 側にあります」と言われて終わっていた。**2 側は文書の側なので、そこへ回しても
  誰も読まない**し、zip のほうは**中の 30 冊がまるごと 1 行の申告になる。**

  `.txt` は長らくこの山の 3 つ目だった ―― **申告するだけで読んでいなかった。**
  見出しも表も無い覚書は、`.csv` と違って区切りも文字コードも当てにいく必要が
  無く、**原本がそのまま読める形**である。読めるものを「読めない」と言うのは、
  読めないものを黙るのと同じだけ質が悪い。いまは塊 1 個として出る。
そのまま:
  .git/HEAD: "ref: refs/heads/main\n"
  .git/objects/pack/pack-8f3c9a.idx: （git が置いたバイナリ）
  .git/config: "[core]\n\trepositoryformatversion = 0\n"
  node_modules/left-pad/package.json: '{"name": "left-pad"}'
  src/order/__pycache__/service.cpython-311.pyc: （Python が置いたバイナリ）
  docs/~$受注一覧.xlsx: （Excel が開いている間だけ置く一時ファイル）
  docs/受注一覧.txt: 受注一覧の項目は 2026-04 の改訂で 3 つ増えた（要確認）
  docs/移行データ.csv: '受注番号,受注日\nORD-000001,2026-08-02\n'
  docs/一式.zip: （展開し忘れた受け渡し。中の 30 冊はまだ 1 冊も読んでいない）

