置き場: 資料/M/項目定義書.xlsx
なぜ: |
  **1 つのセルの中で書式が変わる**（リッチテキスト）。項目名を残したまま
  `（廃止）` だけを消す・注記の後半だけを消すのは、実物の設計書でごく普通の
  書き方である ―― セルの書式は 1 つしか持てないので、こう書くしかない。

  `cell.font.strike` は**セル 1 つに 1 つ**の書式なので、この形は 1 件も
  引っ掛からない。取り消し線を書式から取ると決めた理由は「その書式だけが
  値を偽る」ことだったのに、**いちばん値を偽る書き方でだけ成り立って
  いなかった** ―― 画面では消えている文字が、生きた文字として表に出ていた。

  **全部消してあるものと分ける。** 一部なら**残りは生きている**ので、値を
  そのまま並べると「この行はまるごと廃止」に読める。消してある文字を
  値の隣に書けば、廃止かどうかは整理層が決められる（機械は決めない）。
シート:
  - 名前: 項目
    表:
      A1:
        - [項目ID, 項目名, 型, 備考]
        - [IT-001, 受注番号, 文字列(10), 採番後に表示]
        - [IT-002, 希望納期（廃止）, 日付, 受注日から自動計算へ]
        - [IT-003, 与信区分, 文字列(1), 2026-04 から運用]
    一部取り消し線:
      B3: （廃止）
    取り消し線: [D3]          # まるごと消した欄（**こちらは書式で取れている**）

