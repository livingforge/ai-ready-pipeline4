置き場: 受領/受注システム/src/order/帳票出力.py
なぜ: |
  **棚卸しの対象には Python 2 のコードが混ざっている。** 10 年ものの資産を
  受け取るのだから当然で、`print "…"` は 3 では構文エラーになる ―― `ast` は
  そこで投げ、骨格（クラス・メソッドの一覧）は 1 行も取れない。

  ここで出ていた申告は
  `読み込みに失敗しました: Missing parentheses in call to 'print'`
  **＋「zip として開けません ―― 添付が途中で切れたか、別形式に拡張子だけを
  付け替えた資料です」**だった。開けなかった理由の続き（`_unopenable`）を
  形式に関わらず足していたためで、**メールの添付を探しに行かせて、そこに
  資料は無い**。`veryHidden` に「再表示してください」と言ったのと同じ形である。

  しかもこのファイルは**壊れていない** ―― 原本はテキストなので整理層が直接
  読める（意図の層はもともとそう読ませている）。取り直す話にしてはいけない。
文字コード: cp932
本文: |
  # 受注一覧の帳票出力（旧システムから移設）
  import csv


  class ReportWriter:
      def write(self, orders, out):
          print "出力開始"
          for order in orders:
              out.write(order.no)

