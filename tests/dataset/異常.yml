置き場: 資料/M/納期管理表.xlsx
なぜ: |
  **日付として範囲外のシリアル。** 納期の引き算を日付書式のまま持っているセル、
  年数を直に入れた欄（`2026` を日付書式の列に入れる）がこうなる ―― Excel の
  画面では `#####` か数そのものが出ている。

  openpyxl はこのセルを `#VALUE!` にして**警告する**。その警告は stderr へ
  1 行流れて消えるので、arp4 はそれを「エラー値（計算できていない）」として
  申告していた ―― **資料は壊れていないのに壊れていると言う**（読み落としより
  悪い形である。申告のほうが嘘になる）。いまは openpyxl が言ったことを
  `P013` で申告し、突き合わせられるようにする。
シート:
  - 名前: 納期
    表:
      A1:
        - [受注番号, 受注日, 納期, 残日数]
        - [ORD-000001, 2026-08-02, 2026-08-20, '18']
    セル:
      A3: ORD-000002
      B3: 2026-08-02
      C3: 2958466          # 納期の欄に年数・引き算の結果を入れてしまった行
    書式:
      C3: yyyy/mm/dd

