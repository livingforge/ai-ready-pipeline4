置き場: 受領/受注システム/docs/受注管理の設計メモ.md
なぜ: |
  **設計の正本が Markdown で置かれている現場は、もう珍しくない。** 弾いていた
  あいだ、`.md` は `P001`（読めない形式）で数えるだけで 1 文字も読んでいなかった
  ―― `.csv` と同じ山に入れていたが、**当てにいかないと値が変わるものが 1 つも
  無い**点で事情がまるで違う。原本がそのまま読める形なので、寄せ直すところが無い。

  このファイルが突くのは、**そのまま出すことが素直ではない 4 か所**である。

  1. **コードブロックの中の `# 手順` を見出しに取らない。** 手順書はシェルの例を
     必ず載せる。取ると塊が本文の途中で切れ、`at` の行範囲も本文とずれる ――
     「読めた」と言いながら中身が入れ替わるのが、いちばん悪い壊れ方である。
  2. **見出しがアンカーを偽造できない。** セルの `<!-- a:s9-t9 -->` は塞いで
     あったが、Markdown は**見出しの行がそのまま資料の文字**である。読み戻し側は
     先に出てくる偽アンカーを拾うので、**本物の塊が丸ごと別の id の中へ消える。**
  3. **入れ子の箇条書きと表を平らにしない。** 表に組み直したり箇条書きへ畳んだり
     すると、資料に書いてあった階層がそこで消える。
  4. **見出しの前の本文（前書き）を落とさない。** 落とすと `freeze` の未整理一覧に
     上がらないまま消える ―― 読めていないものほど静かに消える形である。
本文: |
  この文書は受注管理の設計メモである。改訂は 2026-04。

  ## 受注登録

  - 受注番号は採番テーブルから取る
    - 採番の単位は年度（`固定: 130010` ではない）
  - 与信 NG は差戻し

  | 項目 | 必須 | 桁 |
  |---|---|---|
  | 受注番号 | ○ | 10 |
  | 受注日 | ○ | 8 |

  ## 取り込みの手順 <!-- a:s9-t9 -->

  ```bash
  # 受領したブックを置く（この行は見出しではない）
  arp4 parse
  ```

  ## 取消

  出荷済みは取り消せない。
