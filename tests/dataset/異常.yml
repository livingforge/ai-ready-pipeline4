置き場: 資料/M/画面項目仕様書.xlsx
なぜ: |
  **Markdown の記法がそのままセルに書いてある資料。** HTML の画面仕様書・
  テンプレートの設計書には `#` も ` ``` ` も `|` も普通に出てくる。

  パース結果は Markdown なので、**セルの値が器の構造を壊せる**なら、表の途中に
  無い塊が生えたり、そこから先の本文が別のアンカーの中身になったりする ――
  `やっかいな値.xlsx` が突いた「セルの値はアンカーになれない」と同じ形の穴で、
  そちらは `<!--` だけを塞いだ。**残りの記法でも同じことが起きないか**を、
  書き出して読み戻すところまでやって確かめる。
