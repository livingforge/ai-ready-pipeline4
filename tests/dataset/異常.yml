# 異常系 ―― **資料が悪いのではなく、資料置き場と規模が現実である**形。
#
# ここまでの検体は「1 つの欠陥を 1 つのシートで突く」ものだった。こちらは
# **中身を読む前に壊れる**ものを集めてある ―― 開けない・大きすぎる・そもそも
# 資料ではない。どれも 30 冊を通せば必ず 1 つは混ざる。

置き場: 資料/M/受注明細抽出.xlsx
なぜ: |
  **抽出ツールが吐いた一覧は 1 枚で数千行ある。** 設計書に添える「現行データの
  実績」がこの形で、見出し行と最初の 20 行を見たかぎりでは小さい表と見分けが
  付かない ―― 読み手（整理層）は**先頭だけ読んで「読んだ」と思う**。
  値を落としているわけではないので「読めなかったもの」の申告ではないが、
  黙ると**事実と違うものを読む**ところは工程表（すかすかな塊）と同じである。

  2 枚目は逆側で、**枠だけが大きい**。工程表を年単位に伸ばすと、斜めに並んだ
  `■` が空白 1 マスずつで繋がって 1 つの塊になり、枠は 600 行 × 600 列に
  なる ―― 中身は 600 セルしかない。格子を組んでから「すかすかだ」と捨てて
  いた頃は、**いちばん捨てる塊にいちばん払っていた**（対角線 5,000 セルで
  12.3 秒・211MB）。
シート:
  - 名前: 抽出結果
    表:
      A1:
        - [受注番号, 明細番号, 商品コード, 商品名, 数量, 単価, 金額, 出荷日]
    生成:
      - 起点: A2
        行数: 1200
        雛形: ['ORD-{n:06}', '{n}', 'ITM{n:04}', '商品{n}', '{n}', '1200', '{n}',
               '2026-08-02']

  - 名前: 年間工程
    セル:
      A1: 年間工程（2026 年度）
    生成:
      - 起点: A2
        行数: 600
        列送り: 1
        雛形: ['■']

