置き場: 資料/F/コード値一覧.xlsx
なぜ: |
  **数に見えて数ではない値**を並べたもの。コード値表は既存資産の棚卸しで必ず
  出てくるが、前ゼロ・桁区切り・区切り記号は「Excel が数として読んだかどうか」
  で表記が変わる ―― 資料の側は 1 つも変わっていないのに、パース結果の側だけが
  変わる。読み手はそれを仕様の違いとして読む。
シート:
  - 名前: 支店コード
    表:
      A1:
        - [コード, 名称, 備考]
        - ['007', 本店, 前ゼロは文字列で持つ]
        - ['0001', 札幌, 4 桁の前ゼロ]
        - [7, 数として入った 7, 見た目は 007 でも中身は数]
        - ['03-1234-5678', 電話番号, ハイフンで文字列になる]
        - ['2026/8/2', 日付に見える文字列, スラッシュでも文字列のまま]
        - ['1,200', 桁区切りの入った文字列, 数ではない]
        - ['１２３', 全角数字, 機種依存ではないが数でもない]
        - ['   ', 空白だけのセル, 画面では空欄と見分けが付かない]
        - ["受注\t番号", タブの入った値, 表の区切りと紛らわしい]

  - 名前: 桁あふれ
    なぜ: |
      **15 桁を超える数は Excel の中でも壊れている。** 会員番号・伝票番号を数値
      として持つと下位の桁が 0 になるが、資料の側は「壊れた数」をそのまま見せて
      いる ―― 機械が丸めて直してはいけない側の数である。
    表:
      A1:
        - [項目, 値]
        - [会員番号（数値）, 1234567890123456789]
        - [会員番号（文字列）, '1234567890123456789']
        - [伝票番号, 9007199254740993]

