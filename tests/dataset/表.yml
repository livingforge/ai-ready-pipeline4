置き場: 資料/F/一覧のならび.xlsx
なぜ: |
  **1 枚に表が 12 個ある一覧シート。** 実物の「◯◯一覧」はこの形で、2 行 2 列の
  小さな表が升目に並ぶ。塊の切り出しとアンカーの採番が、数が増えても崩れない
  ことを見る ―― 塊が 1 つ増えるたびにアンカーがずれると、前のラウンドの整理
  結果が指す先が黙って別の表になる。

  間は**2 行／2 列**空けてある（1 本だと 1 つの塊に繋がるのが正しい ――
  :mod:`corpus` の `一覧表.xlsx` がそちらを見ている）。
シート:
  - 名前: 一覧
    表:
      A1: [[画面ID, 画面名], [SCR001, 受注入力]]
      E1: [[帳票ID, 帳票名], [RPT001, 受注一覧表]]
      I1: [[バッチID, バッチ名], [BAT001, 夜間集計]]
      M1: [[テーブルID, テーブル名], [TBL001, 受注]]
      A5: [[画面ID, 画面名], [SCR002, 受注一覧]]
      E5: [[帳票ID, 帳票名], [RPT002, 請求書]]
      I5: [[バッチID, バッチ名], [BAT002, 締め処理]]
      M5: [[テーブルID, テーブル名], [TBL002, 受注明細]]
      A9: [[画面ID, 画面名], [SCR003, 受注照会]]
      E9: [[帳票ID, 帳票名], [RPT003, 納品書]]
      I9: [[バッチID, バッチ名], [BAT003, 単価取込]]
      M9: [[テーブルID, テーブル名], [TBL003, 顧客]]
