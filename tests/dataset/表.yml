# 表の書かれ方 ―― 日本の設計書の表は、罫線と結合で意味を持たせてある。
#
# ここの検体はどれも「画面に見えているもの」と「セルに入っているもの」がずれる。
# ずれ方を 1 冊 1 種類にしてあるので、落ちたテストから直す場所が一意に決まる。

置き場: 資料/F/テーブル定義書.xlsx
なぜ: |
  **面結合（複数行 × 複数列）が画面と食い違う。** 分類列を 2 列ぶんまとめて
  縦に結合するのは、区分と小区分を持つテーブル定義書でごく普通の書き方である
  ―― 画面ではその区分が全行に掛かって見えているのに、幅 1 の結合だけを展開
  していた頃は 2 行目以降が空欄になり、整理層には「区分の無い行」に見えた。

  二段見出し（横結合）は逆に**広げてはいけない** ―― 上段は 1 セルにしか値が
  無く、画面上も 1 つしか見えていない。同じ「結合」でも縦と横で正反対になる
  ことを 1 枚で突く。
シート:
  - 名前: 受注ヘッダ
    表:
      A1:
        - [受注テーブル（T_ORDER）定義書, ~, ~, ~, 改訂, 3.2]
        - [分類, ~, 名前, ~, 型, ~]
        - [区分, 小区分, 論理名, 物理名, 型, 桁]
        - [ヘッダ, キー, 受注番号, ORDER_NO, 文字列, 10]
        - [~, ~, 受注日, ORDER_DATE, 日付, ~]
        - [~, ~, 顧客コード, CUSTOMER_CD, 文字列, 8]
        - [~, 金額, 小計, SUBTOTAL, 数値, 9]
        - [~, ~, 消費税, TAX, 数値, 9]
        - [~, ~, 合計, TOTAL, 数値, 9]
        - [明細, ~, 行番号, LINE_NO, 数値, 3]
        - [~, ~, 数量, QTY, 数値, 5]
    結合:
      - A1:D1     # 表題（横結合）―― 広げない
      - A2:B2     # 二段見出しの上段（横結合）―― 広げない
      - C2:D2
      - E2:F2
      - A4:A9     # 幅 1 の縦結合（「同上」）―― 全行へ展開する
      - B4:B6
      - B7:B9
      - A10:B11   # 面結合（2 列 × 2 行）―― 縦にだけ展開する

  - 名前: 桁と丸め
    なぜ: |
      **Excel が保存する数と、Excel が画面に出す数は違う。** 二進の浮動小数点
      なので `=1200*0.08` の結果は `96.00000000000001` として保存されるが、
      画面には `96` と出ている ―― Excel 自身が 15 桁までしか見せないためである。
      素の `str()` で出すと、資料に一度も書かれていない桁が仕様になる。
    表:
      A1:
        - [項目, 値]
        - [消費税額, 96.00000000000001]
        - [按分率, 0.3333333333333333]
        - [積み上げ, 0.1000000000000000055511151231257827]
        - [単価, 1200.0]
        - [想定件数, 1200000]
    書式:
      B6: '"￥"#,##0'

  - 名前: 率の書き方
    なぜ: |
      **書式の `%` はパーセントとは限らない。** `0\%` の `\` は「次の 1 文字を
      そのまま出す」という OOXML のエスケープで、`15` は画面にも `15%` と出る
      ―― 100 倍して `1500%` と書くのは、資料に無い数を作っていることになる。
      引用符の中（`"%表示ではない"`）は塞いであったが、`\` は素通りしていた。
    表:
      A1:
        - [項目, 値]
        - [達成率, 0.153]
        - [消費税率, 0.1]
        - [増減率, -0.025]
        - [評価点, 15]
        - [係数, 15]
    書式:
      B2: '0.0%'
      B3: '0%'
      B4: '0.0%;[Red]▲0.0%'
      B5: '0\%'
      B6: '#,##0"%表示ではない"'

