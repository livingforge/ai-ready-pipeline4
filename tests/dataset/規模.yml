# 規模と、シートそのものの際どさ ―― 1 枚の中身ではなく**枠のほう**が壊れる形。

置き場: 資料/I/画面方眼紙.xlsx
なぜ: |
  **セルを方眼にして画面を描いたシート。** 日本の設計書でいちばん多い画面
  レイアウトの描き方で、40 行 × 60 列の枠に文字が 25 個しか無い ―― 表の格子
  で出すと `|  |` が 2000 個並び、中身の何十倍にもなる。

  番地付きの箇条書きへ回しても**失うものは無い**（どのセルにも番地が付く）
  が、**表の形で出していないことは言う** ―― 黙ると「表が無いシート」に見えて、
  読み手は表を探しに行く。

  2 枚目は逆側の検体である ―― **空欄の多い表がぜんぶ箇条書きになっては困る。**
  書きかけの表・任意項目の多い表は空欄だらけになるが、あれは表である。
シート:
  - 名前: 受注入力レイアウト
    セル:
      A1: 受注入力画面
      A3: 受注番号
      K3: （自動採番）
      T3: 受注日
      AC3: 受注区分
      A6: 得意先コード
      K6: 得意先名
      AC6: 敬称
      A9: 納品先コード
      K9: 納品先名
      A12: 明細
      A14: 行
      E14: 商品コード
      P14: 商品名
      AB14: 数量
      AH14: 単価
      AP14: 金額
      A16: '1'
      A18: '2'
      A20: '3'
      AH30: 小計
      AH32: 消費税
      AH34: 合計
      A38: 登録
      H38: 取消
      O38: 閉じる
      BH40: '※ 明細は 20 行まで'

  - 名前: 任意項目の多い表
    表:
      A1:
        - [項目ID, 項目名, 必須, 桁, 初期値, 入力チェック, 備考]
        - [C001, 受注番号, ○, 10, ~, ~, ~]
        - [C002, 受注日, ○, ~, 当日, 未来日不可, ~]
        - [C003, 得意先, ○, 8, ~, ~, ~]
        - [C004, 担当者, ~, 6, ~, ~, ~]
        - [C005, 備考, ~, 200, ~, ~, ~]
        - [C006, 希望納期, ~, ~, ~, ~, ~]
        - [C007, 出荷区分, ~, 1, '1', ~, ~]
        - [C008, 支払条件, ~, 2, ~, ~, ~]
        - [C009, 値引率, ~, 5, ~, 0〜100, ~]
        - [C010, 与信枠, ~, 11, ~, ~, ~]
        - [C011, 承認者, ~, 6, ~, ~, ~]
        - [C012, 更新日時, ~, ~, ~, ~, ~]

