置き場: 資料/J/様式サンプル.xlsx
なぜ: |
  **シート名がファイル名になるところで壊れる形**を 1 冊に集めたもの。
  記号を落とすと別のシートが同じファイル名になり、黙って上書きすると
  **シートが 1 枚消える**（消えたことは誰にも分からない）。

  全角空白で囲んだシート名は実物にごく普通にあり、`strip()` を通すと
  隣のシートと同じ名前になる ―― 半角空白だけを見ていると気付けない。
シート:
  - 名前: 受注
    セル:
      A1: 受注（新）
  - 名前: '　受注　'
    セル:
      A1: 受注（旧）
  - 名前: '2026'
    セル:
      A1: 2026 年度の様式
  - 名前: "受注'一覧"
    セル:
      A1: アポストロフィ入りのシート名
  - 名前: 受注入力画面項目定義書兼画面遷移補足資料一覧
    セル:
      A1: 31 文字ちょうどのシート名
  - 名前: 白紙
  - 名前: 集計メモ
    状態: hidden
    セル:
      A1: 作業用

---

置き場: 資料/J/添付_破損.xlsx
なぜ: |
  **開けない資料でパースを止めない。** 30 冊のうち 1 冊は必ずこうなる
  （メールの添付が途中で切れた・別形式に拡張子だけ付け替えた）。
  ここで例外を投げると、**残りの 29 冊が誰の目にも触れない。**
生バイト: "PK\x03\x04 添付が途中で切れたファイル"
