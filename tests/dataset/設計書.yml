        - ['3.0', 2026-05-29, 3.1 節, DB を PostgreSQL 16 へ更改。冗長構成を追加, 井桁]
        - ['3.1', 2026-06-05, 5.1 節, 希望納期を廃止（受注日から自動計算へ）, 名倉]
        - ['3.2', 2026-06-15, 3.1 節, 監視サーバを構成図に追記, 名倉]
        - ['3.3', 2026-07-03, 7 節, IF-05 の周期を月次から日次へ, ~]
    列幅: {A: 7, B: 13, C: 12, D: 44, E: 8}
    行高: {8: 0}            # 3.3 版の行は潰してある（hidden は立てない）
    印刷:
      ヘッダ右: 社外秘（取扱注意）
      フッタ左: TLG-OMS-BD-014
      フッタ中: 受注管理システム 基本設計書 第 3.2 版
      フッタ右: "&P / &N"
      見出し行: '1:1'
    取り消し線: [A4:E4]     # 2.1 版の改訂は 3.1 版で取り消された
    コメント:
