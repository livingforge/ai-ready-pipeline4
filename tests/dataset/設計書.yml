  # ── 4. システム構成図 ──────────────────────────────────────
  - 名前: システム構成図
    なぜ: |
      **この 1 枚がこの冊子の主題である。** ゾーンの囲み枠（文字なし）・見出し
      帯・機器の箱・冗長構成の対・監視の線・凡例・注記が入れ子の群になって
      おり、セルにあるのは表題と機器一覧だけ ―― 構成そのものは図にしか無い。

      線は 4 種類を入れてある。**次にやることが 4 通りに分かれる**からである。

      | 線 | 何が取れるか |
      | --- | --- |
      | 箱 → 箱（矢羽根あり） | 元・向き・先がそのまま取れる |
      | 箱 ↔ 箱（矢羽根なし） | 無向のまま出す（冗長構成の対に意味を付けない） |
      | 箱 → **文字を持たない囲み枠** | 繋がってはいるが相手に名前が無い ―― **絵にすれば読める** |
      | どこにも繋がっていない線 | 位置にしか情報が無い ―― **資料に情報が無い** |

      下 2 つを同じ文句で申告していたのがこの検体で出た欠陥である。

      群には**代替テキスト**を書いてある。構成図に 1 文だけ添えられる
      「現用／待機の 2 系統。DR は別紙 5」は箱の文字にも表にも無く、
      そこにしか書かれていない ―― 画像からは取るのに図形からは取っていなかった。
