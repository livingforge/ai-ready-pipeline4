# 現場の 1 冊を丸ごと写した設計書 ―― ここだけ検体の作りが違う。
#
# ほかの YAML は**1 つの欠陥を 1 つのシートで突く**（落ちたテストから直す場所が
# 一意に決まる）。これはその逆で、**1 冊の中で全部が同時に起きる**ところしか
# 見ない ―― 表紙・改訂履歴・目次・構成図・機能一覧・テーブル定義・画面レイ
# アウト・外部 IF・課題管理が 1 つのブックに綴じられ、シート間で番号が振られ、
# 同じ語が別のシートで別の意味を持つ。実案件の基本設計書はこの形でしか来ない。
#
# **人が読んで正しさを判定できる 1 冊**でもある。この 1 冊のパース結果だけは
# `tests/dataset/正解/` に丸ごと置いてあり（→ `docs/parsed.md`）、
# 「機械が何を出すか」を仕様の文章ではなく**出来上がりそのもの**で読める。
#
# 企業名・製品名・担当者名はすべて架空である。

置き場: 資料/K/受注管理システム基本設計書（第3.2版）.xlsx
なぜ: |
  **複雑な図形を組み合わせた構成図が、この 1 冊のいちばん重い仕様である。**
  ゾーンの囲み枠・見出し帯・機器の箱・冗長構成の対・監視の線・凡例・注記が
  入れ子の群になっており、セルには表題と機器一覧しか無い ―― 構成そのものは
  図にしか描かれていない。

  ここで 3 つが出た。どれも**図が複雑になるまで表に出てこない**。

  1. **群と図形の代替テキストを取っていなかった。** 画像と埋め込みオブジェクト
     からは取るのに、図形（`xdr:sp`）と群（`xdr:grpSp`）からは取らない ――
     構成図に 1 文だけ添えられた「現用／待機の 2 系統。DR は別紙 5」は、
     箱の文字にも表にも無く、そこにしか書かれていない
  2. **箱の中の字下げを潰していた。** セルの値では残すと決めた（項目定義書の
     親子は字下げで表す）のに、図形の段落は `strip()` していた ―― 機能階層を
     1 つのテキストボックスで書くのは日本の設計書でごく普通で、潰すと
     親子がまるごと平らになる
  3. **「繋がっているが相手が無名の線」と「どこにも繋がっていない線」を、
     同じ文句で申告していた。** 前者は絵にすれば読めるが、後者は資料に情報が
     無い ―― 次にやることが正反対なのに、どちらも「両端が図形に結びついて
     おらず（線を目分量で置いた図）」と言っていた（**申告のほうが嘘**）

  日付を和暦書式（`[$-411]ggge"年"…`）で持たせてあるのは**直さないため**の
  検体である。画面に `令和8年6月15日` と出ていても値は同じ日で、桁区切りや
  通貨記号を落とすのと同じ側にある ―― ここを直し始めると書式の再現になる。

  **綴じて配る文書であることも、この 1 冊でしか出ない。** 文書番号・版・機密
  区分・ページ番号はフッタに入り、長い表には繰り返す見出し行が指定されている
  ―― どのページにも出ているのに、**セルには 1 つも書かれていない**。しかも
  フッタの版は 3.1 のまま古い（改訂履歴は 3.2）。

  **3.2 版のあとにもう 1 行だけ入った改訂**が、改訂履歴に**高さ 0 で潰されて**
  残っている。非表示行と違って `hidden` は立たないので、隠すフラグだけを見て
  いたぶん**画面に見えている行として出していた**（申告にも上がらない）。
  その改訂を入れた人はブックのプロパティの最終更新者と同じで、**表紙の承認欄
  にも改訂履歴にも出てこない名前**である ―― 版を上げずに直したのか、開いて
  保存し直しただけなのかは資料からは決まらない（機械は判断しない）。

  **入力規則の候補は取らないと決めた側**である（クリックするまで画面に出ない）。
  資料の側には普通にあるので検体には入れてあり、`取り下げ` はどの行にも選ばれて
  いない ―― **取らない決定が実物で何を落としているか**がここで読める。
シート:
  # ── 1. 表紙 ────────────────────────────────────────────────
  - 名前: 表紙
    なぜ: |
      **表紙は表ではない。** 罫線で作った承認欄と、離れて置かれた発注者欄が
      塊として散る ―― 番地さえ付いていれば読み直せる、という区切りの前提が
      いちばん効くシートである。会社ロゴは**代替テキストの無い画像**で、
      社名がその絵の中にしか無い（OCR でも網掛けと重なって読めない）。

      **表紙にだけフッタの体裁が違う**（先頭ページには文書番号を刷らない）。
      綴じたときに背表紙側へ回るページなので、実物でもここだけ別に設定する。
    セル:
      B2: 受注管理システム
      B4: 基本設計書
      B6: 第 3.2 版
      G2: 社外秘（取扱注意）
      G3: 複製・再配布を禁ずる
      B27: 本書は東和ロジテック株式会社と株式会社セイワ情報システムの間で
      B28: 締結した業務委託契約に基づき作成したものである。
    表:
      B9:
        - [文書番号, TLG-OMS-BD-014]
        - [発注者, 東和ロジテック株式会社]
        - [受託者, 株式会社セイワ情報システム]
        - [対象業務, 受注受付 〜 出荷指示]
        - [対象システム, 受注管理システム（TOWA-OMS）]
      B17:
        - [区分, 所属, 氏名, 日付, 印]
        - [承認, 情報システム部長, 井桁 誠一, 2026-06-22, ~]
        - [査閲, 業務改革推進課, 名倉 美佳, 2026-06-19, ~]
        - [作成, セイワ情報システム, 郡司 亮太, 2026-06-15, ~]
    書式:
      # **和暦は直さない。** 画面には `令和8年6月22日` と出ているが、値は
      # 同じ日である ―― ￥ と桁区切りを落とすのと同じ側にある
      E18:E20: '[$-411]ggge"年"m"月"d"日"'
    列幅: {B: 14, C: 30, D: 16, E: 18, F: 6, G: 22}
    印刷:
      ヘッダ右: 社外秘（取扱注意）
      フッタ中: "&P"
      範囲: A1:I30
    結合:
      - B2:E3       # 表題（横結合）―― 広げない
      - B4:E5
      - G2:I2
    描画:
      # **代替テキストの無い画像**。社名はこの絵の中にしか無く、印刷物から
      # 取り込んだので網点に潰れている（人には読めるが OCR は落ちる）
      - 画像: {絵柄: ロゴ}
        id: 2
        名前: Picture 1
        位置: G8:I13

  # ── 2. 改訂履歴 ────────────────────────────────────────────
  - 名前: 改訂履歴
    なぜ: |
      **取り消し線で消した改訂**が、生きた改訂と見分けが付かない。改訂履歴は
      「いつ何をやめたか」を残すために行を消さない書き方をするので、値だけ
      抜き出すと**取り消したはずの改訂が現行仕様に混ざる**。

      **最後の 1 行は高さ 0 で潰してある。** 表紙も目次もフッタも 3.2 版のまま
      なので、この行だけが 3.3 版の存在を知っている ―― `hidden` は立って
      いないので「再表示」には出てこず、隠すフラグだけを見ていたぶん
      **画面に見えている行として出していた**（申告にも上がらない）。
      行を消さずに潰すのは、改訂履歴でいちばんよくある隠し方である。

      入れた人（川瀬）は**表紙の承認欄にも他の改訂行にも出てこない**が、
      ブックのプロパティの最終更新者と日時がちょうど一致する。
    表:
      A1:
        - [版, 改訂日, 改訂箇所, 改訂内容, 承認]
