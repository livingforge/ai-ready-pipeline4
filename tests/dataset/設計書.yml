  # ── 5. 機能一覧 ────────────────────────────────────────────
  - 名前: 機能一覧
    なぜ: |
      **機能階層を 1 つのテキストボックスで書くのは日本の設計書でごく普通で
      ある。** 親子は段落の字下げでしか表されていないので、段落を `strip()`
      すると階層がまるごと平らになる ―― セルの値では残すと決めた
      （`受注ヘッダ` / `　　受注番号`）のと同じことが、図形の側で起きていた。

      表のほうは区分を 2 列ぶんまとめて縦に括ってある（面結合）。工数の合計欄
      は計算結果が保存されていない ―― ツールで出力した設計書はこうなる。

      **H 列は幅 0 で潰してある。** 受託側の見積番号を持ち回るための作業用列で、
      客先へ出す体裁には入れないが列ごと消しもしない ―― 非表示列と同じに見えて
      `hidden` は立たないので、幅を見ていなかったぶん**画面に出ていない値が
      表に混ざっていた**（しかも申告が無いので、混ざっていることも言えない）。

      **区分の欄には入力規則が掛かっている。** 候補には `保守` があるが、
      どの行にも選ばれていない ―― arp4 は候補を取らないと決めているので、
      パース結果には最後まで出てこない（クリックするまで画面に出ないものは
      「見えている表記」ではない、という線引きが実物で効いているところ）。

      **フッタの版は 3.1 のまま**である。改訂履歴は 3.2、表紙も 3.2 版なので
      1 冊の中で食い違っているが、機械はどれが正しいかを言わない。
    表:
      A1:
        - [機能ID, 区分, ~, 機能名, 概要, 画面/帳票, 工数（人日）, 見積番号（社内）]
        - [F-01, 受注, 登録, 受注登録, 受注を新規に登録する, SCR001, 12, SW-2601-01]
        - [F-02, ~, ~, 受注修正, 確定前の受注を修正する, SCR001, 5, SW-2601-02]
        - [F-03, ~, ~, 受注取消, 出荷指示前の受注を取り消す, SCR001, 3, SW-2601-03]
        - [F-04, ~, 照会, 受注一覧, 条件を指定して受注を検索する, SCR002, 8, SW-2601-04]
        - [F-05, ~, ~, 受注明細照会, 受注の明細を参照する, SCR003, 4, SW-2601-05]
        - [F-06, 出荷, ~, 出荷指示作成, 引当済みの受注から出荷指示を作る, BAT002, 10, SW-2602-01]
        - [F-07, ~, ~, 出荷実績取込, 倉庫システムの実績を取り込む, BAT003, 6, SW-2602-02]
        - [F-08, 請求, 締め, 月次締め, 月次の請求データを確定する, BAT004, 9, SW-2603-01]
        - [~, ~, ~, ~, ~, 合計, '=SUM(G2:G9)', ~]
    列幅: {A: 9, B: 8, C: 8, D: 16, E: 34, F: 12, G: 13, H: 0}
    印刷:
      ヘッダ右: 社外秘（取扱注意）
      フッタ左: TLG-OMS-BD-014
      フッタ中: 受注管理システム 基本設計書 第 3.1 版
      フッタ右: "&P / &N"
      見出し行: '1:1'
    入力規則:
      # **候補は取らないと決めた側**（クリックするまで画面に出ない）。
      # `保守` はどの行にも選ばれていないので、取らない決定が何を落として
      # いるかがこの 1 語で読める。
      B2:B9: [受注, 出荷, 請求, 保守]
    結合:
      - B2:B6       # 幅 1 の縦結合（受注）
      - C2:C4       # 登録
      - C5:C6       # 照会
      - B7:C8       # 面結合（2 列 × 2 行）―― 縦にだけ展開する
    描画:
      # **字下げでしか階層を持っていない機能構成図。** 潰すと親子が平らになる
      - 箱:
          - 機能構成
          - "　1. 受注管理"
          - "　　1-1. 受注登録"
          - "　　1-2. 受注修正"
          - "　　1-3. 受注取消"
          - "　2. 照会"
          - "　　2-1. 受注一覧"
          - "　　2-2. 受注明細照会"
          - "　3. 出荷"
          - "　　3-1. 出荷指示作成"
          - "　　3-2. 出荷実績取込"
          - "　4. 請求"
          - "　　4-1. 月次締め"
        id: 2
        名前: 機能構成図
        形: rect
        寄せ: 左
        位置: I1:N18

  # ── 6. テーブル定義 ────────────────────────────────────────
  - 名前: テーブル定義
    なぜ: |
      **項目定義書の階層は字下げで表す。** 繰り返し項目（受注明細）の親子が
      それで、値をまとめて `strip()` すると親と子が同じ深さで並ぶ。二段見出し
      （横結合）と区分の縦結合が同じ表に同居しているのも実物どおりである。
    表:
      A1:
        - [受注テーブル（T_ORDER）定義書, ~, ~, ~, ~, ~, ~, 改訂, '3.2']
        - [分類, ~, 項目, ~, 属性, ~, ~, 制約, 備考]
        - [区分, 小区分, 論理名, 物理名, 型, 桁, NULL, PK, ~]
        - [ヘッダ, キー, 受注番号, ORDER_NO, CHAR, 10, 不可, ○, 採番ルールは別紙 2]
        - [~, ~, 受注枝番, ORDER_BRANCH, CHAR, 2, 不可, ○, 分割出荷で採番]
        - [~, 日付, 受注日, ORDER_DATE, DATE, ~, 不可, ~, 2026-06-15]
        - [~, ~, 希望納期, DUE_DATE, DATE, ~, 可, ~, 受注日から自動計算へ変更]
        - [~, 金額, 小計, SUBTOTAL, NUMERIC, 11, 不可, ~, 税抜]
        - [~, ~, 消費税額, TAX, NUMERIC, 11, 不可, ~, 小計 × 消費税率（外税）]
        - [~, ~, 合計, TOTAL, NUMERIC, 11, 不可, ~, 小計 ＋ 消費税額]
        - [明細, ~, 受注明細, ORDER_DETAIL, ~, ~, ~, ~, 繰り返し（最大 20 行）]
        - [~, ~, 　　行番号, LINE_NO, NUMERIC, 3, 不可, ○, ~]
        - [~, ~, 　　商品コード, ITEM_CD, CHAR, 13, 不可, ~, JAN コード]
        - [~, ~, 　　数量, QTY, NUMERIC, 5, 不可, ~, ~]
        - [~, ~, 　　単価, UNIT_PRICE, NUMERIC, 9, 不可, ~, 1200]
    列幅: {A: 8, B: 9, C: 18, D: 16, E: 10, F: 6, G: 7, H: 6, I: 26}
    印刷:
      ヘッダ右: 社外秘（取扱注意）
      フッタ左: TLG-OMS-BD-014
      フッタ中: 受注管理システム 基本設計書 第 3.2 版
      フッタ右: "&P / &N"
      # **どこまでが見出しかは、資料の作成者がここで申告している。**
      # 二段見出し（1〜3 行目）を毎ページ刷る、と決めたのは人である
      見出し行: '1:3'
    書式:
      I15: '"￥"#,##0'
    結合:
      - A1:G1       # 表題（横結合）―― 広げない
      - A2:B2       # 二段見出しの上段（横結合）
      - C2:D2
      - E2:G2
      - A4:A10      # 幅 1 の縦結合（ヘッダ）
      - B4:B5
      - B6:B7
      - B8:B10
      - A11:B15     # 面結合（2 列 × 5 行）

  # ── 7. 画面レイアウト ──────────────────────────────────────
  - 名前: 画面レイアウト
    なぜ: |
      **セルを方眼にして画面を描いたシート**に、**貼り付け画像が 2 枚**ある。
      1 枚は代替テキストのあるハードコピー（印刷したものを取り込み直したもの）
      で、もう 1 枚は代替テキストが無い ―― 後者は「そこに何かが貼ってある」
      ことしか伝わらない。どちらも `arp4 render` で撮り直しても中身は読めない
      （読むなら 2 側の OCR が要るが、網点と斜行はそちらでも落ちる）。
    セル:
      A1: SCR001 受注入力画面
      A3: 画面 ID
      E3: SCR001
      L3: 画面区分
      P3: 入力
      A5: 得意先コード
      H5: '[        ]'
      L5: 得意先名
      S5: '（自動表示）'
      A7: 受注日
      H7: '[  /  /  ]'
      L7: 受注番号
      S7: '（採番後に表示）'
      A9: 明細
      A10: 行
      D10: 商品コード
      L10: 商品名
      T10: 数量
      X10: 単価
      AB10: 金額
      A11: '1'
      A12: '2'
      A13: '3'
      A21: 合計
      X21: '=SUM(AB11:AB20)'
      A24: 備考
      A26: ボタン
      D26: '［登録 F9］'
      J26: '［クリア F5］'
      P26: '［戻る ESC］'
    描画:
      - 箱: [[明細は 20 行まで, 21 行目以降は別受注へ分割]]
        id: 2
        名前: 注記
        形: rect
        寄せ: 左
        位置: AF3:AL7
      - 画像:
          絵柄: 画面
          代替: 現行画面のハードコピー（印刷したものを取り込み直したので網点で潰れている）
        id: 3
        名前: Picture 1
        位置: AF9:AN22
      # **代替テキストが無い**。何の画像かはどこにも書いていない ―― 斜行した
      # 帳票のスキャンなので、絵を見ても機械には 1 文字も取れない
      - 画像: {絵柄: 帳票}
        id: 4
        名前: Picture 2
        位置: AF24:AN34

  # ── 8. 外部 IF 一覧 ────────────────────────────────────────
  - 名前: 外部IF一覧
    なぜ: |
      **別ブックを読んでいることが表からいっそう見えない。** 参照先の値は
      キャッシュされているので画面にはただの数が出ており、それが別ブック
      由来だとは誰も気付かない ―― その資料が手元に無ければ、その数の根拠は
      次のラウンドでも確かめられない。

      引き当ての消えた行がエラー値のまま残っているのも実物どおりである
      （開き直しても直らない側）。
    表:
      A1:
        - [IF-ID, 相手先, 方向, 方式, 周期, 件数/日, 備考]
        - [IF-01, 東和物流センター, 送信, CSV（SFTP）, 日次 03:00, 8000, 出荷指示]
        - [IF-02, 東和物流センター, 受信, CSV（SFTP）, 日次 06:00, 7800, 出荷実績]
        - [IF-03, 与信サービス（外部）, 双方向, REST/JSON, 都度, 1200, 与信判定]
        - [IF-04, 取引先 EDI, 受信, AS2, 都度, '#N/A', 引き当てが見つからない]
        - [IF-05, 会計システム, 送信, 固定長, 月次, '#REF!', 参照先のシートが消えている]
        - [IF-06, 単価マスタ, 受信, 別ブック参照, 随時, '=[1]単価!B2', 単価表を参照]
    列幅: {A: 8, B: 22, C: 8, D: 16, E: 12, F: 10, G: 26}
    印刷:
      ヘッダ右: 社外秘（取扱注意）
      フッタ左: TLG-OMS-BD-014
      フッタ中: 受注管理システム 基本設計書 第 3.2 版
      フッタ右: "&P / &N"
      見出し行: '1:1'
    リンク:
      B7: {先: '../外部/EDI仕様書_v4.xlsx', 位置: 'AS2設定!A1'}

  # ── 9. 課題管理 ────────────────────────────────────────────
  - 名前: 課題管理
    なぜ: |
      **決定はここにしか書かれていない。** 設計書の課題管理表は状態欄しか
      持たず、何がどう決まったかは**セルに付いたコメント**に溜まる ―― 本文
      より新しいことが珍しくない。返信への返信・解決済み・親を失った返信が
      同じ 1 枚に並ぶのが実物である。

      1 列目の見出しが `No` なのは意図してのことで、YAML 1.1 はこれを偽と
      読む ―― **パース結果は正しいのに検体が間違っている**という、いちばん
      直す場所の決まらない失敗をここでも踏まないようにしてある。

      状態欄の候補（`取り下げ`）は入力規則にしかなく、どの行にも選ばれて
      いない。**課題が 4 件あるように見えて、取りうる状態は 5 つある** ――
      表だけを読んでも欠けていることに気付けない形である（取らないと決めた
      ものが何を落とすかは、こういう 1 語でしか現れない）。
    表:
      A2:
        - [No, 起票日, 分類, 対象, 内容, 状態, 期限]
        - [1, 2026-06-02, 方式, 与信サービス, 応答遅延時の扱いが未確定, 確認中, 2026-06-30]
        - [2, 2026-05-20, 非機能, 冗長構成, 切替時間の目標値, 完了, ~]
        - [3, 2026-06-09, 運用, 帳票保管, 保管年数の根拠, 確認中, 2026-07-10]
        - [4, 2026-06-11, 移行, 旧受注データ, 移行対象期間の確定, 未着手, 2026-07-31]
    列幅: {A: 5, B: 13, C: 9, D: 16, E: 34, F: 9, G: 13}
    印刷:
      ヘッダ右: 社外秘（取扱注意）
      フッタ左: TLG-OMS-BD-014
      フッタ中: 受注管理システム 基本設計書 第 3.2 版
      フッタ右: "&P / &N"
      見出し行: '2:2'
    入力規則:
      F3:F6: [未着手, 確認中, 完了, 保留, 取り下げ]

  # ── 10. 旧構成図（非表示） ─────────────────────────────────
  - 名前: 旧構成図
    状態: hidden
    なぜ: |
      **「旧版」を隠しただけのシート**は実案件にごく普通にある。読まないと
      決めたのと黙って落とすのは別で、シートが 1 枚も出てこなければ誰も
      それを疑わない。
    セル:
      A1: 2025 年度構成（更改前。3.0 版で差し替え）
      A3: DB は Oracle 19c。冗長構成なし

パーツ:
  # **誰がいつ触ったかは、シートにも表にも出てこない。** 改訂履歴は人が書いた
  # 申告なので、書き忘れれば何も残らない ―― プロパティは Excel が黙って書く。
  #
  # 最終更新者の川瀬は**表紙の承認欄にも改訂履歴の他の行にも出てこない**。
  # 日時（2026-07-03）は 3.2 版の改訂日（2026-06-15）より後で、高さ 0 で潰して
  # ある 3.3 版の行とちょうど一致する ―― 版を上げずに直したのか、開いて保存し
  # 直しただけなのかは資料からは決まらないので、機械は並べるだけにする。
  docProps/core.xml: |
