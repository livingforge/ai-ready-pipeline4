  # ── 3. エラー処理 ──────────────────────────────────────────
  - 名前: エラー処理
    なぜ: |
      **時刻と経過時間が同じ表に並ぶ。** リトライ間隔とタイムアウトは経過時間
      （`[h]:mm`）、監視への通知は時刻（`hh:mm`）で、画面の見え方は似ているのに
      値の型が違う ―― YAML 1.1 はどちらも 60 進数の数と読むので、検体は
      `dataset.py` の明示形（`時刻` / `経過`）で書いてある。**その明示形を
      使う検体がこれまで 1 つも無かった**ので、塞げているかを誰も確かめて
      いなかった。

      区分の欄には入力規則が掛かっており、候補の `警告` はどの行にも
      選ばれていない ―― `設計書.yml` と同じで、**取らないと決めたものが
      何を落としているか**がここでも 1 語で読める。
    表:
      A1:
        - [エラーコード, 区分, メッセージ, 発生条件, リトライ, リトライ間隔, タイムアウト, 通知時刻, 通知先]
        - [E1001, 入力, 受注番号は自動採番です, 受注番号欄に手入力した, N, ~, ~, ~, 画面]
        - [E1002, 入力, 得意先コードが正しくありません, 8 桁の半角数字でない, N, ~, ~, ~, 画面]
        - [E1003, 業務, 受注日に未来日は指定できません, 受注日がシステム日付より後, N, ~, ~, ~, 画面]
        - [E1010, 入力, 商品コードが正しくありません, JAN のチェックディジット不一致, N, ~, ~, ~, 画面]
        - [E1011, 業務, 数量は 1 以上で入力してください, 数量が 0 以下, N, ~, ~, ~, 画面]
        - [E2001, 外部連携, 与信サービスが応答しません, REST の応答が返らない, Y,
           {経過: '0:01'}, {経過: '0:03'}, {時刻: '07:00'}, 運用監視（Zabbix）]
        - [E2002, 外部連携, 単価を取得できません, 単価表の参照に失敗した, Y,
           {経過: '0:05'}, {経過: '0:15'}, {時刻: '07:00'}, 運用監視（Zabbix）]
        - [E9001, システム, 排他エラーが発生しました, 同一受注を同時に更新した, N, ~, ~, ~, 画面とログ]
    列幅:
      {A: 13, B: 11, C: 32, D: 30, E: 8, F: 13, G: 13, H: 11, I: 20}
    書式:
      # **経過時間は `[h]:mm`**（24 時間を超えても丸めない）。時刻は `hh:mm`
      F7:G9: '[h]:mm'
      H7:H9: 'hh:mm'
    印刷:
      ヘッダ左: SCR001 受注登録
      ヘッダ中: 詳細設計書 第 1.4 版
      ヘッダ右: 社外秘（取扱注意）
      フッタ右: "&P / &N"
      見出し行: '1:1'
    入力規則:
      B2:B9: [入力, 業務, 外部連携, システム, 警告]

  # ── 4. 処理ロジック ────────────────────────────────────────
  - 名前: 処理ロジック
    なぜ: |
      **疑似コードはセルに 1 行ずつ書かれ、階層は字下げでしか表されていない。**
      表ではないので番地付きの箇条書きへ回るが、字下げを潰すと入れ子の
      深さがまるごと平らになる ―― 図形の段落で起きていたのと同じことが、
      **セルを 1 列だけ使った縦長のシート**でも起きる。

      フロー図には**リトライの自己ループ**がある。与信判定から与信判定へ
      戻る線で、元と先が同じ図形を指す ―― 向きだけを見ると「同じ箱から同じ箱へ」
      という無意味な行に見えるが、資料にそう描いてあるのでそのまま出す
      （リトライだと決めるのは整理層である）。

      **決定はコメントに溜まる。** 排他の方式をどちらにしたかは本文に無く、
      セルに付いたコメントにしか書かれていない。
    セル:
      A1: 受注登録（SCR001）処理ロジック
      A3: '1. 入力チェック'
      A4: '　1-1. 必須項目の未入力を確認する（E1001〜E1011）'
