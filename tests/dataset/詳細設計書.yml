# 機能 1 本ぶんの詳細設計書 ―― `設計書.yml`（基本設計書）の**下流**の 1 冊。
#
# 基本設計書は「何を作るか」を 1 冊に綴じるので、シートの種類が多くて 1 枚は浅い。
# 詳細設計書は逆で、**機能 1 本に 1 冊**あり、シートは少ないのに 1 枚が横に長い
# ―― 項目 1 つに対して型・桁・必須・初期値・編集規則・丸め・エラーコード・
# 画面と帳票の出方までが 1 行に並ぶ。**縦に伸びる表と横に伸びる表は、機械から
# 見て別の資料である。**
#
# ここで 2 つが出た。どちらも**横に長い表と、時間の値**でしか表に出てこない。
#
# 1. **繰り返し印刷する見出し「列」を一度も見ていなかった。** 見出し行
#    （`print_title_rows`）はどの検体にもあるが、見出し列（`print_title_cols`）は
#    34 冊のどれも指定しておらず、**申告に 1 度も出たことがない**。横に長い表は
#    紙にすると左右に割れるので、実物では左の 3 列を毎ページ刷る ―― 2 枚目以降は
#    「項目 No も名前も無い、型と桁だけの紙」になるからである。どこまでが見出しかを
#    決めたのは人なので、機械はそれを取るだけでよい
# 2. **時刻と経過時間を YAML に素直に書くと数になる。** YAML 1.1 は `02:00` を
#    120、`27:30` を 1650 と読む（60 進数）―― `dataset.py` は明示形
#    （`時刻` / `経過` / `日時`）でそこを塞いでいるが、**どの検体も使っていな
#    かったので、塞げているかを誰も確かめていなかった**。タイムアウト・リトライ
#    間隔・累計処理時間は詳細設計書でいちばんよく出る値で、しかも
#    **`27:30` は時刻ではない**（24 時間を超える経過時間は `[h]:mm` でしか
#    画面に出ない）
#
# **`Y` / `N` のフラグも同じ側にある。** 必須・入力可否は実物ではこの 1 文字で
# 書かれるが、YAML 1.1 はどちらも真偽値と読む ―― `設計書.yml` は見出しの `No` で
# そこを突いてあるが、**値としての `Y` / `N` はどの検体にも無かった**。
#
# **見出し列は申告の文には出ない。** アンカー（`s?-p1`）には
# `印刷タイトル列 $A:$C` と出るので読み直せるが、`>` の申告文が名前を挙げるのは
# 見出し行だけである ―― 番地が付いている以上どちらも読めるので、ここは
# 忠実性の欠落ではなく**提示の偏り**として残してある（→ `docs/parsed.md`）。
#
# 企業名・製品名・担当者名はすべて架空である。

置き場: 資料/L/受注登録詳細設計書（SCR001）第1.4版.xlsx
なぜ: |
  **横に長い 1 枚と、時間の値**しか無い 1 冊である。基本設計書
  （`設計書.yml`）と同じ案件の下流にあたり、あちらが 9 種類のシートを 1 冊に
  綴じるのに対して、こちらは**機能 1 本ぶんを 5 枚**で書く。

  **この 1 冊を作ったのは Excel ではない。** ブックのプロパティの作成アプリが
  `LibreOffice/7.6` になっており、そのぶん**数式のキャッシュが 1 つも入って
  いない** ―― 「計算結果が保存されていない」という申告は、資料の側に理由が
  あってこう出ていることが、この 1 冊でだけ突き合わせられる（受託先が
  Excel を持っていない、という実案件で普通に起きる形である）。

  日付を持つ欄と、**時刻を持つ欄と、経過時間を持つ欄が同じ表に並ぶ**のも
  詳細設計書だけである。3 つは画面の見え方が似ているのに値の型が違い、
  `27:30` は時刻としては存在しない ―― 24 時間を超える経過時間は
  `[h]:mm` 書式でしか画面に出ない。
シート:
  # ── 1. 表紙 ────────────────────────────────────────────────
  - 名前: 表紙
    なぜ: |
      **詳細設計書は上位の 1 冊を名前で指す。** 目次のようなリンクではなく
      ただの文字列なので、その基本設計書が手元にあるかは資料からは決まらない
      ―― 機械が言えるのは「そう書いてある」ことだけである。

      改訂履歴を別のシートにせず表紙に載せるのは、機能 1 本ぶんの冊子では
      普通の書き方である（3 行しか無いので綴じ分けない）。

      **ヘッダに版が入る。** 基本設計書はフッタに刷っていたが、こちらは
      受託先の様式なのでヘッダに来る ―― 同じ案件の 2 冊で綴じの体裁が
      違うのは、書いた会社が違うからである。
    セル:
      B2: 受注登録
      B4: 詳細設計書
      B6: 第 1.4 版
      F2: 社外秘（取扱注意）
      B22: 本書は東和ロジテック株式会社の受注管理システム再構築に係る
      B23: 業務委託契約に基づき、株式会社ミナミ設計工房が作成した。
    表:
      B9:
        - [機能ID, SCR001]
        - [機能名, 受注登録]
        - [上位設計書, 受注管理システム基本設計書（第3.2版）]
        - [対応する機能ID, F-01]
        - [作成, 株式会社ミナミ設計工房]
      B16:
        - [版, 改訂日, 改訂内容, 作成]
        - ['1.0', 2026-06-24, 初版, 南 亜衣]
        - ['1.3', 2026-07-10, 希望納期の入力欄を廃止（基本設計 3.1 版に合わせる）, 南 亜衣]
        - ['1.4', 2026-07-28, 与信サービスのタイムアウトとリトライを追記, 藤代 拓]
    列幅: {B: 16, C: 34, D: 16, E: 12, F: 22}
    印刷:
      ヘッダ左: SCR001 受注登録
      ヘッダ中: 詳細設計書 第 1.4 版
      ヘッダ右: 社外秘（取扱注意）
      フッタ右: "&P / &N"
      範囲: A1:G25
    結合:
      - B2:E3
      - B4:E5

  # ── 2. 項目編集仕様 ────────────────────────────────────────
  - 名前: 項目編集仕様
    なぜ: |
      **この 1 枚がこの冊子の主題であり、横に長い表の検体でもある。** 項目 1 つ
      につき型・桁・小数・必須・入力可否・初期値・編集規則・丸め・エラーコード・
      画面と帳票の出方が 1 行に並ぶので、16 列になる ―― 縦に伸びる表とは
      紙の上での壊れ方が違う。

      **だから左の 3 列を毎ページ刷る、と作成者が決めている**
      （`print_title_cols`）。これを取らないと、2 枚目以降が「項目 No も名前も
      物理名も無い、型と桁だけの紙」であることが読み手に伝わらない ―― 見出し
      行と同じで、どこまでが見出しかを決めたのは人であって機械ではない。
      **34 冊のどれも見出し列を指定していなかったので、この申告はここで初めて
      出る。**

      **必須と入力可否は `Y` / `N` で書かれている。** YAML 1.1 はどちらも真偽値と
      読むので、素直に書くと検体のほうが `TRUE` / `FALSE` になる ―― 見出しの
      `No` と同じ罠で、**パース結果は正しいのに検体が間違っている**という、
      いちばん直す場所の決まらない失敗である。

      **旧物理名の列（D）は表の真ん中で非表示にしてある。** 移行のために持ち
      回っているが客先へ出す体裁には入れない列で、実物では端ではなく
      **項目名のすぐ隣**に置かれる ―― 落とすと表の格子が 1 列詰まり、隣の列の
      値が旧物理名の位置に並ぶ。値は出したうえで「画面には出ていない」と言う。

      繰り返し項目（受注明細）の親子は字下げでしか表されていない。備考の欄は
      幅 1 の縦結合で、二段見出しの上段は横結合である ―― どちらも
      `設計書.yml` と同じで、**横に長い表でも同じように効く**ことを見る。
    表:
      A1:
        - [受注登録（SCR001）項目編集仕様, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, 改訂 1.4]
        - [項目, ~, ~, ~, 属性, ~, ~, 入力, ~, ~, 編集, ~, ~, 出力, ~, 備考]
        - [No, 論理名, 物理名, 旧物理名, 型, 桁, 小数, 必須, 入力可否, 初期値, 編集規則, 丸め, エラーコード, 画面, 帳票, ~]
        - [1, 受注番号, ORDER_NO, JUCHU_NO, CHAR, 10, ~, Y, N, ~, 採番のみ。手入力は不可, ~, E1001, ○, ○, 採番ルールは基本設計書 別紙 2]
        - [2, 得意先コード, CUST_CD, TOKUISAKI_CD, CHAR, 8, ~, Y, Y, ~, 半角数字。前ゼロ埋め, ~, E1002, ○, ○, ~]
        - [3, 得意先名, CUST_NAME, TOKUISAKI_NM, VARCHAR, 60, ~, N, N, ~, 得意先マスタから自動表示, ~, ~, ○, ○, 画面表示のみ（保持しない）]
        - [4, 受注日, ORDER_DATE, JUCHU_DATE, DATE, ~, ~, Y, Y, 当日, 未来日は不可, ~, E1003, ○, ○, 既定は当日]
        - [5, 希望納期, DUE_DATE, NOKI_DATE, DATE, ~, ~, N, N, ~, 受注日から自動計算（3 営業日後）, ~, ~, ○, ~, 1.3 版で入力欄を廃止]
        - [6, 受注明細, ORDER_DETAIL, MEISAI, ~, ~, ~, ~, ~, ~, 繰り返し（最大 20 行）, ~, ~, ○, ○, 以下は明細の項目]
        - [7, 　　行番号, LINE_NO, GYO_NO, NUMERIC, 3, 0, Y, N, ~, 1 から連番, ~, ~, ○, ○, ~]
        - [8, 　　商品コード, ITEM_CD, SHOHIN_CD, CHAR, 13, ~, Y, Y, ~, JAN。チェックディジットを検証, ~, E1010, ○, ○, ~]
        - [9, 　　数量, QTY, SURYO, NUMERIC, 5, 0, Y, Y, '1', 1 以上。0 と負数は不可, 切り捨て, E1011, ○, ○, ~]
        - [10, 　　単価, UNIT_PRICE, TANKA, NUMERIC, 9, 2, Y, N, ~, 単価マスタから取得, 小数第 2 位で四捨五入, ~, ○, ○, 単価表は別ブック]
        - [11, 　　金額, AMOUNT, KINGAKU, NUMERIC, 11, 0, N, N, ~, 数量 × 単価, 円未満は切り捨て, ~, ○, ○, ~]
        - [12, 小計, SUBTOTAL, SHOKEI, NUMERIC, 11, 0, N, N, ~, 明細金額の合計, ~, ~, ○, ○, 税抜]
        - [13, 消費税額, TAX, SHOHIZEI, NUMERIC, 11, 0, N, N, ~, 小計 × 消費税率（外税）, 円未満は切り捨て, ~, ○, ○, 消費税率は 10%]
        - [14, 合計, TOTAL, GOKEI, NUMERIC, 11, 0, N, N, ~, 小計 ＋ 消費税額, ~, ~, ○, ○, ~]
    列幅:
      {A: 5, B: 16, C: 15, D: 15, E: 10, F: 5, G: 6, H: 6, I: 9, J: 8,
       K: 30, L: 22, M: 13, N: 6, O: 6, P: 30}
    # **旧物理名は表の真ん中で隠されている**（端ではない）。移行のために
