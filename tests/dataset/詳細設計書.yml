  # ── 5. 性能と試験 ──────────────────────────────────────────
  - 名前: 性能と試験
    なぜ: |
      **24 時間を超える経過時間は時刻ではない。** 月次締めの累計処理時間は
      `27:30` で、`[h]:mm` 書式でしか画面に出ない ―― 時刻として読むと
      `03:30` になる値なので、書式を落とすと**1 日ぶん短く見える**。

      **合計の欄には計算結果が保存されていない。** このブックを書いたのは
      LibreOffice で（ブックのプロパティの作成アプリ）、数式のキャッシュを
      持たないまま配られている ―― 「空欄に見えるが機械が読めていない」という
      申告に、**資料の側の理由がある**ことがこの 1 冊で突き合わせられる。

      試験の実施は日時（日付と時刻の両方）で入っている。日付だけの欄・時刻
      だけの欄・経過時間の欄と 4 種類が 1 枚に並ぶのは詳細設計書だけである。
    表:
      A1:
        - [区分, 項目, 目標, 実測, 測定日時, 備考]
        - [性能, 想定受注件数, 8000 件/日, ~, ~, 基本設計書 7 節より]
        - [性能, 画面応答（登録）, {経過: '0:03'}, {経過: '0:02'},
           {日時: '2026-07-28T22:15:00'}, 与信サービスの応答を含む]
        - [性能, 月次締めの累計処理時間, {経過: '30:00'}, {経過: '27:30'},
           {日時: '2026-07-26T02:00:00'}, 24 時間を超える（日跨ぎ）]
        - [性能, 与信サービスのタイムアウト, {経過: '0:03'}, ~, ~, 1.4 版で追記]
        - [試験, 単体試験の実施, ~, ~, {日時: '2026-07-21T18:40:00'}, 項目数 214]
        - [試験, 結合試験の実施, ~, ~, {日時: '2026-07-28T22:15:00'}, 項目数 96]
        - [試験, 試験項目の合計, ~, '=SUM(F6:F7)', ~, 計算結果が入っていない]
    列幅: {A: 8, B: 26, C: 14, D: 14, E: 20, F: 30}
    書式:
      C3:D5: '[h]:mm'
      E3:E8: 'yyyy/mm/dd hh:mm'
    印刷:
      ヘッダ左: SCR001 受注登録
      ヘッダ中: 詳細設計書 第 1.4 版
      ヘッダ右: 社外秘（取扱注意）
      フッタ右: "&P / &N"
      見出し行: '1:1'

パーツ:
  # **この 1 冊を書いたのは Excel ではない。** 受託先が LibreOffice で作って
  # 配ったブックで、そのぶん数式のキャッシュが 1 つも入っていない ――
  # 「計算結果が保存されていない」という申告に資料の側の理由がある、という
  # 突き合わせがこの 1 冊でだけできる（`設計書.yml` は Microsoft Excel）。
