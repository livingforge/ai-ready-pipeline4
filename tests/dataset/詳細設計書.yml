      A10: '　2-2. 応答が 3 分で返らなければ 1 分あけて再送する（最大 3 回）'
      A11: '　　2-2-1. 3 回とも返らなければ保留とし、翌営業日に再判定する'
      A12: '　　2-2-2. 保留の受注は出荷指示に乗せない'
      A14: '3. 在庫引当'
      A15: '　3-1. 商品コードごとに引当可能数を確認する'
      A16: '　3-2. 引当できない明細は受注を確定させない'
      A18: '4. 登録'
      A19: '　4-1. 受注番号を採番する'
      A20: '　4-2. ヘッダと明細を同一トランザクションで登録する'
      A21: '　4-3. 排他は更新日時の照合による楽観ロックとする'
    列幅: {A: 56}
    コメント:
      A21: {記入者: 藤代, 本文: 悲観ロックから楽観ロックへ変更（2026-07-24 レビュー）。行ロックの待ちが月次締めと競合したため}
    印刷:
      ヘッダ左: SCR001 受注登録
      ヘッダ中: 詳細設計書 第 1.4 版
      ヘッダ右: 社外秘（取扱注意）
      フッタ右: "&P / &N"
    描画:
      - 箱: [[入力チェック, E1001〜E1011]]
        id: 101
        位置: D3:F6
