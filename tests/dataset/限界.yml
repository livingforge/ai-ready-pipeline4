# **機械は読めるが、読み手（整理層）には入らない資料。**
#
# ここまでの検体は「機械が読み落とすもの」を突いてきた。こちらは逆で、
# **1 セルも落とさずに読めているのに、出来上がりが誰にも読めない**形である
# ―― 6,000 行の一覧、83 列の CRUD 図、3 万字の 1 セル、120 個の箱。
# どれも**現場に普通にあり**、しかも**整理層（LLM）の一度に読める量を超える**。
#
# 規律はここでも同じところに戻る ―― **黙って切らない**。先頭だけ出して
# 「読みました」と言うのが、この形でいちばん起きやすい失敗である（読み手は
# 出来上がりを見て「資料はこれだけだった」と思う ―― 読み落としより気付けない）。
# 大きすぎることは、値と同じように**事実として言う**しかない。
#
# `規模.yml` との違いは**桁**である。あちらは「先頭 20 行では小さい表と
# 見分けが付かない 1,200 行」で、こちらは**分けて読ませるしかない量**である
# ―― 1 枚を最後まで読む、という前提そのものが成り立たない。
#
# 企業名・製品名・担当者名はすべて架空である。

置き場: 資料/P/移行対象一覧（全件）.xlsx
なぜ: |
  **抽出ツールが吐いた全件一覧。** 移行の対象を機械が数え上げた資料で、
  6,000 行 × 30 列（18 万セル）ある ―― 人はこれを読まず、**絞ってから読む**。
  それでも資料であることに変わりはないので、機械は 1 行も落とせない。

  ここで出るものは 3 つあり、どれも**量そのものが性質**である。

  1. **1 枚が整理層に入らない。** 出来上がりは Markdown で数 MB になる ――
     読み手が一度に読める量ではないので、**何行あるかと、どこで切ったか**が
     出ていないと「読んだ」と言えない。番地さえ付いていれば分けて読める
  2. **見出しが表の途中で 6 回繰り返す。** 紙に刷るための様式で、50 行ごとに
     見出しを打ち直してある ―― 1 枚目の見出しだけを見出しと決めると、
     残り 5 回ぶんが**データ行として並ぶ**（`No` という名前の対象が 5 件できる）
  3. **同じ表が 1 枚に 2 面付けしてある。** 左が 1〜50、右が 51〜100 で、
     見出しも 2 組ある ―― 紙 1 枚に収めるための組み方で、**横に繋がった
     1 つの表と読むと列が 2 倍**になり、右の見出しが値の列に化ける
シート:
  # ── 1. 移行対象（全件） ────────────────────────────────────
  - 名前: 移行対象
    なぜ: |
      **6,000 行 × 30 列。** 1 行がどういう形かは 1 行目を見れば分かり、
      6,000 行が同じ形をしていることこそがこの資料の性質である ―― だから
      検体も**繰り返しであることを宣言**して書いてある（`生成`）。

      **横も長い。** 30 列あるので 1 行が 1 画面に収まらず、Markdown の表に
      すると 1 行が 300 字を超える ―― 縦にも横にも読み手の限界を超える、
      という形は `詳細設計書.yml`（16 列）の先にある。

      値は**わざと単調にしてある**。実物の抽出結果がそうだからで、
      **どこかに 1 行だけ違うものが混ざっていても人には見つけられない**
      （4,000 行目だけ状態が `保留` になっている ―― 機械が全部出していない
      かぎり、その 1 行は誰の目にも触れない）。
    表:
      A1:
        - [No, 業務, サブシステム, 対象種別, 物理名, 論理名, スキーマ, 件数,
           サイズ, 移行方式, 変換要否, 変換規則, 移行順, 依存, 実施予定日,
           実施者, 検証方法, 検証者, 結果, 差分, 再実施, 起票日, 起票者,
           承認, 承認日, 版, 出典, 元行番号, 状態, 備考]
    生成:
      - 起点: A2
        行数: 6000
        雛形:
          ['{n}', 受注, OMS, テーブル, 'T_ORDER_{n:05}', '受注明細{n}', OMSPRD,
           '{n}', '{n}', 一括, 要, 'CNV-{n:04}', '{n}', 'T_ORDER', '2026-09-05',
           郡司, 件数突合, 名倉, 未実施, '0', 無, '2026-07-01', 郡司,
           未承認, ~, '1.0', '抽出ツール v3', '{n}', 未着手, ~]
      # **4,000 行目だけ状態が違う。** 全部出ていなければ誰の目にも触れない
      - 起点: AC4001
        行数: 1
        雛形: [保留]

  # ── 2. 繰り返す見出し ──────────────────────────────────────
  - 名前: 繰り返す見出し
    なぜ: |
      **1 つの表の中に見出しが 6 回ある。** 50 行ごとに見出しを打ち直すのは
      紙に刷る様式で、実物の一覧表ではごく普通である（ページの頭に見出しが
      無い紙は読めない）。**印刷の繰り返し見出し**（`print_title_rows`）を
      使わずに手で入れてある資料がこの形になる。

      表としては 1 つなので、見出しの行も**そのまま値として並ぶ**しかない
      ―― 落とすと資料に無い形になり、見出しと決めると 5 回ぶんが消える。
      機械にできるのは**そう書いてあると出すこと**だけで、6 回のうち
      どれが見出しかを決めるのは整理層である。
    表:
      A1: [[No, 対象, 件数, 移行方式, 実施日, 状態]]
      A52: [[No, 対象, 件数, 移行方式, 実施日, 状態]]
      A103: [[No, 対象, 件数, 移行方式, 実施日, 状態]]
      A154: [[No, 対象, 件数, 移行方式, 実施日, 状態]]
      A205: [[No, 対象, 件数, 移行方式, 実施日, 状態]]
      A256: [[No, 対象, 件数, 移行方式, 実施日, 状態]]
    生成:
      - {起点: A2, 行数: 50, 開始: 1,
         雛形: ['{n}', 'M_ITEM_{n:04}', '{n}', 一括, '2026-09-05', 未着手]}
      - {起点: A53, 行数: 50, 開始: 51,
         雛形: ['{n}', 'M_ITEM_{n:04}', '{n}', 一括, '2026-09-05', 未着手]}
      - {起点: A104, 行数: 50, 開始: 101,
         雛形: ['{n}', 'M_ITEM_{n:04}', '{n}', 一括, '2026-09-05', 未着手]}
      - {起点: A155, 行数: 50, 開始: 151,
         雛形: ['{n}', 'M_ITEM_{n:04}', '{n}', 一括, '2026-09-05', 未着手]}
      - {起点: A206, 行数: 50, 開始: 201,
         雛形: ['{n}', 'M_ITEM_{n:04}', '{n}', 一括, '2026-09-05', 未着手]}
      - {起点: A257, 行数: 50, 開始: 251,
         雛形: ['{n}', 'M_ITEM_{n:04}', '{n}', 一括, '2026-09-05', 未着手]}
    列幅: {A: 6, B: 16, C: 8, D: 10, E: 12, F: 8}
    印刷:
      ヘッダ左: 移行対象一覧（全件）
      フッタ右: "&P / &N"

  # ── 3. 2 面付け ────────────────────────────────────────────
  - 名前: ２面付け
    なぜ: |
      **同じ表が左右に 2 つ並んでいる。** 紙 1 枚に 100 行を収めるための組み方で、
      左が 1〜50、右が 51〜100 である ―― **右は左の続き**であって、別の表では
      ないし、横に繋がった 1 つの表でもない。

      間を 1 列しか空けていないのがこの様式の要点である（実物もそう組む）。
      **1 つの塊と読むと 13 列の表**になり、右の見出し（`No` `対象` …）が
      6 列目以降の値として並ぶ ―― 見出しが 2 組あることも、番号が 51 から
      続いていることも、そこでは読めなくなる。

      どちらに読むかを決めるのは整理層である。機械が出せるのは**番地**で、
      `H1` に見出しがあることが分かれば、人は 2 面付けだと分かる。
    表:
      A1: [[No, 対象, 件数, 移行方式, 実施日, 状態]]
      H1: [[No, 対象, 件数, 移行方式, 実施日, 状態]]
    生成:
      - {起点: A2, 行数: 50, 開始: 1,
         雛形: ['{n}', 'T_LOG_{n:04}', '{n}', 一括, '2026-09-12', 未着手]}
      - {起点: H2, 行数: 50, 開始: 51,
         雛形: ['{n}', 'T_LOG_{n:04}', '{n}', 一括, '2026-09-12', 未着手]}
    列幅: {A: 6, B: 14, C: 8, D: 10, E: 12, F: 8, G: 2,
           H: 6, I: 14, J: 8, K: 10, L: 12, M: 8}
    印刷:
      ヘッダ左: 移行対象一覧（全件）
      フッタ右: "&P / &N"

  # ── 4. 注意事項（1 セルに 3 万字） ─────────────────────────
  - 名前: 注意事項
    なぜ: |
      **1 つのセルに 3 万字入っている**（Excel の上限は 32,767 字）。移行の
      注意事項を欄に貼り込んだ資料は実物にあり、**この 1 セルだけで整理層の
      読める量を使い切る** ―― 6,000 行の一覧とは逆に、塊も表も 1 つしか無い。

      切って出すと**どこで切ったかが値に見える**（続きがあることは資料に
      書かれていない）。切らずに出すと読み手が詰まる。どちらにしても
      **何字あるかを言う**ことでしか、次の手は決められない。

      画面では折り返して 400 行ぶんの高さになるが、セルは 1 つである ――
      「1 セル ＝ 1 つの値」という前提が、量のほうで崩れる形である。
    セル:
      A1: 移行にあたっての注意事項
      A3: {繰り返す: '本項の詳細は移行計画書（第 2.1 版）第 4 章による。', 回数: 1200}
      A5: 以上
    列幅: {A: 60}
    # Excel の行高の上限は 409 ポイントで、**3 万字はそれでも収まらない**
    # ―― 実物を開いても最後まで見えないことまで含めて写してある
    行高: {3: 409}
    折り返し: [A3]

---

置き場: 資料/P/CRUD図.xlsx
なぜ: |
  **横に 83 列ある表と、右下の隅に 1 セルだけある表。** どちらも「表の枠」の
  ほうが際どい形で、値そのものは何も難しくない。

  CRUD 図は日本の設計書でいちばん横に長い様式である ―― テーブル 1 本につき
  `C` `R` `U` `D` の 4 列が並ぶので、20 本で 80 列になる。しかも中身は
  **○ が飛び飛びに散っているだけ**で、1 行の 8 割は空欄である。

  もう 1 枚は逆で、**中身が 2 か所しか無いのに枠が最大**になる。Ctrl+End が
  最終セル（`XFD1048576`）へ飛ぶブックは実物にごく普通にあり（誤って最終行に
  値を入れて保存した・ツールが枠を広げた）、**枠は 17 億セル**になる。
シート:
  # ── 1. CRUD 図（83 列・3 段見出し） ────────────────────────
  - 名前: CRUD図
    なぜ: |
      **3 段見出しの横に長い表。** 上段はテーブル名、中段は `C` `R` `U` `D`、
      左の 3 列は縦結合で 2 行ぶんある ―― `様式.yml` の機能一覧表（10 列）と
      同じ組み方が、**83 列で起きる**。

      **上段は結合していない。** テーブル名は 4 列のうち先頭（`D2` `H2` …）に
      だけ書いてあり、残り 3 列は空欄である ―― 結合してある資料と画面上は
      よく似ているが、機械から見ると**まったく別の形**になる（結合なら
      広げてはいけない側、こちらはもともと 1 列ぶんの値である）。

      **○ は飛び飛びに散っている。** 1 行の 8 割が空欄なので、塊として
      切り出すと数千に散る形である（`test_塊が数千に散っても実用的な時間で
      終わる` が組み立てていたのと同じ形が、実物の 1 枚として入った）。

      **1 行が Markdown で 300 字近くになる**（見出しの行は 412 字）。縦に長い
      表は分けて読めるが、**横に長い表は 1 行すら分けられない** ―― 1 行の
      途中で切ると、そこから先が「どの列の値か」を誰も言えなくなる
      （83 列のうち 80 列は同じ `C` `R` `U` `D` の繰り返しで、**列の名前は
      左端から数えるしか無い**）。
    表:
      A1: [[機能 × テーブル CRUD 図（受注管理システム）]]
      A2: [[機能ID, 機能分類, 機能名]]
    生成:
      # 上段の見出し（テーブル名）―― 4 列ぶんを 1 つの名前が受け持つ
      - 起点: D2
        行数: 1
        横回数: 20
        雛形: ['T{m:02} 受注{m}', ~, ~, ~]
      # 中段の見出し ―― `C` `R` `U` `D` が 20 回繰り返す
      - 起点: D3
        行数: 1
        横回数: 20
        雛形: [C, R, U, D]
      - 起点: A4
        行数: 200
        雛形: ['F{n:03}', 受注受付, '受注{n}']
      # **○ は飛び飛び**（1 行の 8 割は空欄）
      - 起点: D4
        行数: 200
        横回数: 20
        雛形: [~, ○, ~, ~]
    結合:
      - A1:F1
      - A2:A3      # 左の 3 列は縦結合（3 段見出しの左端）
      - B2:B3
      - C2:C3
    印刷:
      ヘッダ左: CRUD 図
      フッタ右: "&P / &N"
      見出し行: '2:3'
      見出し列: 'A:C'

  # ── 2. 最終セル（枠が 17 億） ──────────────────────────────
  - 名前: 最終セル
    なぜ: |
      **中身は 2 か所、枠は `A1:XFD1048576`。** 実物では「Ctrl+End が最終セルへ
      飛ぶ」ブックとして現れ、誰かが誤って最終行に値を入れて保存したか、
      ツールが枠を広げたまま配られたかである ―― **人は右下の 1 セルに気付けない**
      （画面をいくら送っても出てこない）。

      枠を先に決めて中身の薄さで捨てる、という手が効かない側の検体でもある
      ―― 塊は左上と右下の 2 つに分かれるので、**格子を組む相手は小さい**。
      危ないのは枠の大きさを見て格子を組みにいく実装で、17 億マスは
      どんな計算機でも組めない。

      右下の値は**空白ではなく文字**である。空白だけのセルは「画面では空欄と
      見分けが付かない」側（`表.yml`）で、こちらは**値がある**のに誰も
      見ていない ―― 出さなければ、なぜ枠が巨大なのかを誰も説明できない。
    セル:
      A1: 移行対象一覧（作業用）
      A3: No
      B3: 対象
      A4: 1
      B4: 顧客マスタ
      XFD1048576: 削除済（貼り付けの残り）

---

置き場: 資料/P/業務フロー（全体）.xlsx
なぜ: |
  **1 枚に図形が 120 個以上ある。** 部分の業務フロー（`様式.yml`）を全部
  繋いだ「全体版」で、実物では A3 に刷って壁に貼る 1 枚である ―― 紙に収める
  ために**段組み**にしてあり、縦に 40 個並べたら右へ折り返す。

  ここで出るものは 2 つある。

  1. **段をまたぐ繋がりに線が無い。** 段の終わりと次の段の頭は、丸印の中の
     記号（`Ａ` `Ｂ`）でしか繋がっていない ―― 実物の描き方で、**線を辿ると
     3 本の別々の鎖に見える**。記号で繋ぐのは人の約束なので、機械が
     繋げてはいけない（座標から線を復元しないのと同じ側にある）
  2. **図形の一覧そのものが読み手に入らない。** 120 個の箱と 117 本の接続を
     並べると、それだけで表 1 枚ぶんの量になる ―― **図が大きいほど、
     「絵にして読め」という案内が効かなくなる**（`arp4 render` で撮った
     1 枚も、人が読める大きさではない）
シート:
  # ── 1. 全体フロー（箱 120・線 117） ────────────────────────
  - 名前: 全体フロー
    なぜ: |
      **箱 120 個・接続 117 本。** 検体に 120 個の箱を 1 つずつ書くことは
      できない（読めなくなるだけで突くものが増えない）ので、**並べ方を
      宣言**してある ―― 40 個で 1 段、3 段で 120 個である。

      **繋いであるのは段の中だけ**で、段をまたぐところに線は無い。
      丸印（`Ａ` `Ｂ`）が 2 つずつ置いてあり、実物ではそれが繋がりを表す。
    セル:
      A1: 受注業務フロー（全体版）
    描画:
      - 生成:
          個数: 120
          形: flowChartProcess
          箱: ['{n:03}', '工程{n}']
          名前: 工程{n}
          並び: {起点: B3, 幅: 5, 高さ: 3, 行間: 1, 列間: 1, 行数: 40}
          id起点: 1000
          繋ぐ: 縦
      # **段をまたぐ繋がりは記号にしかない。** 線は 1 本も引かれていない
      - 箱: ['Ａ']
        id: 2001
        名前: 継ぎ（1 段目の終わり）
        形: flowChartConnector
        位置: B163:C165
      - 箱: ['Ａ']
        id: 2002
        名前: 継ぎ（2 段目の頭）
        形: flowChartConnector
        位置: H1:I2
      - 箱: ['Ｂ']
        id: 2003
        名前: 継ぎ（2 段目の終わり）
        形: flowChartConnector
        位置: H163:I165
      - 箱: ['Ｂ']
        id: 2004
        名前: 継ぎ（3 段目の頭）
        形: flowChartConnector
        位置: N1:O2

  # ── 2. 画面レイアウト（図形 150・線なし） ──────────────────
  - 名前: 画面レイアウト
    なぜ: |
      **図形が 150 個あるのに、線は 1 本も無い。** 画面レイアウトを図形で
      描いた 1 枚で、ラベルと入力枠が交互に並ぶ ―― 方眼にセルで描く様式
      （`規模.yml` の画面方眼紙）と**同じものを図形で描いた**形である。

      ラベルには文字があり、入力枠には**文字が無い**（枠だけの箱が 75 個）
      ―― 何の欄かはラベルとの位置関係にしか無いので、**番地が落ちると
      150 個の箱が「文字 75 個と空の箱 75 個」になる**。位置から対応を
      当てるのは意味の判断で、機械の仕事ではない。
    セル:
      A1: 受注入力画面 レイアウト
    描画:
      - 生成:
          個数: 75
          形: rect
          箱: ['項目{n:02}']
          名前: ラベル{n}
          寄せ: 左
          並び: {起点: B3, 幅: 4, 高さ: 2, 行間: 1, 列間: 6, 行数: 15}
          id起点: 3000
      # **文字を持たない入力枠。** 何の欄かはラベルとの位置関係にしか無い
      - 生成:
          個数: 75
          形: rect
          箱: []
          名前: 入力枠{n}
          並び: {起点: F3, 幅: 5, 高さ: 2, 行間: 1, 列間: 5, 行数: 15}
          id起点: 3200
