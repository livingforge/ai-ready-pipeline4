    attrs: { nf_category: 性能・拡張性, metric: 2 秒以内,
             measurement: 同時 30 セッションの 90 パーセンタイル }
    source: { anchor: s10-t1 }
  - concept: c-bill-自動消込の処理時間
    type: 非機能要件
    name: 自動消込バッチの処理時間
