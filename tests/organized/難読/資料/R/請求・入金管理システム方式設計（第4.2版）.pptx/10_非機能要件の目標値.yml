    attrs: { nf_category: 性能・拡張性, metric: 1 時間以内,
             measurement: '入金明細 20,000 件／日' }
    source: { anchor: s10-t1 }
  - concept: c-bill-月次締めの処理時間
    type: 非機能要件
    name: 月次締めの処理時間
